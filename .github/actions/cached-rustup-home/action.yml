name: Cached rustup Home
description: Keeps rustup's toolchains on the Namespace cache volume

# Use after nscloud-cache-action, with ~/.cache/rustup among its paths.
runs:
  using: composite
  steps:
    - name: Point RUSTUP_HOME at the cache volume
      shell: bash
      run: |
        # rustup keeps its toolchains in RUSTUP_HOME (~/.rustup), which is not
        # on the cache volume, so every job downloaded the toolchains that the
        # rust-toolchain.toml files pin all over again. Caching ~/.rustup in
        # place would mount an empty directory over the image's, hiding its
        # default toolchain (bare `cargo` and `cargo fmt` from the repo root
        # use it), so use a separate cached directory, seeded from the
        # image's ~/.rustup.
        #
        # Seed again whenever the image's toolchains or default change (the
        # stamp covers its settings.toml and each toolchain's channel
        # manifest); otherwise a warm cache would keep the old default while a
        # fresh one gets the new, and `cargo fmt` could differ between runners.
        # Toolchains downloaded into the cache are kept either way.
        cache="$HOME/.cache/rustup"
        mkdir -p "$cache"
        stamp=""
        if [ -d "$HOME/.rustup" ]; then
          stamp=$( (cd "$HOME/.rustup" && cat settings.toml \
            toolchains/*/lib/rustlib/multirust-channel-manifest.toml \
            2>/dev/null; true) | cksum)
        fi
        if [ "$(cat "$cache/.seeded-from-image" 2>/dev/null)" != "$stamp" ]; then
          if [ -d "$HOME/.rustup" ]; then
            cp -a "$HOME/.rustup/." "$cache/"
          fi
          printf '%s\n' "$stamp" >"$cache/.seeded-from-image"
        fi
        echo "RUSTUP_HOME=$cache" >> "$GITHUB_ENV"
