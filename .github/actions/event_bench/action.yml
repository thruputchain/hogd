name: "Run Event Server Bench"
description: "Run the event server benchmarks"
inputs:
  build-dir:
    description: "Build directory to use"
    required: true
    type: string
  work-dir:
    description: "Work directory to use"
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: make sure bench server is running
      run: |
        ./scripts/wait-port.sh hog11 11111
      shell: bash
    - name: clear work dirs
      run: |
        ./${{ inputs.build-dir }}/hogd/hogexec/bench/control_cli hog11 11111 clear_work_dir
      shell: bash
    - name: launch event server
      run: ./${{ inputs.build-dir }}/hogd/hogexec/bench/control_cli hog11 11111 start hogd/event/event_exec hog10:8091 ${{ inputs.work-dir }}/
      shell: bash
    - name: make sure event server is running
      run: |
        ./${{ inputs.build-dir }}/hogd/hogexec/bench/control_cli hog11 11111 expect_running
      shell: bash
    - name: wait for event server ports
      run: |
        ./scripts/wait-port.sh hog11 8090
        ./scripts/wait-port.sh hog11 8091
      shell: bash
    - name: run event server benchmark
      run: ./${{ inputs.build-dir }}/hogd/event/event_server_bench -e hog11:8090 -s hog11:8091 -n 1000000 -c 10 -o 100 > event_server_bench_log
      shell: bash
    - name: clone metrics history # This is idempotent
      run: ./scripts/clone_metrics_history.sh
      shell: bash
    - name: log event server metrics
      run: ./scripts/log_metric.sh event_server_bench event_server_bench_log
      shell: bash

    - name: stop event server
      if: always()
      shell: bash
      run: |
        ./${{ inputs.build-dir }}/hogd/hogexec/bench/control_cli hog11 11111 stop

