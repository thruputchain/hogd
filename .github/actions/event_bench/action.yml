name: "Run Event Server Bench"
description: "Run the event server benchmarks"
inputs:
  build-dir:
    description: "Build directory to use"
    required: true
    type: string
  work-dir:
    description: "Work directory to use"
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: set port env vars
      run: |
        echo "EVENT_EXECUTOR_PORT=$(./${{ inputs.build-dir }}/hogd/utils/get_port kEventExecutorServerPort)" >> $GITHUB_ENV
        echo "EVENT_MEMPOOL_PORT=$(./${{ inputs.build-dir }}/hogd/utils/get_port kEventMempoolServerPort)" >> $GITHUB_ENV
      shell: bash
    - name: make sure bench server is running
      run: |
        ./scripts/wait-port.sh hog11 11111
      shell: bash
    - name: clear work dirs
      run: |
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog11 11111 clear_work_dir
      shell: bash
    - name: launch event server
      run: ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog11 11111 start hogd/hog_event/hog-event --mempool-addr hog10:8095 --work-dir ${{ inputs.work-dir }}/
      shell: bash
    - name: make sure event server is running
      run: |
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog11 11111 expect_running
      shell: bash
    - name: wait for event server ports
      run: |
        ./scripts/wait-port.sh hog11 ${{ env.EVENT_EXECUTOR_PORT }}
        ./scripts/wait-port.sh hog11 ${{ env.EVENT_MEMPOOL_PORT }}
      shell: bash
    - name: run event server benchmark
      run: ./${{ inputs.build-dir }}/hogd/hog_event/event_server_bench -e hog11:${{ env.EVENT_EXECUTOR_PORT }} -s hog11:${{ env.EVENT_MEMPOOL_PORT }} -n 1000000 -c 40 -o 100 > event_server_bench_log
      shell: bash
    - name: clone metrics history # This is idempotent
      run: ./scripts/clone_metrics_history.sh
      shell: bash
    - name: log event server metrics
      run: ./scripts/log_metric.sh event_server_bench event_server_bench_log
      shell: bash

    - name: stop event server
      if: always()
      shell: bash
      run: |
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog11 11111 stop

