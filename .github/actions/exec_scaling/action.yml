name: "Run Multiexec interface Bench"
description: "Run the multiexec interface benchmarks"
inputs:
  build-dir:
    description: "Build directory to use"
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: set port env vars
      run: |
        echo "CI_CONTROL_PORT=$(./${{ inputs.build-dir }}/hogd/utils/get_port kCIControlServerPort)" >> $GITHUB_ENV
      shell: bash
    - name: make sure bench servers are running
      run: |
        ./scripts/wait-port.sh hog6 ${{ env.CI_CONTROL_PORT }}
        ./scripts/wait-port.sh hog7 ${{ env.CI_CONTROL_PORT }}
        ./scripts/wait-port.sh hog8 ${{ env.CI_CONTROL_PORT }}
        ./scripts/wait-port.sh hog11 ${{ env.CI_CONTROL_PORT }}
      shell: bash
    - name: clone metrics history #idempotent
      run: ./scripts/clone_metrics_history.sh
      shell: bash

    - name: launch multiexec runner one exec
      run: ./${{ inputs.build-dir }}/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -a 100 > multiexec_runner_log
      shell: bash
    - name: launch multiexec runner two exec
      run: ./${{ inputs.build-dir }}/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -a 100 >> multiexec_runner_log
      shell: bash
    - name: launch multiexec runner three exec
      run: ./${{ inputs.build-dir }}/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog6 -a 100 >> multiexec_runner_log
      shell: bash
    - name: log multiexec runner logs
      run: ./scripts/log_metric.sh multiexec_interface multiexec_runner_log
      shell: bash
    - name: cleanup control servers
      if: always()
      run: |
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog6 ${{ env.CI_CONTROL_PORT }} stop
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog7 ${{ env.CI_CONTROL_PORT }} stop
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog8 ${{ env.CI_CONTROL_PORT }} stop
        ./${{ inputs.build-dir }}/hogd/hog_exec/bench/control_cli hog11 ${{ env.CI_CONTROL_PORT }} stop
      shell: bash