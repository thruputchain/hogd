name: "Prepare Environment"
description: "Prepare the environment for building hogd"
runs:
  using: "composite"
  steps:
    - name: gcc version check
      run: gcc --version
      shell: bash
    - name: clang version check
      run: clang --version
      shell: bash
    - name: Add Cargo to PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash
    - name: path check
      run: echo $PATH
      shell: bash
    - name: cargo version check
      run: cargo --version
      shell: bash
    - name: cargo fetch
      run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/fetch.sh
      shell: bash
    - name: set gcc-15 in check
      run: echo "GCC_CC=gcc-15 GCC_CXX=g++-15" > ./scripts/conf.sh && chmod u+x ./scripts/conf.sh
      shell: bash