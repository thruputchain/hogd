name: Print Log Download Instructions
description: Prints GitHub CLI command to view logs for the current job

runs:
  using: composite
  steps:
    - name: Print log download instructions
      if: always()
      shell: bash
      run: |
        RESPONSE=$(curl -s \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
        
        echo "$RESPONSE"

        JOB_ID=$(echo $RESPONSE | jq -r ".jobs[] | select(.name == \"${{ github.job }}\") | .id")

        echo "To download logs, run"
        echo "gh run view --log --job $JOB_ID --repo ${{ github.repository }}"
