name: Private sources
description: Authenticate transferred private sources with a job-local read-only App token
inputs:
  app-id:
    description: Component reader GitHub App ID
    required: true
  private-key:
    description: Component reader GitHub App private key
    required: true
  ssh-private-key:
    description: Deploy keys for repositories still in groundhogchain
    required: true
runs:
  using: composite
  steps:
    - name: Mint component reader token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: thruputchain
        repositories: |
          hogd
          chuckd
          hogx
          thruput-protocol
          thruput-protocol-go
          thruput-protocol-rs
          lib-go
          thruput-go
          thruput-integration-test-contracts
          scp
          thruput-sdk-rs
        permission-contents: read
    - name: Configure job-local Git authentication
      shell: bash
      env:
        COMPONENT_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        set +x
        set -euo pipefail
        umask 077
        export GIT_CONFIG_GLOBAL
        GIT_CONFIG_GLOBAL="$(mktemp "$RUNNER_TEMP/private-sources.XXXXXX")"
        echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

        # Full .git URLs prevent prefix collisions between protocol repositories.
        # Explicit .git entries win over no-suffix HTTPS entries (longest match).
        while read -r old new; do
          target="https://x-access-token:${COMPONENT_TOKEN}@github.com/thruputchain/${new}.git"
          for source in "groundhogchain/$old" "thruputchain/$new"; do
            git config --global --add "url.${target}.insteadOf" "git@github.com:${source}.git"
            git config --global --add "url.${target}.insteadOf" "ssh://git@github.com/${source}.git"
            git config --global --add "url.${target}.insteadOf" "https://github.com/${source}.git"
            git config --global --add "url.${target}.insteadOf" "https://github.com/${source}"
          done
        done <<'REPOSITORIES'
        hogd hogd
        chuckd chuckd
        hogx hogx
        protocol thruput-protocol
        protocol-go thruput-protocol-go
        protocol-rs thruput-protocol-rs
        lib-go lib-go
        groundhog-go thruput-go
        integration_test_contracts thruput-integration-test-contracts
        scp scp
        sdk_rs thruput-sdk-rs
        REPOSITORIES
    - name: Load remaining groundhogchain deploy keys
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
