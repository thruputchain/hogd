version: 2
updates:
  # Rust dependencies - hogd rust workspace
  - package-ecosystem: "cargo"
    directory: "/hogd/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "gramseyer"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"


