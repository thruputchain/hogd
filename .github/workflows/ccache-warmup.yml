name: CCache Warmup (hog_sched)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  push:
    branches: ["main"]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  # Published crates and pinned submodules retain the legacy registry identity.
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER: cargo:token
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  HOGD_CCACHE_WARMUP_JOBS: "auto"

jobs:
  warmup:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read

    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Run hog schedule
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"

          is_superseded() {
            if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
              return 1
            fi

            local main_sha
            if ! main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }'); then
              echo "::warning::Could not check whether the ccache warmup was superseded"
              return 1
            fi

            [[ "$main_sha" != "$GITHUB_SHA" ]]
          }

          if is_superseded; then
            echo "A newer commit is already on main; skipping this ccache warmup"
            exit 0
          fi

          hog_sched \
            --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_commit --value=${{ github.sha }} \
            --key=git_branch --value="$BRANCH_NAME" \
            --key=hogd_ccache_warmup_jobs --value=${{ env.HOGD_CCACHE_WARMUP_JOBS }} \
            --key=cargo_registry_token --value=${{ secrets.GROUNDHOG_REGISTRY_TOKEN }} \
            --key=cargo_registry_global_credential_providers --value=${{ env.CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS }} \
            --timeout-sec=28800 \
            ./scripts/schedules/ccache_warmup.toml &
          HOG_SCHED_PID=$!

          stop_hog_sched() {
            kill -TERM "$HOG_SCHED_PID" 2>/dev/null || true
            wait "$HOG_SCHED_PID" 2>/dev/null || true
          }
          trap 'stop_hog_sched; exit 143' TERM
          trap 'stop_hog_sched; exit 130' INT

          while kill -0 "$HOG_SCHED_PID" 2>/dev/null; do
            sleep 15
            # Preserve hog_sched's result if it finished before supersession was
            # detected, especially so a real failure is never reclassified.
            if ! kill -0 "$HOG_SCHED_PID" 2>/dev/null; then
              break
            fi
            if is_superseded; then
              echo "A newer commit was merged into main; stopping this ccache warmup"
              stop_hog_sched
              trap - TERM INT
              exit 0
            fi
          done

          trap - TERM INT
          wait "$HOG_SCHED_PID"

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
