name: Combined Metrics (hog_sched)

on:
    workflow_dispatch:
    push:
        branches: ["main"]
env:
    CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
    CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
jobs:
    build:
        runs-on: self-hosted
        permissions:
            contents: read
            actions: read
            issues: write

        steps:
            - name: Clean up .gitconfig
              run: |
                  echo "Cleaning up .gitconfig"
                  rm -f /home/hogci/.gitconfig
            - uses: actions/checkout@v6
            - uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: |
                      ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
                      ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_BCS_RS_KEY }}
                      ${{ secrets.HOGD_SELF_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
                      ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
                      ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
                      ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_PROTOCOL_GO }}
                      ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
                      ${{ secrets.HOGD_TO_LIB_GO_KEY }}
                      ${{ secrets.HOGD_TO_SCP_KEY }}
                      ${{ secrets.HOGD_TO_XDR_RPC }}
                      ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
                      ${{ secrets.HOGD_TO_HOGX_KEY }}
            - name: Run hog schedule
              run: |
                  ssh hog11 'gdb -q -batch \
                    -ex "set pagination off" \
                    -ex "info threads" \
                    -ex "bt 50" \
                    -ex "thread apply all bt 10" \
                    /tmp/hogjob-hogci/release/hogd/hog_mempool/hog-mempool \
                    /tmp/hogjob-hogci/hog-mempool.3966843.core'
                  exit 1
            - name: Print Log Download Instructions
              if: always()
              uses: ./.github/actions/print-log-instructions
            - name: File failure issue
              if: failure() && github.ref == 'refs/heads/main'
              uses: ./.github/actions/file-failure-issue
