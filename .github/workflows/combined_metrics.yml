name: Combined Metrics (hog_sched)

on:
    workflow_dispatch:
    push:
        branches: ["main"]

# This schedule takes an exclusive lock on the whole bench cluster -- hog4
# through hog11 -- and holds it for the ~40-60 minutes the five benchmark
# suites take. Pushes to main land far more often than that, so without a
# concurrency group every push adds another run that can do nothing but sit in
# [hog_sched]'s lock acquisition waiting for its predecessors, three or four
# deep, until something gives up or kills it. Those runs fail without ever
# compiling a line, and each one files a ci-failure issue.
#
# [cancel-in-progress] is false on purpose, unlike the CCache Warmup schedule
# that locks the same eight hosts. Cancelling a warmup costs a warm cache;
# cancelling a benchmark run kills [hog_sched] partway through a suite, which
# both throws away the cluster time already spent and leaves control_server and
# the benchmark processes alive on eight hosts for the next run to reap. So a
# run that has started keeps the cluster until it finishes, and a newer push
# waits: GitHub keeps only the most recent pending run per group and cancels
# the older pending ones, which is the behaviour we want -- the queue never
# grows past one, and the run that eventually goes is for the newest commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
    cancel-in-progress: false

env:
    CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
    CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
jobs:
    build:
        runs-on: self-hosted
        permissions:
            contents: read
            actions: read
            issues: write

        steps:
            - name: Clean up .gitconfig
              run: |
                  echo "Cleaning up .gitconfig"
                  rm -f /home/hogci/.gitconfig
            - uses: actions/checkout@v6
            - uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: |
                      ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
                      ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_BCS_RS_KEY }}
                      ${{ secrets.HOGD_SELF_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
                      ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
                      ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
                      ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
                      ${{ secrets.HOGD_TO_PROTOCOL_GO }}
                      ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
                      ${{ secrets.HOGD_TO_LIB_GO_KEY }}
                      ${{ secrets.HOGD_TO_SCP_KEY }}
                      ${{ secrets.HOGD_TO_XDR_RPC }}
                      ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
                      ${{ secrets.HOGD_TO_HOGX_KEY }}
            - name: Run hog schedule
              run: |
                  BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
                  echo "Branch name: $BRANCH_NAME"
                  hog_sched \
                    --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
                    --key=github_repo --value=${{ github.repository }} \
                    --key=git_commit --value=${{ github.sha }} \
                    --key=git_branch --value=$BRANCH_NAME \
                    --key=cargo_registry_token --value=${{ secrets.GROUNDHOG_REGISTRY_TOKEN }} \
                    --key=cargo_registry_global_credential_providers --value=${{ env.CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS }} \
                    --timeout-sec=3600 \
                    ./scripts/schedules/combined_metrics.toml
            - name: Print Log Download Instructions
              if: always()
              uses: ./.github/actions/print-log-instructions
            - name: File failure issue
              if: failure() && github.ref == 'refs/heads/main'
              uses: ./.github/actions/file-failure-issue
