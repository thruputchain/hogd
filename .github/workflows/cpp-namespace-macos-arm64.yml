name: C++ CI (Namespace macOS ARM64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  # Published crates and pinned submodules retain the legacy registry identity.
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER: cargo:token
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_REGISTRIES_GROUNDHOG_SOURCE: sparse+https://crates.thruput.network/api/v1/crates/
  CARGO_BUILD_JOBS: "6"
  # Keeps the RV32 contracts' cargo intermediates on the cache volume (./target
  # is cached by `cache: rust`); see built_contracts/build_risc.sh.
  HOGD_RV32_TARGET_DIR: ${{ github.workspace }}/target/rv32

jobs:
  # Clang Debug build + tests
  clang-debug:
    runs-on: namespace-profile-hogd-arm64-macos
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure private sources
        uses: ./.github/actions/private-sources
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}
          ssh-private-key: |
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache
            ~/.cache/cargo-install
            ~/.cache/rustup

      - name: Configure Build Caches
        run: |
          # ccache on macOS defaults to ~/Library/Caches/ccache, which is not on
          # the cache volume, so every run started cold (933 of 1010 compiles
          # missed). Point it at the cached path, as the Linux workflows do.
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          # 10G was full and evicting on every run (a recent PR run: 57% hits,
          # 56 cleanups). The profile's cache volume is ~53G.
          echo "CCACHE_MAXSIZE=20G" >> "$GITHUB_ENV"

          # cargo install writes to ~/.cargo/bin, which the cache volume does not
          # cover, so thruput-cli and thruput-rv32-lower were compiled from
          # source on every run. Install into a cached root instead. ~/.cargo/bin
          # itself is left alone because rustup's proxies live there.
          echo "CARGO_INSTALL_ROOT=$HOME/.cache/cargo-install" >> "$GITHUB_ENV"
          echo "$HOME/.cache/cargo-install/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.cache/cargo-install/bin"
          echo "Cached cargo-install binaries:"
          ls -l "$HOME/.cache/cargo-install/bin"

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native
          cache_repo C2SP/wycheproof

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Use CommandLineTools SDK
        run: |
          # Homebrew LLVM is incompatible with some Xcode SDK versions (e.g. 26.1.1).
          # Force usage of the CommandLineTools SDK which works reliably.
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
            echo "Switched to CommandLineTools SDK: $(xcrun --show-sdk-path)"
          fi

      # macos-setup.sh ends by running scripts/fetch.sh (cargo fetch plus the
      # groundhog tool installs), so there is no separate Cargo Fetch step here.
      - name: Setup Environment
        run: |
          ./scripts/macos-setup.sh
          # ccache is not in the runner image; macos-setup.sh installs it via
          # Homebrew, so this is the first point it can run. Zero the persisted
          # counters so "Show ccache stats" reports this run only.
          ccache -z

      - name: Build Clang Debug
        run: |
          ./scripts/build.sh -d build/clang -t Debug -c clang -f "-Werror" \
            -x "-DENABLE_TEST_FFI=ON"

      # test_ffi is built on Linux by test_bindings.yml, but nothing built it
      # on macOS outside release_test_ffi.yml, so linker differences reached us
      # only at release time -- a header-inline thread_local with dynamic
      # initialization links on Linux and is a duplicate symbol under macOS ld.
      # Link the targets here; running them stays with the Linux job, since
      # what differs across platforms is the link, not the behavior.
      - name: Link test_ffi targets
        run: |
          cmake --build build/clang --parallel "$(sysctl -n hw.ncpu)" \
            --target test_ffi test_ffi_test test_ffi_mock_syscall_test \
            test_ffi_first_call_test

      - name: Pre-build Rust Test Binaries
        run: |
          cd hogd/rust
          cargo test --workspace --no-run --locked --frozen --offline
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run Tests
        run: |
          echo "::warning::Known issue: Sha2InContractTest.InvokeFFFFF is broken on ARM64 due to winch miscompilation. The test will be skipped automatically."
          
          # Enable core dumps for debugging
          ulimit -c unlimited
          ulimit -a
          sudo mkdir -p /cores
          sudo chmod 1777 /cores
          sudo sysctl -w kern.coredump=1
          sysctl kern.coredump
          defaults write com.apple.CrashReporter DialogType none
          
          cd build/clang
          ctest --output-on-failure --parallel $(sysctl -n hw.logicalcpu) --timeout 100

      - name: Show ccache stats
        if: always()
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            echo "ccache is not installed (Setup Environment did not complete)"
            exit 0
          fi
          ccache -p | grep -E 'cache_dir|max_size|base_dir' || true
          ccache -s
          python3 scripts/ci/ninja_build_profile.py build/clang

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
      - name: Remove job-local Git credentials
        if: always()
        shell: bash
        run: |
          if [[ "${GIT_CONFIG_GLOBAL:-}" == "$RUNNER_TEMP"/private-sources.* ]]; then
            rm -f -- "$GIT_CONFIG_GLOBAL"
          fi
