name: C++ CI (Namespace)

# This workflow uses a custom base image with pre-installed toolchain.
# Requires: Configure namespace-profile-hogd-linux-2604 with .devcontainer/Dockerfile as custom base image.
#
# Jobs run in parallel where possible:
#   format (fast) -> gcc-debug + llvm-debug (parallel) -> gcc-release (after gcc-debug)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Reusable setup steps as a composite (defined inline since GHA doesn't support job templates)
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "6"
  # Keeps the RV32 contracts' cargo intermediates on the cache volume (./target
  # is cached by `cache: rust`); see built_contracts/build_risc.sh.
  HOGD_RV32_TARGET_DIR: ${{ github.workspace }}/target/rv32

jobs:
  # Fast format check - gates all other jobs
  format:
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          # ~/.cache/rustup holds the toolchains (1.93.0, 1.96.0, the contracts
          # nightly; see .github/actions/cached-rustup-home). Uncached, every
          # job downloaded them again (~20s of each Cargo Fetch).
          path: |
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      # No submodules needed - format.sh formats files in main repo only

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'CLANG_FORMAT=clang-format-21' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Protocol Fetch
        run: git submodule update --init --recursive thruput-go protocol

      - name: Format Check
        run: |
          ./scripts/format.sh -c
          python3 scripts/test_sccache_env.py

      - name: Protocol Check
        run : ./scripts/check-protocol.sh

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  # GCC Debug build + tests
  gcc-debug:
    # Each build job gets its own cache volume. Every job forks the volume at
    # start and, if it succeeds, commits its copy back; the last commit wins.
    # When all jobs shared the profile's volume, each run kept only the cache
    # of whichever job finished last, so the other configurations kept losing
    # their ccache entries.
    runs-on: namespace-profile-hogd-linux-2604;overrides.cache-tag=hogd-gcc-debug
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/sccache
            ~/.cache/hogcache
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - uses: ./.github/actions/setup-sccache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native
          cache_repo C2SP/wycheproof

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'CLANG_FORMAT=clang-format-21' >> ./scripts/conf.sh
          # Limit parallelism for Debug builds - they use more memory per compile
          echo 'NPROC=20' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          # This job has its own cache volume (see runs-on). One full build
          # is 1-2 GB of ccache (gcc-debug 2.2 GB, llvm-debug 1.0 GB), so
          # 10G keeps several generations of main and open PRs.
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=gcc-debug" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          # Zero the persisted counters so "Show ccache stats" reports this
          # run, not totals accumulated over every run on the volume.
          CCACHE_DIR="$HOME/.cache/ccache" ccache -z

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build GCC Debug
        run: >-
          ./scripts/build.sh -d build/gcc -t Debug -c gcc -f "-Werror"
          -x -DCRASHDUMP_ON_TIMEOUT=ON

      # Shipped binaries must not need GCC 15's libstdc++ (see release.yml).
      - name: Check libstdc++ compatibility
        run: >-
          ./scripts/check-max-glibcxx.sh 3.4.33
          build/gcc/hogd/hog_db/hog-db build/gcc/hogd/hog_exec/hog-exec
          build/gcc/hogd/hog_mempool/hog-mempool build/gcc/hogd/hog_auth/hog-auth
          build/gcc/hogd/hog_event/hog-event build/gcc/hogd/hog_indexer/hog-indexer
          build/gcc/hogd/devnode/hog-devnode
          build/gcc/hogd/devnode/hog-hosted-bootstrap

      - name: Run Tests
        run: |
          cd build/gcc
          ctest --output-on-failure --parallel $(nproc) --timeout 120

      - name: Print backtraces from timed-out tests
        if: failure()
        run: |
          shopt -s nullglob
          bts=(/tmp/backtraces/bt.*)
          if [ ${#bts[@]} -eq 0 ]; then
            echo "No timeout backtraces captured"
            exit 0
          fi
          echo "Found ${#bts[@]} backtrace(s) from timed-out tests"
          for bt in "${bts[@]}"; do
            echo ""
            echo "================================================================"
            cat "$bt"
            echo "================================================================"
          done

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
          python3 scripts/ci/ninja_build_profile.py build/gcc

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  # LLVM/Clang Debug build + tests (runs parallel with gcc-debug)
  llvm-debug:
    runs-on: namespace-profile-hogd-linux-2604;overrides.cache-tag=hogd-llvm-debug
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/sccache
            ~/.cache/hogcache
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - uses: ./.github/actions/setup-sccache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native
          cache_repo C2SP/wycheproof

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'CLANG_FORMAT=clang-format-21' >> ./scripts/conf.sh
          # Limit parallelism for Debug builds - they use more memory per compile
          echo 'NPROC=28' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          # This job has its own cache volume (see runs-on). One full build
          # is 1-2 GB of ccache (gcc-debug 2.2 GB, llvm-debug 1.0 GB), so
          # 10G keeps several generations of main and open PRs.
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=llvm-debug" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          # Zero the persisted counters so "Show ccache stats" reports this
          # run, not totals accumulated over every run on the volume.
          CCACHE_DIR="$HOME/.cache/ccache" ccache -z

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build LLVM Debug
        run: ./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror"

      - name: Run Tests
        run: |
          cd build/llvm
          ctest --output-on-failure --parallel $(nproc) --timeout 100

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
          python3 scripts/ci/ninja_build_profile.py build/llvm

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  # GCC Release build (parallel with debug builds)
  gcc-release:
    runs-on: namespace-profile-hogd-linux-2604;overrides.cache-tag=hogd-gcc-release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/sccache
            ~/.cache/hogcache
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - uses: ./.github/actions/setup-sccache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native
          cache_repo C2SP/wycheproof

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'CLANG_FORMAT=clang-format-21' >> ./scripts/conf.sh
          # Limit parallelism for Release builds - they use more memory per compile
          echo 'NPROC=18' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          # This job has its own cache volume (see runs-on). One full build
          # is 1-2 GB of ccache (gcc-debug 2.2 GB, llvm-debug 1.0 GB), so
          # 10G keeps several generations of main and open PRs.
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=gcc-release" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
          # Zero the persisted counters so "Show ccache stats" reports this
          # run, not totals accumulated over every run on the volume.
          CCACHE_DIR="$HOME/.cache/ccache" ccache -z

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build GCC Release
        run: ./scripts/build.sh -d build/gcc_release -t Release -c gcc

      # EXCLUDE_FROM_ALL targets aren't built above, so build them here to catch breaks early.
      - name: Build Excluded Bench Targets
        run: |
          ./scripts/build.sh -d build/gcc_release -t Release -c gcc \
            schedgateway_client_bench

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
          python3 scripts/ci/ninja_build_profile.py build/gcc_release

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
