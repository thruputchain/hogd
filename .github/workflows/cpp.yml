name: C++ CI

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      CACHED_PATHS: |
        ~/bcheck
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: install gcc-14
      run: sudo apt-get install -y gcc-14 build-essential libc++-dev
    - name: install packages
      run: sudo apt-get install -y git cmake pkg-config wabt
    - name: set gcc-14 default
       # default is 13.2, unfortunately. This makes 14.0 work
      run: sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
    - name: Probe Cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CACHED_PATHS }}
        key: ${{ runner.os }}
    - name: check
      run: ./scripts/check.sh

