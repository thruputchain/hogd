name: C++ CI

on:
  push:
  
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: install gcc-14
      run: sudo apt-get install -y gcc-14 build-essential libc++-dev && gcc --version
    - name: install packages
      run: sudo apt-get install -y git cmake pkg-config wabt
    - name: set gcc-14 default
      run: sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
    - name: check
      run: ./scripts/check.sh

