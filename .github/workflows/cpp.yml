name: C++ CI

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    env:
      CACHED_PATHS: |
        bcheck
    
    steps:
    - uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: |
          ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
          ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_BCS_RS_KEY }}
          ${{ secrets.HOGD_SELF_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
          ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: gcc version check
      run: gcc --version
    - name: clang version check
      run: clang --version
    - name: Add Cargo to PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: path check
      run: echo $PATH
    - name: cargo version check
      run: cargo --version
    - name: Probe Cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CACHED_PATHS }}
        # Cmake should handle rebuilding any changed files across commits
        # The last number is a version number.  Bump the version number whenever the compiler changes,
        # to invalidate the cache (or any other time you need to manually clear the cache)
        key: ${{ runner.os }}-${{ github.ref_name }}-3
    - name: set gcc-14 in check
      run: echo "GCC_CC=gcc-14 GCC_CXX=g++-14" > ./scripts/conf.sh && chmod u+x ./scripts/conf.sh
    - name: check
      run: ./scripts/check.sh
    - uses: actions/cache/save@v4
      with:
        path: ${{ env.CACHED_PATHS }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
