name: C++ CI

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      CACHED_PATHS: |
        bcheck
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: install llvm
      run: wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 19 all && sudo apt-get remove clang-18
    - name: set gcc-14 default
       # default is 13.2, unfortunately. This makes 14.0 work
      run: sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
    - name: set clang-19 default
      run: sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 19 && sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 19
    - name: gcc version check
      run: gcc --version
    - name: clang version check
      run: clang --version
    - name: tidy
      run: touch scripts/conf.sh && echo "CLANG_TIDY=run-clang-tidy-19" > ./scripts/conf.sh && chmod u+x conf.sh && ./scripts/tidy.sh
    - name: install packages
      run: sudo apt-get install -y git cmake pkg-config wabt
    - name: install rust nightly
      run: rustup +nightly target install wasm32-unknown-unknown && rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
    - name: Probe Cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CACHED_PATHS }}
        # Cmake should handle rebuilding any changed files across commits
        key: ${{ runner.os }}-${{ github.ref_name }}
     - name: check
      run: ./scripts/check.sh
    - uses: actions/cache/save@v4
      with:
        path: ${{ env.CACHED_PATHS }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
