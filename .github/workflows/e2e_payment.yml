name: E2E Payment

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]  

jobs:
  bench_server_1:
    runs-on: client
    steps:
    - name: Setup build environment
      uses: ./.github/actions/setup-build-environment
    - name: build
      run: ./scripts/build.sh -d release -t Release -c gcc
    - name: run bench server
      run: ./release/hogd/hogexec/bench/control_server -p 11111
  
