name: Hackathon CI diagnostics (temporary test branch)
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Collect logs from the failed hackathon run
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hackathon-diagnostics"
          scp -q -oBatchMode=yes hog4:/tmp/hogd_stderr_1638371847242306_461225_jIDmFB "$RUNNER_TEMP/hackathon-diagnostics/coordinator-second.stderr.log"
          scp -q -oBatchMode=yes hog4:/tmp/hogd_stdout_1638371847242306_461225_jR5uAV "$RUNNER_TEMP/hackathon-diagnostics/coordinator-second.stdout.log"
          scp -q -oBatchMode=yes hog4:/tmp/hogd_stderr_1637904846148943_461225_QZNf4J "$RUNNER_TEMP/hackathon-diagnostics/coordinator-first.stderr.log"
          for name in summary.json report.md replay/generator.json replay/config.json; do
            scp -q -oBatchMode=yes "hog10:/tmp/hogjob-hogci/work_dir/hackathon-results/code-0/gateway-0/$name" "$RUNNER_TEMP/hackathon-diagnostics/" || true
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: hackathon-diagnostics
          path: ${{ runner.temp }}/hackathon-diagnostics/
          if-no-files-found: error
