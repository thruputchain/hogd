name: Hackathon targeted bootstrap cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Stop only the verified bootstrap from canceled run 39181095498
        shell: bash
        run: |
          python3 - <<'PYREMOTE'
          import subprocess
          allocation=subprocess.check_output(['hog_list'],text=True)
          owner=next((line.split()[-1] for line in allocation.splitlines() if line.split() and line.split()[0]=='hog7'),None)
          assert owner=='hogd-39186142499', 'Recovery benchmark must own hog7 before cleanup'
          remote="\nimport datetime,os,pathlib,select,signal\nexpected=datetime.datetime.fromisoformat('2026-10-19T00:55:14+00:00').timestamp()\nroot=pathlib.Path('/proc')\nbtime=next(int(line.split()[1]) for line in (root/'stat').read_text().splitlines() if line.startswith('btime '))\ncommand=[b'/tmp/hogjob-hogci/release/hackathon-replay',b'bootstrap',b'--corpus',b'/tmp/hogjob-hogci/work_dir/hackathon-results/code-0/gateway-0/corpus',b'--listen',b'10.100.0.107:44400']\nmatched=[]\nfor proc in root.iterdir():\n if not proc.name.isdecimal():continue\n try:\n  if proc.stat().st_uid!=os.getuid():continue\n  if (proc/'cmdline').read_bytes().rstrip(b'\\0').split(b'\\0')!=command:continue\n  fd=os.pidfd_open(int(proc.name))\n  try:\n   assert os.readlink(proc/'exe').removesuffix(' (deleted)')==command[0].decode()\n   fields=(proc/'stat').read_text().rsplit(') ',1)[1].split()\n   started=btime+int(fields[19])/os.sysconf('SC_CLK_TCK')\n   if abs(started-expected)>=3:\n    os.close(fd);continue\n   matched.append(fd)\n  except BaseException:\n   os.close(fd);raise\n except (FileNotFoundError,ProcessLookupError):continue\nassert len(matched)<=1, 'Ambiguous canceled-run process identity; refusing cleanup'\nfor fd in matched:\n signal.pidfd_send_signal(fd,signal.SIGTERM)\n poll=select.poll();poll.register(fd,select.POLLIN)\n assert poll.poll(10000), 'Verified stale bootstrap did not stop within 10 seconds'\n os.close(fd)\nprint('Verified canceled-run bootstrap stopped' if matched else 'Canceled-run bootstrap is absent')\n"
          subprocess.run(['ssh','-oBatchMode=yes','-oConnectTimeout=5','hog7','python3','-'],input=remote,text=True,check=True,timeout=30)
          PYREMOTE
