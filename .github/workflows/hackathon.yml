name: Hackathon read-only profile inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect authorized benchmark processes and profile summaries
        shell: bash
        run: |
          python3 - <<'PYREMOTE'
          import concurrent.futures,json,pathlib,subprocess
          allocation=subprocess.check_output(['hog_list'],text=True)
          owners={line.split()[0]:line.split()[-1] for line in allocation.splitlines() if line.split() and line.split()[0].startswith('hog')}
          allowed={'hogd-39183298180','hogd-39184251960'}
          remote="\nimport collections,json,os,pathlib,time\nroot=pathlib.Path('/tmp/hogjob-hogci')\nresult={'unixTime':time.time(),'processCounts':{},'files':{}}\ncounts=collections.Counter()\nfor proc in pathlib.Path('/proc').iterdir():\n if not proc.name.isdecimal():continue\n try:\n  if proc.stat().st_uid!=os.getuid():continue\n  cwd=pathlib.Path(os.readlink(proc/'cwd'))\n  if cwd==root or root in cwd.parents:counts[(proc/'comm').read_text().strip()]+=1\n except (OSError,ValueError):pass\nresult['processCounts']=dict(counts)\npaths=[root/'gateway-build.log',root/'release/build.log',root/'release/hackathon-gateway.json']\nbase=root/'work_dir/hackathon-results'\nfor pattern in ('code-*/gateway-*/profiles/*/*.txt','code-*/gateway-*/profiles/*/status.json','code-*/gateway-*/profiles/*/record.log','code-*/gateway-*/profiles/status.json','code-*/gateway-*/replay/run.json','code-*/gateway-*/summary.json'):\n paths.extend(base.glob(pattern))\nfor path in paths:\n try:\n  stat=path.stat()\n  item={'bytes':stat.st_size,'modifiedUnixTime':stat.st_mtime}\n  if path.name!='gateway-build.log' and path.name!='build.log':\n   item['text']=path.read_text(errors='replace')[:200000]\n  result['files'][str(path.relative_to(root))]=item\n except OSError:pass\nprint(json.dumps(result))\n"
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          def inspect(host):
           owner=owners.get(host)
           if owner not in allowed:return {'host':host,'skippedOwner':owner}
           response=subprocess.run(['ssh','-oBatchMode=yes','-oConnectTimeout=5',host,'python3','-'],input=remote,text=True,capture_output=True,timeout=45)
           if response.returncode:raise RuntimeError(host+': SSH inspection failed: '+response.stderr)
           result=json.loads(response.stdout)
           result.update(host=host,owner=owner)
           pathlib.Path('diagnostics',host+'.json').write_text(json.dumps(result,indent=2))
           return {'host':host,'owner':owner,'processCounts':result['processCounts'],'files':list(result['files'])}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
           for result in pool.map(inspect,['hog4','hog7','hog10']):print(json.dumps(result))
          PYREMOTE
      - name: Upload read-only diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: live-profile-inspection
          path: diagnostics/
