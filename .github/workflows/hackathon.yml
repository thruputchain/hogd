name: Hackathon targeted cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Stop verified gateway from cancelled profiling run
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allocation=subprocess.check_output(['hog_list'],text=True)
          owner=next((line.split()[-1] for line in allocation.splitlines() if line.split() and line.split()[0]=='hog4'),None)
          assert owner in ('hogd-39183298180','hogd-39184251960'), 'Host is not allocated to our active profiling experiments: '+str(owner)
          remote="import datetime,json,os,pathlib,signal,time,urllib.request,urllib.error\npid=3642533\nproc=pathlib.Path('/proc')/str(pid)\nif not proc.exists():\n print('Old gateway already absent');raise SystemExit(0)\nexe=os.readlink(proc/'exe').removesuffix(' (deleted)')\nargs=(proc/'cmdline').read_bytes().split(b'\\0')\nbtime=next(int(line.split()[1]) for line in pathlib.Path('/proc/stat').read_text().splitlines() if line.startswith('btime '))\nfields=(proc/'stat').read_text().rsplit(') ',1)[1].split()\nstarted=btime+int(fields[19])/os.sysconf('SC_CLK_TCK')\nexpected=datetime.datetime.fromisoformat('2026-10-19T00:55:33+00:00').timestamp()\nassert proc.stat().st_uid==os.getuid(), 'Gateway is not owned by the CI user'\nassert exe=='/tmp/hogjob-hogci/release/hog-gateway', exe\nassert b'--listen' in args and args[args.index(b'--listen')+1]==b'10.100.0.104:9546', 'Different command'\nassert abs(started-expected)<5, (started,expected)\ntry:r=urllib.request.urlopen('http://10.100.0.104:9547/readyz',timeout=5)\nexcept urllib.error.HTTPError as error:r=error\nwith r:health=json.load(r)\nassert health['pid']==pid and health['commit_hash']=='e8402651eb93b87023fdc0adbe12cf10c4465303', 'Different gateway identity'\nprint(json.dumps({'targetPid':pid,'executable':exe,'startedUnixSeconds':started,'action':'SIGTERM'}),flush=True)\nos.kill(pid,signal.SIGTERM)\nfor _ in range(50):\n if not proc.exists():print('Old gateway stopped');break\n time.sleep(.1)\nelse:raise RuntimeError('Old gateway did not exit after SIGTERM')\n"
          subprocess.run(['ssh','-oBatchMode=yes','-oConnectTimeout=5','hog4','python3','-'],input=remote,text=True,check=True,timeout=30)
          PY
