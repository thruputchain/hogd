name: Item lock investigation status (temporary)

on:
    push:
        branches: ["codex/cache-item-lock-handles-1817"]
        paths: [".github/workflows/item_lock_status.yml"]
    workflow_dispatch:

jobs:
    status:
        runs-on: self-hosted
        permissions:
            contents: read
        steps:
            - name: Read benchmark progress
              shell: bash
              run: |
                  for host in hog10 hog11 hog8; do
                    echo "Host: $host"
                    ssh -n -T -o BatchMode=yes -o ConnectTimeout=5 "$host" 'cd /tmp/hogjob-hogci && git rev-parse HEAD && if [ -f ab-active.txt ]; then cat ab-active.txt; fi && for f in metrics_history/metrics/item-lock-state/codex/cache-item-lock-handles-1817/3d007949b3d99a4fb3fa18af061ded62a229840b/*-recycle-*.log; do if [ -f "$f" ]; then echo "$f"; grep LOCKTRIAL "$f" | tail -3; fi; done' || true
                  done
