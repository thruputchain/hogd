name: Item lock investigation status (temporary)

on:
    push:
        branches: ["codex/cache-item-lock-handles-1817"]
        paths: [".github/workflows/item_lock_status.yml"]
    workflow_dispatch:

jobs:
    status:
        runs-on: self-hosted
        permissions:
            contents: read
        steps:
            - name: Read benchmark progress
              shell: bash
              run: |
                  ssh -T -o BatchMode=yes -o ConnectTimeout=5 hog10 python3 - <<'PY'
                  import json
                  import re
                  import subprocess
                  from pathlib import Path
                  work = Path("/tmp/hogjob-hogci")
                  head = subprocess.check_output(["git", "-C", str(work), "rev-parse", "HEAD"], text=True).strip()
                  root = work / "metrics_history/metrics/item-lock-profile/codex/cache-item-lock-handles-1817" / head
                  result = {"_head": head}
                  if (root / "environment.txt").exists():
                      result["_environment"] = (root / "environment.txt").read_text()
                  for path in sorted(root.glob("*-trials.log")):
                      label = path.name.removesuffix("-trials.log")
                      rows = [dict(re.findall(r"(\w+)=(\S+)", line)) for line in path.read_text().splitlines() if "LOCKTRIAL" in line]
                      profile = root / (label + "-profile")
                      reports = {}
                      for p in profile.rglob("*"):
                          if p.name in {"status.txt", "record.txt", "report.txt", "samples.json", "script.log", "start.txt", "end.txt"}:
                              data = p.read_text()
                              if p.name == "report.txt":
                                  data = "\n".join(data.splitlines()[:65])
                              reports[str(p.relative_to(profile))] = data
                      result[label] = {"rows": rows, "profiles": reports}
                  print("LOCKSTATE " + json.dumps(result))
                  PY
