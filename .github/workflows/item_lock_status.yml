name: Item lock investigation status (temporary)

on:
    push:
        branches: ["codex/cache-item-lock-handles-1817"]
        paths: [".github/workflows/item_lock_status.yml"]
    workflow_dispatch:

jobs:
    status:
        runs-on: self-hosted
        permissions:
            contents: read
        steps:
            - name: Enable timestamps in the active diagnostic profiler and read progress
              shell: bash
              run: |
                  for host in hog10 hog11 hog8; do
                    ssh -T -o BatchMode=yes -o ConnectTimeout=5 "$host" python3 - <<'PY'
                  import json
                  import re
                  import subprocess
                  from pathlib import Path
                  work = Path("/tmp/hogjob-hogci")
                  head = subprocess.check_output(["git", "-C", str(work), "rev-parse", "HEAD"], text=True).strip()
                  if head == "803ecf7e2c7afb6666e998ee2e8f51d314a5b2a7":
                      profiler = work / "scripts/ci/item_lock_profile.sh"
                      code = profiler.read_text()
                      code = code.replace("perf record --per-thread", "perf record --timestamp --per-thread")
                      if "set -o pipefail" not in code:
                          code = code.replace("set +e\n", "set +e\nset -o pipefail\n")
                      profiler.write_text(code)
                  root = work / "metrics_history/metrics/item-lock-profile/codex/cache-item-lock-handles-1817" / head
                  import collections
                  import socket
                  import time
                  result = {"_head": head, "_host": socket.gethostname(), "_now": time.time()}
                  proc = subprocess.check_output(["ps", "-eo", "comm="], text=True).splitlines()
                  wanted = {"clang", "clang++", "cc1plus", "rustc", "cmake", "ninja", "g++", "ld", "ld.lld", "payments_bench", "bench_server", "perf"}
                  result["_process_counts"] = dict(collections.Counter(p.strip() for p in proc if p.strip() in wanted))
                  result["_build_progress"] = [{"build": p.parent.name, "modified": p.stat().st_mtime, "tail": p.read_text().splitlines()[-3:]} for p in (work / "build/ccache-warm").glob("*/.ninja_log")]
                  if (root / "environment.txt").exists():
                      result["_environment"] = (root / "environment.txt").read_text()
                  for path in sorted(root.glob("*-trials.log")):
                      label = path.name.removesuffix("-trials.log")
                      rows = [dict(re.findall(r"(\w+)=(\S+)", line)) for line in path.read_text().splitlines() if "LOCKTRIAL" in line]
                      profile = root / (label + "-profile")
                      reports = {}
                      for p in profile.rglob("*"):
                          if p.name in {"status.txt", "record.txt", "report.txt", "samples.json", "script.log", "start.txt", "end.txt"}:
                              data = p.read_text()
                              if p.name == "report.txt":
                                  data = "\n".join(data.splitlines()[:65])
                              if p.name == "samples.json":
                                  parsed = json.loads(data)
                                  data = json.dumps({k: {"samples": v["samples"], "symbols": v["symbols"][:10], "stacks": v["stacks"][:3]} for k, v in parsed.items() if k.startswith("threads=2048")})
                              reports[str(p.relative_to(profile))] = data
                      result[label] = {"rows": rows, "profiles": reports}
                  if head == "803ecf7e2c7afb6666e998ee2e8f51d314a5b2a7" and socket.gethostname() == "hog11":
                      import tempfile
                      remote = "import json,time; from pathlib import Path; print(json.dumps([time.monotonic_ns()-time.time_ns(),Path('/tmp/hogjob-hogci/metrics_history/metrics/item-lock-profile/codex/cache-item-lock-handles-1817/803ecf7e2c7afb6666e998ee2e8f51d314a5b2a7/3-pr-recycle-on-trials.log').read_text()]))"
                      import shlex
                      client_offset, trials = json.loads(subprocess.check_output(["ssh", "-T", "-o", "BatchMode=yes", "hog10", "python3 -c " + shlex.quote(remote)], text=True))
                      delta = time.monotonic_ns() - time.time_ns() - client_offset
                      rows = [dict(re.findall(r"(\w+)=(\S+)", line)) for line in trials.splitlines() if "LOCKTRIAL" in line]
                      with tempfile.NamedTemporaryFile(mode="w", suffix="-item-lock-trials.log") as f:
                          for row in rows:
                              if row["threads"] == "2048" and row["txs"] == "100000":
                                  for key in ["start_ns", "end_ns"]:
                                      row[key] = str(int(row[key]) + delta)
                                  f.write("LOCKTRIAL " + " ".join(k + "=" + v for k,v in row.items()) + "\n")
                          f.flush()
                          p = subprocess.Popen(["perf", "script", "-i", str(work / "ab_profiles/3-pr-recycle-on-db/perf.data"), "-F", "time,ip,sym,dso"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                          parsed = subprocess.run(["python3", str(work / "scripts/ci/item_lock_samples.py"), f.name], stdin=p.stdout, stdout=subprocess.PIPE, text=True)
                          p.stdout.close()
                          errors = p.stderr.read().decode()
                          p.wait()
                          result["_db_map_status"] = {"perf":p.returncode, "parser":parsed.returncode, "stderr":errors, "clock_delta_ns":delta}
                          all_samples = json.loads(parsed.stdout)
                          result["_db_trials"] = {k: {"samples": v["samples"], "symbols":v["symbols"][:15], "stacks":v["stacks"][:5]} for k,v in all_samples.items()}
                  print("LOCKSTATE " + json.dumps(result))
                  PY
                  done
