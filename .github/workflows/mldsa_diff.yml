name: ML-DSA Differential Test

# Checks that hogd's ML-DSA-65 (hogd/crypto, built on the mldsa-native
# submodule) agrees with Go's crypto/mldsa on random keys, signatures and
# corrupted inputs; see hogd/crypto/mldsa_diff/mldsa_diff_test.go. It runs only
# when that code changes. Each run uses a fresh random seed, which the test log
# shows; `-seed` repeats a run.
on:
  push:
    branches: ["main"]
    paths:
      - 'hogd/crypto/**'
      # The submodule's path changes when it is bumped.
      - 'external/mldsa-native'
      - '.github/workflows/mldsa_diff.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'hogd/crypto/**'
      - 'external/mldsa-native'
      - '.github/workflows/mldsa_diff.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  # Published crates and pinned submodules retain the legacy registry identity.
  CARGO_REGISTRIES_THRUPUT_LEGACY_INDEX: sparse+https://groundhog.dev/crates/api/v1/crates/
  CARGO_REGISTRIES_THRUPUT_LEGACY_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRIES_THRUPUT_LEGACY_CREDENTIAL_PROVIDER: cargo:token
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  diff:
    # Own cache volume, as for the build jobs in cpp-namespace-optimized.yml.
    runs-on: namespace-profile-hogd-linux-2604;overrides.cache-tag=hogd-mldsa-diff
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          persist-credentials: false
          submodules: false

      - name: Configure private sources
        uses: ./.github/actions/private-sources
        with:
          token: ${{ secrets.READ_ACCESS_PAT }}
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}
          ssh-private-key: |
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/sccache
            ~/.cache/hogcache
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - uses: ./.github/actions/setup-sccache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native

      # The submodules hogd's CMake configuration needs, as in
      # test_bindings.yml.
      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive \
            protocol \
            external/rocksdb \
            external/model-checker \
            external/googletest \
            external/benchmark \
            external/crc32c \
            external/blake3 \
            external/corrosion \
            external/mldsa-native \
            built_contracts/integration_test_contracts

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'NPROC=30' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # Zero the persisted counters so "Show ccache stats" reports this run.
          CCACHE_DIR="$HOME/.cache/ccache" ccache -z

      # A Release build, as shipped: the comparison is with the code validators
      # run.
      - name: Configure Build
        run: ./scripts/build.sh -d build -t Release -c gcc -n

      - name: Build mldsa_oracle
        run: cmake --build build --parallel "$(nproc)" --target mldsa_oracle

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: hogd/crypto/mldsa_diff/go.mod
          # The test has no dependencies to cache.
          cache: false

      - name: Run Differential Test
        working-directory: hogd/crypto/mldsa_diff
        run: >-
          go test -v -timeout 30m .
          -args -oracle="$GITHUB_WORKSPACE/build/hogd/crypto/mldsa_oracle"
          -keys=3000

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s
          sccache --show-stats

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

      - name: File failure issue
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/file-failure-issue

      - name: Remove job-local Git credentials
        if: always()
        shell: bash
        run: |
          if [[ "${GIT_CONFIG_GLOBAL:-}" == "$RUNNER_TEMP"/private-sources.* ]]; then
            rm -f -- "$GIT_CONFIG_GLOBAL"
          fi
