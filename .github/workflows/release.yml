name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_BUILD_JOBS: "6"

permissions:
  contents: write
  actions: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: namespace-profile-hogd-linux-2604
            machine: x86_64
            build_architecture: x86-64-v2
            rust_build_cpu: x86-64-v2
            nproc: 18
          - architecture: arm64
            runner: namespace-profile-hogd-linux-arm64
            machine: aarch64
            build_architecture: armv8.2-a
            rust_build_cpu: neoverse-n1
            nproc: 8
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Verify native Linux architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: groundhog-go/chuckd/go.mod

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'NPROC=${{ matrix.nproc }}' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=gcc-release-${{ matrix.architecture }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "HOGD_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "HOGD_RELEASE_VERSION=0.0.1-dev" >> "$GITHUB_ENV"
          fi

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build GCC Release
        run: |
          ./scripts/build.sh \
            -d build/release \
            -t Release \
            -c gcc \
            -x "-DBUILD_BENCHMARKS=OFF" \
            -x "-DBUILD_ARCHITECTURE=${{ matrix.build_architecture }}" \
            -x "-DRUST_BUILD_CPU=${{ matrix.rust_build_cpu }}" \
            hog-db hog-exec hog-mempool hog-auth hog-event hog-indexer hog-devnode hog-hosted-bootstrap

      - name: Build GCC Debug
        run: |
          ./scripts/build.sh \
            -d build/debug \
            -t Debug \
            -c gcc \
            -x "-DBUILD_BENCHMARKS=OFF" \
            -x "-DBUILD_ARCHITECTURE=${{ matrix.build_architecture }}" \
            -x "-DRUST_BUILD_CPU=${{ matrix.rust_build_cpu }}" \
            hog-db hog-exec hog-mempool hog-auth hog-event hog-indexer hog-devnode hog-hosted-bootstrap

      - name: Check Linux binaries for unexpected AVX-512
        if: matrix.architecture == 'x86_64'
        run: |
          ./scripts/check-no-unexpected-avx512.sh \
            build/release/hogd/hog_db/hog-db \
            build/release/hogd/hog_exec/hog-exec \
            build/release/hogd/hog_mempool/hog-mempool \
            build/release/hogd/hog_auth/hog-auth \
            build/release/hogd/hog_event/hog-event \
            build/release/hogd/hog_indexer/hog-indexer \
            build/release/hogd/devnode/hog-devnode \
            build/release/hogd/devnode/hog-hosted-bootstrap \
            build/debug/hogd/hog_db/hog-db \
            build/debug/hogd/hog_exec/hog-exec \
            build/debug/hogd/hog_mempool/hog-mempool \
            build/debug/hogd/hog_auth/hog-auth \
            build/debug/hogd/hog_event/hog-event \
            build/debug/hogd/hog_indexer/hog-indexer \
            build/debug/hogd/devnode/hog-devnode \
            build/debug/hogd/devnode/hog-hosted-bootstrap

      - name: Prepare artifacts
        run: |
          ./scripts/package_hogd_validator_release.sh \
            build/release artifacts release "${{ matrix.architecture }}"
          ./scripts/package_hogd_validator_release.sh \
            build/debug artifacts debug "${{ matrix.architecture }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hogd-linux-${{ matrix.architecture }}-release-artifacts
          path: artifacts/*.tar.gz

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  hog-devnode-macos-arm64:
    runs-on: namespace-profile-hogd-arm64-macos
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Use CommandLineTools SDK
        run: |
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
            echo "Switched to CommandLineTools SDK: $(xcrun --show-sdk-path)"
          fi

      - name: Setup Environment
        run: ./scripts/macos-setup.sh

      - name: Set Release Version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "HOGD_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "HOGD_RELEASE_VERSION=0.0.1-dev" >> "$GITHUB_ENV"
          fi

      - name: Build hog-devnode
        run: |
          ./scripts/build.sh \
            -d build/release \
            -t Release \
            -c clang \
            -x "-DBUILD_BENCHMARKS=OFF" \
            hog-devnode

      - name: Package hog-devnode
        run: |
          mkdir -p package/hog-devnode-macos-arm64 artifacts
          cp build/release/hogd/devnode/hog-devnode package/hog-devnode-macos-arm64/hog-devnode
          chmod +x package/hog-devnode-macos-arm64/hog-devnode
          mkdir -p package/hog-devnode-macos-arm64/contracts
          cp build/release/built_contracts/dev_wallet.rv32a package/hog-devnode-macos-arm64/contracts/dev_wallet.rv32a

          pushd package/hog-devnode-macos-arm64 >/dev/null
          mkdir -p lib

          resolve_dep() {
            local dep="$1"
            local base
            base="$(basename "$dep")"

            if [[ "$dep" == /opt/homebrew/* ]]; then
              printf '%s\n' "$dep"
              return 0
            fi

            if [[ "$dep" == @rpath/* ]]; then
              for search_dir in \
                /opt/homebrew/opt/llvm/lib/c++ \
                /opt/homebrew/opt/llvm/lib/unwind \
                /opt/homebrew/opt/llvm/lib \
                /opt/homebrew/lib; do
                if [ -f "$search_dir/$base" ]; then
                  printf '%s\n' "$search_dir/$base"
                  return 0
                fi
              done
            fi

            return 1
          }

          list_bundle_deps() {
            otool -L "$1" | awk 'NR > 1 { print $1 }' | while IFS= read -r dep; do
              resolve_dep "$dep" || true
            done
          }

          while true; do
            added=0
            for binary in hog-devnode lib/*.dylib; do
              [ -e "$binary" ] || continue
              while IFS= read -r dep; do
                base="$(basename "$dep")"
                if [ ! -f "lib/$base" ]; then
                  cp "$dep" "lib/$base"
                  added=1
                fi
              done < <(list_bundle_deps "$binary")
            done
            [ "$added" -eq 0 ] && break
          done

          for dylib in lib/*.dylib; do
            [ -e "$dylib" ] || continue
            install_name_tool -id "@executable_path/lib/$(basename "$dylib")" "$dylib"
          done

          for binary in hog-devnode lib/*.dylib; do
            [ -e "$binary" ] || continue
            while IFS= read -r dep; do
              base="$(basename "$dep")"
              if [ -f "lib/$base" ]; then
                install_name_tool -change "$dep" "@executable_path/lib/$base" "$binary"
              fi
            done < <(otool -L "$binary" | awk 'NR > 1 { print $1 }')
          done

          # install_name_tool invalidates the Homebrew dylibs' existing code
          # signatures. Re-sign every rewritten dependency before signing the
          # executable so macOS does not kill the packaged process on launch.
          for dylib in lib/*.dylib; do
            [ -e "$dylib" ] || continue
            codesign --force --sign - "$dylib"
            codesign --verify --verbose=4 "$dylib"
          done
          codesign --force --sign - hog-devnode
          codesign --verify --verbose=4 hog-devnode

          file hog-devnode
          otool -L hog-devnode

          readiness_file="$(mktemp)"
          log_file="$(mktemp)"
          ./hog-devnode \
            --listen-host 127.0.0.1 \
            --scheduler-port 0 \
            --readiness stdout \
            --dev-accounts 1 \
            --dev-account-seed groundhog-dev-accounts \
            --dev-account-tokens 1000000000 \
            >"$readiness_file" 2>"$log_file" &
          devnode_pid=$!
          cleanup_devnode() {
            if kill -0 "$devnode_pid" 2>/dev/null; then
              kill "$devnode_pid" 2>/dev/null || true
              for _ in {1..40}; do
                kill -0 "$devnode_pid" 2>/dev/null || break
                sleep 0.25
              done
              if kill -0 "$devnode_pid" 2>/dev/null; then
                kill -9 "$devnode_pid" 2>/dev/null || true
              fi
            fi
            wait "$devnode_pid" 2>/dev/null || true
            rm -f "$readiness_file" "$log_file"
          }
          trap cleanup_devnode EXIT

          ready=0
          for _ in {1..240}; do
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' "$readiness_file"; then
              ready=1
              break
            fi
            if ! kill -0 "$devnode_pid" 2>/dev/null; then
              cat "$log_file" >&2
              echo "packaged hog-devnode exited before readiness" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log_file" >&2
            echo "timed out waiting for packaged hog-devnode readiness" >&2
            exit 1
          fi
          python3 - "$readiness_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              readiness = json.loads(handle.readline())
          if readiness.get("status") != "ready":
              raise SystemExit(f"unexpected readiness payload: {readiness}")
          PY
          cat "$readiness_file"
          cleanup_devnode
          trap - EXIT
          popd >/dev/null

          tar -czf artifacts/hog-devnode-macos-arm64.tar.gz -C package/hog-devnode-macos-arm64 hog-devnode contracts/dev_wallet.rv32a lib

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hog-devnode-macos-arm64
          path: artifacts/hog-devnode-macos-arm64.tar.gz

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  publish:
    if: github.event_name == 'push'
    needs: [release, hog-devnode-macos-arm64]
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hogd-linux-x86_64-release-artifacts
          path: artifacts/

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hogd-linux-arm64-release-artifacts
          path: artifacts/

      - name: Download macOS hog-devnode artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hog-devnode-macos-arm64
          path: artifacts/

      - name: Generate aggregate checksums
        run: |
          set -euo pipefail
          cd artifacts
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 9
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
