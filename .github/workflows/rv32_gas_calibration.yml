name: RV32 Gas Calibration

# Nightly, because a calibration stops describing the engine over weeks, not
# per PR. Every run files its JSON to metrics_history whether the check passes
# or fails, so the costs are a time series and not just a pass/fail.
on:
    schedule:
        - cron: "0 17 * * *" # Daily at 10am PDT/9am PST
    workflow_dispatch:
        inputs:
            mode:
                description: >-
                    check: gate against the committed reference.
                    reference: measure and print a reference for this host,
                    without gating (use once to bootstrap a new bench host).
                type: choice
                required: true
                default: check
                options:
                    - check
                    - reference
env:
    CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
    CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
    calibrate:
        runs-on: self-hosted
        permissions:
            contents: read
            actions: read

        steps:
            - name: Clean up .gitconfig
              run: |
                  echo "Cleaning up .gitconfig"
                  rm -f /home/hogci/.gitconfig
            - uses: actions/checkout@v6
              with:
                persist-credentials: false

            - name: Configure private sources
              id: private-sources
              uses: ./.github/actions/private-sources
              with:
                token: ${{ secrets.READ_ACCESS_PAT }}
                app-id: ${{ vars.COMPONENT_READER_APP_ID }}
                private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}
                ssh-private-key: |
                  ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
                  ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
                  ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
                  ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
                  ${{ secrets.HOGD_TO_ABORT_RS_KEY }}

            - name: Run hog schedule
              run: |
                  BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
                  # `inputs` is empty on a scheduled run.
                  MODE="${{ inputs.mode || 'check' }}"
                  echo "Branch name: $BRANCH_NAME, mode: $MODE"
                  # 60 minutes rather than 40: the syscall half of the
                  # measurement links the runtime, and through genesis that
                  # puts the guest contract build on this job's critical path.
                  # The opcode calibration alone never needed it.
                  hog_sched \
                    --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
                    --key=github_repo --value=${{ github.repository }} \
                    --key=git_token --value=${{ steps.private-sources.outputs.token }} \
                    --key=git_commit --value=${{ github.sha }} \
                    --key=git_branch --value=$BRANCH_NAME \
                    --key=mode --value=$MODE \
                    --key=cargo_registry_token --value=${{ secrets.GROUNDHOG_REGISTRY_TOKEN }} \
                    --key=cargo_registry_global_credential_providers --value=${{ env.CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS }} \
                    --timeout-sec=3600 \
                    ./scripts/schedules/rv32_gas_calibration.toml
            - name: Print Log Download Instructions
              if: always()
              uses: ./.github/actions/print-log-instructions
            - name: Remove job-local Git credentials
              if: always()
              shell: bash
              run: |
                if [[ "${GIT_CONFIG_GLOBAL:-}" == "$RUNNER_TEMP"/private-sources.* ]]; then
                  rm -f -- "$GIT_CONFIG_GLOBAL"
                fi
