name: Sanitizer

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 7am PDT/6am PST
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Clean up .gitconfig
      run: |
        echo "Cleaning up .gitconfig"
        rm -f /home/hogci/.gitconfig
    - uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: |
          ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
          ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_BCS_RS_KEY }}
          ${{ secrets.HOGD_SELF_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
          ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
          ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
          ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
          ${{ secrets.HOGD_TO_PROTOCOL_GO }}
          ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/prepare_env
    
    - name: build gcc asan
      run: ./scripts/build.sh -d build/gcc_asan -c gcc -f "-fsanitize=address" -t Debug -x "-DENABLE_TEST_FFI=ON"
    - name: run gcc tests
      run: |
        export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1
        ctest --test-dir build/gcc_asan --parallel --timeout 100 --output-on-failure
   
    - name: build clang asan
      run: ./scripts/build.sh -d build/llvm_asan -c clang -f "-fsanitize=address" -t Debug -x "-DENABLE_TEST_FFI=ON"
    - name: run llvm tests
      run: |
        export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1
        ctest --test-dir build/llvm_asan --parallel --timeout 100 --output-on-failure
    
    - name: build gcc ubsan
      run: ./scripts/build.sh -d build/gcc_ubsan -c gcc -f "-fsanitize=undefined -fno-sanitize-recover=all" -t Debug -x "-DENABLE_TEST_FFI=ON"
    - name: run gcc ubsan tests
      run: |
        export UBSAN_OPTIONS=suppressions=$(pwd)/.ubsan_suppress:print_stacktrace=1
        ctest --test-dir build/gcc_ubsan --parallel --timeout 100 --output-on-failure
    - name: save gcc ubsan core dumps
      if: failure()
      run: |
        ./scripts/save_core_dumps.sh ../core_dumps

    - name: build clang ubsan
      run: ./scripts/build.sh -d build/llvm_ubsan -c clang -f "-fsanitize=undefined -fno-sanitize-recover=all" -t Debug -x "-DENABLE_TEST_FFI=ON"
    - name: run llvm ubsan tests
      run: |
        export UBSAN_OPTIONS=suppressions=$(pwd)/.ubsan_suppress:print_stacktrace=1
        ctest --test-dir build/llvm_ubsan --parallel --timeout 100 --output-on-failure
    - name: save llvm ubsan core dumps
      if: failure()
      run: |
        ./scripts/save_core_dumps.sh ../core_dumps