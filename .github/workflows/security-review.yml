name: Security Review

on:
  pull_request:
    types: [opened, labeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  security:
    if: github.event.action == 'opened' || github.event.label.name == 'security-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          run-every-commit: true
