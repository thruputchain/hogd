name: Node Startup Order (Namespace)

# Debug-builds the node and launches its binaries directly (no hog_sched/hogx)
# in several start orders, asserting no process crashes on startup.

# Manual dispatch only — run on demand from the Actions tab.
on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_BUILD_JOBS: "6"

jobs:
  startup-order:
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache
            ~/.cargo

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'CLANG_FORMAT=clang-format-21' >> ./scripts/conf.sh
          echo 'NPROC=20' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=startup-order" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build GCC Debug (node binaries only)
        run: |
          # Configure only (-n), then build just the node daemons this test
          # launches and their transitive deps — not the whole tree, tests, or
          # benchmarks. Target names from the hogd/*/CMakeLists.txt files
          # The CMake target names match the installed executable names.
          ./scripts/build.sh -d build/gcc -t Debug -c gcc -f "-Werror" -n
          cmake --build build/gcc --parallel "$(nproc)" --target \
            loadgen_server \
            hog-mempool \
            hog-exec \
            hog-event \
            hog-indexer \
            hog-db \
            hog-auth

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Build scpd and chuckd
        run: |
          # Both build scripts place their output binary in $PWD; run from
          # build/gcc so chuckd.dev/scpd.dev sit alongside the C++ binaries.
          pushd build/gcc >/dev/null
          ../../groundhog-go/chuckd/scripts/build_scpd.sh
          ../../groundhog-go/chuckd/scripts/build_chuckd.sh
          popd >/dev/null

      - name: "Scenario: mempool-first"
        run: ./scripts/ci/startup_order_test.sh mempool-first

      - name: "Scenario: mempool-middle"
        run: ./scripts/ci/startup_order_test.sh mempool-middle

      - name: "Scenario: mempool-last"
        run: ./scripts/ci/startup_order_test.sh mempool-last

      - name: "Scenario: indexer-before-event"
        run: ./scripts/ci/startup_order_test.sh indexer-before-event

      - name: "Scenario: event-before-indexer"
        run: ./scripts/ci/startup_order_test.sh event-before-indexer

      # Reproduction attempt for the reported "wrong start order" crash:
      # coordinator drives traffic before the mempool's downstream services
      # (auth/hog-exec/hog-db) connect. Expected to FAIL (mempool aborts on an
      # RPC to a not-yet-ready fd) if that hypothesis holds. Runs last so the
      # known-good orderings above are exercised first.
      - name: "Scenario: coordinator-first"
        run: ./scripts/ci/startup_order_test.sh coordinator-first

      # Aggressive reproduction: auth is never started while the coordinator
      # drives traffic, forcing the mempool to verify against an absent auth fd
      # for the whole window. FAILs if the mempool aborts (the reported crash);
      # passes if the mempool gates on auth readiness instead.
      - name: "Scenario: starve-auth"
        run: ./scripts/ci/startup_order_test.sh starve-auth

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
