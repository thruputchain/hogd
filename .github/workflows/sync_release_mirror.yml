name: Sync groundhog-dev release mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *" # Daily at 6am PST
  workflow_run:
    workflows: ["Release test_ffi Library"]
    types: [completed]

jobs:
  sync:
    permissions:
      contents: read
      actions: read
    # run if manually triggered or if the release_test_ffi workflow completed successfully
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: hog1

    steps:
      - name: Clear .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Sync release mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync_release_mirror.sh
      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
