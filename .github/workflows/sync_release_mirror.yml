name: Sync groundhog-dev release mirror

on:
  workflow_dispatch:
  
jobs:
  sync:
    permissions:
      contents: read
    runs-on: hog1


    steps:
      - name: Clear .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - name: Checkout code
        uses: actions/checkout@v4
        #gh already supplies GITHUB_TOKEN, which has permissions to read artifacts
      - name: Sync release mirror
        run: ./scripts/sync_release_mirror.sh
          


