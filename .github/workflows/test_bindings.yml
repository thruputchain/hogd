name: Build Test Bindings for Contract SDK (Namespace)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Keeps the RV32 contracts' cargo intermediates on the cache volume (./target
  # is cached by `cache: rust`); see built_contracts/build_risc.sh.
  HOGD_RV32_TARGET_DIR: ${{ github.workspace }}/target/rv32

jobs:
  build:
    # Own cache volume, as for the build jobs in cpp-namespace-optimized.yml.
    runs-on: namespace-profile-hogd-linux-2604;overrides.cache-tag=hogd-test-bindings
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@def520b6c21233362f09c9ceda4352c51cceca26 # v8.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
          # Like the other Linux jobs, keep ~/.cargo (fetch.sh's thruput CLI
          # install, rebuilt from source on every run without it) and the
          # toolchains (~/.cache/rustup) on the cache volume.
          path: |
            ~/.cache/ccache
            ~/.cache/sccache
            ~/.cache/hogcache
            ~/.cargo
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - uses: ./.github/actions/setup-sccache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion
          cache_repo pq-code-package/mldsa-native
          cache_repo C2SP/wycheproof

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive \
            protocol \
            external/rocksdb \
            external/model-checker \
            external/googletest \
            external/benchmark \
            external/crc32c \
            external/blake3 \
            external/corrosion \
            external/mldsa-native \
            built_contracts/integration_test_contracts

      - name: Cargo Fetch
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/fetch.sh

      - name: Check Rust bindgen bindings compile
        run: cargo check --manifest-path hogd/rust/Cargo.toml -p test_ffi_bindings

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'NPROC=30' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"
          # Zero the persisted counters so "Show ccache stats" reports this run.
          CCACHE_DIR="$HOME/.cache/ccache" ccache -z

      - name: Configure Build
        run: |
          ./scripts/build.sh -d build -t Debug -c clang -x "-DENABLE_TEST_FFI=ON" -n

      - name: Build test_ffi_test
        run: cmake --build build --parallel "$(nproc)" --target test_ffi_test

      - name: Run test_ffi_test
        run: |
          export LSAN_OPTIONS=suppressions="$(pwd)/.lsan_suppress:print_suppressions=1"
          ./build/hogd/test_ffi/test_ffi_test

      # test_ffi_mock_syscall_test lives in its own binary (it needs a custom
      # main(); see hogd/test_ffi/CMakeLists.txt), and ENABLE_TEST_FFI is set
      # only here, so no other workflow compiles it. Without these two steps it
      # is built by CMake but by nothing in CI, and can break unnoticed.
      - name: Build test_ffi_mock_syscall_test
        run: |
          cmake --build build --parallel "$(nproc)" \
            --target test_ffi_mock_syscall_test

      - name: Run test_ffi_mock_syscall_test
        run: |
          export LSAN_OPTIONS=suppressions="$(pwd)/.lsan_suppress:print_suppressions=1"
          ./build/hogd/test_ffi/test_ffi_mock_syscall_test

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
          python3 scripts/ci/ninja_build_profile.py build

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
