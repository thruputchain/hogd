name: Tidy (Namespace)

# This workflow uses a custom base image with pre-installed toolchain.
# Requires: Configure namespace-profile-hogd-linux-2604 with .devcontainer/Dockerfile as custom base image.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_BUILD_JOBS: "6"

jobs:
  tidy-partition:
    name: tidy-${{ matrix.partition }}
    runs-on: namespace-profile-hogd-linux-2604 # Must have custom base image configured
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        partition: [prod, exempt, other]

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false # We handle submodules manually for selective init

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache
            ~/.cargo

      - name: Configure Tidy Scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TIDY_SCOPE=changed" >> "$GITHUB_ENV"
            echo "TIDY_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "TIDY_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] &&
            [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "TIDY_SCOPE=changed" >> "$GITHUB_ENV"
            echo "TIDY_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "TIDY_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "TIDY_SCOPE=full" >> "$GITHUB_ENV"
          fi

      - name: Fetch Changed-File Base
        run: |
          if [ "$TIDY_SCOPE" = "changed" ]; then
            git fetch --no-tags --depth=1 origin "$TIDY_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$TIDY_HEAD_SHA"
          fi

      - name: Use Full Scope for Tidy Infrastructure Changes
        run: |
          if [ "$TIDY_SCOPE" = "changed" ] &&
            ! git diff --quiet "$TIDY_BASE_SHA" "$TIDY_HEAD_SHA" -- \
              .github/workflows/tidy-namespace-optimized.yml \
              scripts/env.sh \
              scripts/filter_tidy_log.sh \
              scripts/tidy_inputs.py \
              scripts/tidy-ubuntu.sh; then
            echo "Tidy infrastructure changed; using full scope"
            echo "TIDY_SCOPE=full" >> "$GITHUB_ENV"
          fi

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          # Cache function for submodule repos (uses persistent cache dir)
          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              # Update existing mirror
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          # Cache the repos we need
          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive \
            protocol \
            external/rocksdb \
            external/model-checker \
            external/googletest \
            external/benchmark \
            external/crc32c \
            external/blake3 \
            external/corrosion \
            built_contracts/integration_test_contracts

      # REMOVED: Install Rust/Cargo - baked into base image
      # REMOVED: Install cbindgen - baked into base image
      # REMOVED: Add LLVM Repository - baked into base image
      # REMOVED: Install Build Dependencies - baked into base image

      - name: Configure Environment
        run: |
          # Create conf.sh for scripts/env.sh to pick up gcc-15 and clang-21
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'NPROC=29' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          # Configure ccache with proper path expansion
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

          # Verify the compilers (should be pre-installed)
          clang-21 --version
          cargo --version
          ccache --version

      - name: Cargo Fetch
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/fetch.sh

      - name: Configure Build
        if: matrix.partition != 'other'
        run: |
          ./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror" -x "-DBUILD_BENCHMARKS=OFF" -n

      - name: Build Tidy Targets
        if: matrix.partition != 'other'
        run: cmake --build build/llvm --parallel "$(nproc)" --target tidy_targets

      - name: Run Tidy Checks
        run: |
          set +e
          set -o pipefail
          if [ "$TIDY_SCOPE" = "changed" ]; then
            ./scripts/tidy-ubuntu.sh \
              --scope changed \
              --partition "${{ matrix.partition }}" \
              --base "$TIDY_BASE_SHA" \
              --head "$TIDY_HEAD_SHA" \
              -d build/llvm 2>&1 | tee tidy.log
          else
            ./scripts/tidy-ubuntu.sh \
              --scope full \
              --partition "${{ matrix.partition }}" \
              -d build/llvm 2>&1 | tee tidy.log
          fi
          TIDY_RESULT=$?
          set +o pipefail
          set -e

          if [ $TIDY_RESULT -ne 0 ]; then
            printf '\n===== filtered tidy log =====\n'
            ./scripts/filter_tidy_log.sh tidy.log
            printf '\n===== end filtered tidy log =====\n\n'
            exit 1
          fi

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
