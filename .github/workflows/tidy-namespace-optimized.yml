name: Tidy (Namespace)

# This workflow uses a custom base image with pre-installed toolchain.
# Requires: Configure namespace-profile-hogd-linux with docker/Dockerfile as custom base image.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_BUILD_JOBS: "6"

jobs:
  tidy:
    runs-on: namespace-profile-hogd-linux # Must have custom base image configured
    permissions:
      contents: read
      actions: read

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false # We handle submodules manually for selective init

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache
            ~/.cargo

      # Note: 'apt' cache removed since toolchain is in base image

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          # Cache function for submodule repos (uses persistent cache dir)
          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              # Update existing mirror
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          # Cache the repos we need
          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive \
            protocol \
            external/rocksdb \
            external/model-checker \
            external/googletest \
            external/benchmark \
            external/crc32c \
            external/blake3 \
            external/corrosion \
            built_contracts/integration_test_contracts

      # REMOVED: Install Rust/Cargo - baked into base image
      # REMOVED: Install cbindgen - baked into base image
      # REMOVED: Add LLVM Repository - baked into base image
      # REMOVED: Install Build Dependencies - baked into base image

      - name: Configure Environment
        run: |
          # Create conf.sh for scripts/env.sh to pick up gcc-14 and clang-21
          echo 'GCC_CC=gcc-14' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-14' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          echo 'NPROC=30' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          # Configure ccache with proper path expansion
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

          # Verify the compilers (should be pre-installed)
          clang-21 --version
          cargo --version
          ccache --version

      - name: Cargo Fetch
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/fetch.sh

      - name: Configure Build
        run: |
          ./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror" -x "-DBUILD_BENCHMARKS=OFF" -n

      - name: Build Tidy Targets
        run: make -j $(nproc) -C build/llvm tidy_targets

      - name: Run Tidy Checks
        run: |
          TIDY_RESULT=0
          ./scripts/tidy-ubuntu.sh -d build/llvm 2>&1 | tee tidy.log || TIDY_RESULT=${PIPESTATUS[0]}

          if [ $TIDY_RESULT -ne 0 ]; then
            printf '\n===== filtered tidy log =====\n'
            ./scripts/filter_tidy_log.sh tidy.log
            printf '\n===== end filtered tidy log =====\n\n'
            exit 1
          fi

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions
