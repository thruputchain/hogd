name: Tidy (Namespace)

on:
  workflow_dispatch:  # Manual trigger for testing
  # Uncomment once validated:
  # push:
  #   branches: ["main"]
  # pull_request:
  #   branches: ["main"]

jobs:
  tidy:
    runs-on: namespace-profile-hogd-linux  # Create this profile in Namespace dashboard

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false  # We handle submodules manually for selective init

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p /tmp/hogcache/
          git config --global protocol.file.allow always

          # Cache function for submodule repos
          cache_repo() {
            local repo_path="$1"
            local cache_dir="/tmp/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror https://github.com/$repo_path.git "$cache_dir"
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          # Cache the repos we need
          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive \
            protocol \
            external/rocksdb \
            external/model-checker \
            external/googletest \
            external/benchmark \
            external/crc32c \
            external/blake3 \
            external/corrosion \
            built_contracts/integration_test_contracts

      - name: Install Rust/Cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Add LLVM Repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-21 \
            clang-tidy-21 \
            clang-tools-21 \
            gcc-14 \
            g++-14 \
            ccache \
            python3 \
            python3-flake8 \
            libjemalloc-dev \
            libc++-21-dev \
            libc++abi-21-dev \
            lz4 \
            liblz4-dev \
            libsnappy-dev \
            zlib1g-dev \
            libbz2-dev \
            libzstd-dev \
            flex \
            bison \
            lld \
            llvm-21

          # Set clang-21 as the default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 200
          sudo update-alternatives --set clang /usr/bin/clang-21
          sudo update-alternatives --set clang++ /usr/bin/clang++-21
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-21 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy /usr/bin/run-clang-tidy-21 100

          # Set up LLVM tools
          for tool in llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-config; do
            if [ -f /usr/bin/${tool}-21 ]; then
              sudo update-alternatives --install /usr/bin/${tool} ${tool} /usr/bin/${tool}-21 100
            fi
          done

      - name: Configure Environment
        run: |
          # Create conf.sh for scripts/env.sh to pick up gcc-14 and clang-21
          echo 'GCC_CC=gcc-14' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-14' >> ./scripts/conf.sh
          echo 'CLANG_CC=/usr/bin/clang-21' >> ./scripts/conf.sh
          echo 'CLANG_CXX=/usr/bin/clang++-21' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh
          cat ./scripts/conf.sh
          # Verify the compilers
          /usr/bin/clang-21 --version
          /usr/bin/clang++-21 --version

      - name: Cargo Fetch
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true ./scripts/fetch.sh

      - name: Configure Build
        run: |
          ./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror" -x "-DBUILD_BENCHMARKS=OFF" -n

      - name: Build Tidy Targets
        run: make -j $(nproc) -C build/llvm tidy_targets

      - name: Run Tidy Checks
        run: |
          TIDY_RESULT=0
          ./scripts/tidy-ubuntu.sh -d build/llvm > tidy.log 2>&1 || TIDY_RESULT=$?

          if [ $TIDY_RESULT -ne 0 ]; then
            printf 'Tidy checks failed!\n'
            printf '\n===== tidy log =====\n'
            cat tidy.log
            printf '===== end tidy log =====\n\n'
            printf '\n===== filtered tidy log =====\n'
            ./scripts/filter_tidy_log.sh tidy.log
            printf '\n===== end filtered tidy log =====\n\n'
            exit 1
          fi
