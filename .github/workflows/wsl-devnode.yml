name: WSL devnode smoke

on:
  push:
    branches: ["main"]
  # TEMPORARY(geoff/devnode-ramdb-bytes-flag): run on the introducing PR so
  # the job can be verified end-to-end. Remove this trigger before merge.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
  CARGO_BUILD_JOBS: "6"

jobs:
  build-devnode-linux:
    runs-on: namespace-profile-hogd-linux-2604
    permissions:
      contents: read
      actions: read
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.HOGD_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_INTEGRATION_TEST_CONTRACTS_KEY }}
            ${{ secrets.HOGD_TO_SDK_RS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_BCS_RS_KEY }}
            ${{ secrets.HOGD_SELF_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_RS_KEY }}
            ${{ secrets.HOGD_TO_SERDE_ARRAYS }}
            ${{ secrets.HOGD_TO_METRICS_HISTORY_KEY }}
            ${{ secrets.HOGD_XDRS_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_XDR_COMMON_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_CHUCKD_ACCESS_KEY }}
            ${{ secrets.HOGD_TO_PROTOCOL_GO }}
            ${{ secrets.HOGD_TO_GROUNDHOG_GO }}
            ${{ secrets.HOGD_TO_LIB_GO_KEY }}
            ${{ secrets.HOGD_TO_SCP_KEY }}
            ${{ secrets.HOGD_TO_XDR_RPC }}
            ${{ secrets.HOGD_TO_ABORT_RS_KEY }}
            ${{ secrets.HOGD_TO_HOGX_KEY }}

      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/ccache
            ~/.cache/hogcache

      - name: Configure Git for Submodule Caching
        run: |
          mkdir -p ~/.cache/hogcache/
          git config --global protocol.file.allow always

          cache_repo() {
            local repo_path="$1"
            local cache_dir="$HOME/.cache/hogcache/$repo_path"
            if [[ ! -d "$cache_dir" ]]; then
              echo "HOGCACHE: Cloning fresh mirror for $repo_path"
              mkdir -p "$(dirname "$cache_dir")"
              git clone --mirror --quiet https://github.com/$repo_path.git "$cache_dir"
            else
              echo "HOGCACHE: Using cached mirror for $repo_path"
              git -C "$cache_dir" fetch --prune origin 2>/dev/null || true
            fi
            git config --global url."file://$cache_dir".insteadOf https://github.com/$repo_path.git
          }

          cache_repo facebook/rocksdb
          cache_repo gramseyer/model-checker
          cache_repo google/googletest
          cache_repo google/benchmark
          cache_repo google/crc32c
          cache_repo google/glog
          cache_repo BLAKE3-team/BLAKE3
          cache_repo corrosion-rs/corrosion

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: groundhog-go/chuckd/go.mod

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'NPROC=18' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_NAMESPACE=gcc-wsl-devnode" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build hog-devnode
        run: |
          ./scripts/build.sh \
            -d build/release \
            -t Release \
            -c gcc \
            -x "-DBUILD_BENCHMARKS=OFF" \
            hog-devnode

      - name: Package hog-devnode
        run: |
          mkdir -p package/contracts artifacts
          cp build/release/hogd/devnode/hog-devnode package/hog-devnode
          cp build/release/built_contracts/dev_wallet.rv32a package/contracts/dev_wallet.rv32a
          tar -C package -czf artifacts/hog-devnode-wsl-smoke.tar.gz hog-devnode contracts/dev_wallet.rv32a
          ldd package/hog-devnode

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hog-devnode-wsl-smoke
          path: artifacts/hog-devnode-wsl-smoke.tar.gz

      - name: Show ccache stats
        if: always()
        run: ccache -s

  wsl-smoke:
    needs: build-devnode-linux
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Download artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hog-devnode-wsl-smoke
          path: artifact/

      - name: Constrain WSL memory
        shell: pwsh
        run: |
          # memory + swap must stay below the 15 GiB default ramdb reservation
          # so this genuinely exercises the low-memory configuration.
          @"
          [wsl2]
          memory=6GB
          swap=2GB
          "@ | Set-Content -Path "$env:USERPROFILE\.wslconfig"

      - name: Install WSL2 Ubuntu
        shell: pwsh
        run: |
          wsl --update
          wsl --version
          # Ubuntu 26.04 LTS (Resolute) WSL image from cdimages.ubuntu.com.
          # Verified 2026-08-03: manifest lists ubuntu-release-upgrader-core 1:26.04.22
          # and libc6 2.43-2ubuntu2.3, matching the build runner (namespace-profile-hogd-linux-2604).
          # SHA256: 1846a5494554abf1bb5cea3258c9608e9586fe4386161c4aeb7d531257139d7b
          curl.exe -fsSL -o ubuntu.wsl https://cdimages.ubuntu.com/ubuntu-wsl/resolute/daily-live/current/resolute-wsl-amd64.wsl
          mkdir C:\wsl-ubuntu
          wsl --import hogd-smoke C:\wsl-ubuntu ubuntu.wsl
          wsl --shutdown

      - name: Run smoke inside WSL
        shell: pwsh
        run: |
          # WSLENV /p flag instructs WSL to translate GITHUB_WORKSPACE from
          # Windows path format to a Linux-native path before the bash script sees it.
          # Single-quoted PowerShell string passes $GITHUB_WORKSPACE and $((4 << 30))
          # literally so bash expands them (not PowerShell).
          $env:WSLENV = 'GITHUB_WORKSPACE/p'
          wsl -d hogd-smoke -- bash -ec 'mkdir -p ~/devnode; tar -xzf "$GITHUB_WORKSPACE/artifact/hog-devnode-wsl-smoke.tar.gz" -C ~/devnode; bash "$GITHUB_WORKSPACE/scripts/wsl_devnode_smoke.sh" ~/devnode $((4 << 30))'
