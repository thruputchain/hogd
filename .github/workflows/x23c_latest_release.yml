name: x23c latest release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package x23c without uploading or publishing
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'x23/x23c/**'

# Release profiles use the regular toolchain images with all Namespace caching disabled.
env:
  RUSTC_WRAPPER: ""
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "6"
  X23C_RELEASE_SHA: ${{ github.sha }}

# No workflow-level permissions: every job declares its own, and only the
# publish job holds contents: write.

concurrency:
  group: ${{ inputs.dry_run && format('x23c-dry-run-{0}', github.run_id) || 'x23c-latest-release' }}
  cancel-in-progress: false

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: namespace-profile-release-x86
            machine: x86_64
            build_architecture: x86-64-v2
            nproc: 18
          - architecture: arm64
            runner: namespace-profile-release-arm64
            machine: aarch64
            build_architecture: armv8.2-a
            # Leave memory headroom for parallel -O3 -g compiles.
            nproc: 12
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check Linux release image
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          . /etc/os-release
          printf 'Image: %s (%s)\n' "$PRETTY_NAME" "$(dpkg --print-architecture)"
          dpkg-query -W -f='${binary:Package} ${Status} ${Version}\n' \
            libjemalloc-dev ccache ninja-build cbindgen || true
          type -a cmake gcc-15 ccache ninja || true
          printf '#include <jemalloc/jemalloc.h>\nint main(void) { malloc_stats_print(0, 0, 0); }\n' |
            gcc-15 -x c - -o "$RUNNER_TEMP/check-jemalloc" -ljemalloc

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Verify native Linux architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Configure Environment
        run: |
          echo 'GCC_CC=gcc-15' > ./scripts/conf.sh
          echo 'GCC_CXX=g++-15' >> ./scripts/conf.sh
          echo 'NPROC=${{ matrix.nproc }}' >> ./scripts/conf.sh
          chmod u+x ./scripts/conf.sh

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_NAMESPACE=gcc-release-${{ matrix.architecture }}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Build x23c
        run: |
          ./scripts/build.sh \
            -d build/release \
            -t Release \
            -c gcc \
            -x "-DHOGD_USE_SCCACHE=OFF" \
            -x "-DBUILD_ARCHITECTURE=${{ matrix.build_architecture }}" \
            x23c

      - name: Package x23c artifacts
        run: |
          ./scripts/package_x23c_latest_release.sh \
            build/release/x23/x23c/x23c artifacts linux-${{ matrix.architecture }}

      - name: Upload artifact
        if: github.event_name == 'push' || !inputs.dry_run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: error
          name: x23c-linux-${{ matrix.architecture }}
          path: artifacts/x23c-linux-${{ matrix.architecture }}.tar.gz

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  build-macos:
    runs-on: namespace-profile-release-macos-arm64
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Cargo Fetch
        run: ./scripts/fetch.sh

      - name: Use CommandLineTools SDK
        run: |
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
            echo "Switched to CommandLineTools SDK: $(xcrun --show-sdk-path)"
          fi

      - name: Setup Environment
        run: ./scripts/macos-setup.sh

      - name: Build x23c
        run: |
          ./scripts/build.sh \
            -d build/release \
            -t Release \
            -c clang \
            -x "-DHOGD_USE_SCCACHE=OFF" \
            x23c

      - name: Package x23c artifacts
        run: |
          ./scripts/package_x23c_latest_release.sh \
            build/release/x23/x23c/x23c artifacts macos-arm64

      - name: Upload artifact
        if: github.event_name == 'push' || !inputs.dry_run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: error
          name: x23c-macos-arm64
          path: artifacts/x23c-macos-arm64.tar.gz

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Print Log Download Instructions
        if: always()
        uses: ./.github/actions/print-log-instructions

  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x23c-linux-x86_64
          path: artifacts/

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x23c-linux-arm64
          path: artifacts/

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x23c-macos-arm64
          path: artifacts/

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          cd artifacts

          archives=(
            x23c-linux-x86_64.tar.gz
            x23c-linux-arm64.tar.gz
            x23c-macos-arm64.tar.gz
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "# x23c latest"
            echo
            echo "- Source commit: \`${X23C_RELEASE_SHA}\`"
            echo "- Build date: \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\`"
            echo "- Workflow run: ${run_url}"
          } > release_notes.md

      - name: Publish latest-x23c release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-x23c
          target_commitish: ${{ github.sha }}
          name: x23c latest
          body_path: artifacts/release_notes.md
          overwrite_files: true
          files: |
            artifacts/x23c-linux-x86_64.tar.gz
            artifacts/x23c-linux-arm64.tar.gz
            artifacts/x23c-macos-arm64.tar.gz
            artifacts/SHA256SUMS
          draft: false
          prerelease: true
          make_latest: false

      - name: Move latest-x23c tag to published commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sha = process.env.X23C_RELEASE_SHA;
            try {
              await github.rest.git.updateRef({
                ...context.repo,
                ref: "tags/latest-x23c",
                sha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                ...context.repo,
                ref: "refs/tags/latest-x23c",
                sha,
              });
            }

      - name: Generate protocol synchronizer app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol-rs
          permission-actions: write

      - name: Trigger protocol-rs auto-update
        run: |
          gh workflow run auto-update.yml \
            --repo thruputchain/thruput-protocol-rs \
            --ref main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: x23c-latest-release-artifacts
          if-no-files-found: ignore
          path: artifacts
