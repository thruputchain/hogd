name: x23c Rust output check

# Builds x23c and type-checks its Rust output in a small crate, since nothing
# else in this repository compiles generated Rust.
on:
  pull_request:
    branches: ["main"]
    paths:
      - 'x23/x23c/**'
      - 'x23/tests/rust_check/**'
      - '.github/workflows/x23c_rust_check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  check:
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          submodules: false

      - name: Configure Namespace Cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ~/.cache/rustup

      - name: Use Cached rustup Home
        uses: ./.github/actions/cached-rustup-home

      - name: Build x23c
        run: |
          cmake -S x23 -B build-x23c -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
          cmake --build build-x23c --target x23c --parallel "$(nproc)"

      - name: Check generated Rust
        run: x23/tests/rust_check/check.sh build-x23c/x23c/x23c
