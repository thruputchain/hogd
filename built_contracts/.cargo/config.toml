[alias]
b = "build --target wasm32-unknown-unknown"

[registries]
groundhog = { index = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[source]
groundhog = { registry = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "panic=immediate-abort",
    "-C", "link-args=-zstack-size=30000",
    "-Z", "unstable-options",
    "--deny", "warnings",
    ]

[target.riscv32im-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tgroundhog-rv32.ld",
    "-C", "link-arg=-static",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=--gc-sections",
    # The groundhog-rv32 linker script deliberately overlaps the CODE and DATA
    # VMAs (modified-Harvard: separate VM address spaces) so DATA starts near 0
    # and the stored image carries no code-sized zero shadow. Tell lld the
    # overlap is intentional.
    "-C", "link-arg=--no-check-sections",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-Z", "trap-unreachable=false",
    "--deny", "warnings",
    ]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

[profile.bottle_test]
inherits = "release"
