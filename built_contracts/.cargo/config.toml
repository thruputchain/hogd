[alias]
b = "build --target wasm32-unknown-unknown"

[registries]
groundhog = { index = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[source]
groundhog = { registry = "sparse+https://groundhog.dev/crates/api/v1/crates/" }

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "panic=immediate-abort",
    "-C", "link-args=-zstack-size=30000",
    "-Z", "unstable-options",
    "--deny", "warnings",
    ]

[target.riscv32im-unknown-none-elf]
rustflags = [
    # The hogd rv32 VM permits unaligned data loads/stores, so let LLVM emit
    # them directly instead of byte-wise expansions.
    "-C", "target-feature=+unaligned-scalar-mem",
    # 32K stack reserve (sdk default: 24K). dev_wallet's create_wallet path
    # keeps ~7 ScratchBufs live across its transfer + deploy + initialize
    # cross-calls; measured peak is 28-30K (bisected via the devnode
    # BootstrapAccountCanCreateInitializedDevWallet test). Matches the
    # 30000-byte wasm stack above. NOTE: lld only honors --defsym over the
    # script's PROVIDE default when it appears BEFORE -T on the link line,
    # so this must stay ahead of the -T flag below.
    "-C", "link-arg=--defsym=__stack_size=0x8000",
    "-C", "link-arg=-Tgroundhog-rv32.ld",
    "-C", "link-arg=-static",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=--gc-sections",
    # The groundhog-rv32 linker script deliberately overlaps the CODE and DATA
    # VMAs (modified-Harvard: separate VM address spaces) so DATA starts near 0
    # and the stored image carries no code-sized zero shadow. Tell lld the
    # overlap is intentional.
    "-C", "link-arg=--no-check-sections",
    # The hogd rv32 VM admits the canonical `unimp` trap (0xc0001073), so use
    # immediate-abort: panic sites compile straight to the trap instruction
    # instead of routing through the SDK ebreak panic handler, stripping the
    # panic-formatting machinery by construction. Requires unstable-options.
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
    "-C", "relocation-model=static",
    "-Z", "trap-unreachable=false",
    "--deny", "warnings",
    ]

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

[profile.bottle_test]
inherits = "release"
