cargo-features = ["trim-paths"] #unstable

[workspace]
resolver = "3"
members = [
    "integration_test_contracts/authclaim_test",
    "integration_test_contracts/calldata_raw",
    "integration_test_contracts/calldata_wrapper",
    "integration_test_contracts/cxs_roundtrip",
    "integration_test_contracts/default_wallet",
    "integration_test_contracts/dev_wallet",
    "integration_test_contracts/deploy_and_transfer",
    "integration_test_contracts/delegate_call_test",
    "integration_test_contracts/ed25519_verify_wrapper",
    "integration_test_contracts/fibonacci",
    "integration_test_contracts/fibonacci_call",
    "integration_test_contracts/fibonacci_raw",
    "integration_test_contracts/genesis_root",
    "integration_test_contracts/hash_bug",
    "integration_test_contracts/htlc",
    "integration_test_contracts/itc_erc20",
    "integration_test_contracts/manual_revert_caller",
    "integration_test_contracts/manual_revert_test",
    "integration_test_contracts/nnint_output_fault_test",
    "integration_test_contracts/no_syscall_test",
    "integration_test_contracts/nocontract_wallet",
    "integration_test_contracts/output_alias_test",
    "integration_test_contracts/payment_channel",
    "integration_test_contracts/read_only_test",
    "integration_test_contracts/return_fault_test",
    "integration_test_contracts/rv32_smoke_counter",
    "integration_test_contracts/sha256_raw",
    "integration_test_contracts/sha256_wrapper",
    "integration_test_contracts/simple_wallet",
    "integration_test_contracts/simple_wallet_authclaim",
    "integration_test_contracts/syscall_misc_tests",
    "integration_test_contracts/syscall_parse_hardening_test",
    "integration_test_contracts/tuple_return",
    "integration_test_contracts/txs_roundtrip",
    "integration_test_contracts/view_gateway_test",
    "local_test_contracts/airdrop_faucet",
    "local_test_contracts/auth_weight_test",
    "local_test_contracts/drip_faucet",
    "local_test_contracts/faucet_caller",
    "local_test_contracts/invoke_malformed_tokens_test",
    "local_test_contracts/tx_context_test",
]

[workspace.package]
version = "0.2.0"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
repository = "https://github.com/groundhogchain/example-contracts.git"
homepage = "https://github.com/groundhogchain/example-contracts.git"
keywords = ["groundhog"]
categories = ["blockchain"]
edition = "2024"

[workspace.dependencies]
# groundhog dependencies
sdk = { registry = "groundhog", version = "0.34.3" }
groundhog-rv32-runtime = { registry = "groundhog", version = "0.34.3" }
# default features include std, which cannot build for the on-chain targets
groundhog-domain-separator = { registry = "groundhog", version = "0.34.3", default-features = false }
groundhog-xdr = { registry = "groundhog", version = "0.35.2", features = ["xdrs", "syscalls"] }
groundhog-syscall = { registry = "groundhog", version = "0.35.2" }
xdrs = { registry = "groundhog", version = "0.10.1", features = ["int128", "heapless"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
hex-literal = "1.0.0"
serde = { version = "1.0.217", default-features = false }

# Standard interface crates. Their own version line in sdk_rs.
# ERC20 0.1.24 is the first release where mint and burn are their own events
# rather than transfers from or to the zero address.
groundhog-erc20-if = { registry = "groundhog", version = "0.1.30" }

# Standard test crates. Only reached through optional contract features that
# nothing here enables, but cargo resolves optional deps regardless.
bottle-test-if = { registry = "groundhog", version = "0.34.3" }
erc20-test = { registry = "groundhog", version = "0.34.3" }
erc20-bottle-test = { registry = "groundhog", version = "0.34.3" }
erc20-native-test = { registry = "groundhog", version = "0.34.3" }

[profile.release]
trim-paths = "all" # unstable
