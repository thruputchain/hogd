cargo-features = ["trim-paths", "profile-rustflags"] #unstable

[workspace]
members = [
    "integration_test_contracts/simple_wallet",
    "integration_test_contracts/fibonacci",
    "integration_test_contracts/cxs_roundtrip",
    "integration_test_contracts/txs_roundtrip",
    "integration_test_contracts/read_only_test",
    "integration_test_contracts/fibonacci_call",
    "integration_test_contracts/manual_revert_test",
    "integration_test_contracts/manual_revert_caller",
    "integration_test_contracts/initial_token_claim",
    "integration_test_contracts/itc_erc20",
    "integration_test_contracts/no_syscall_test",
    "integration_test_contracts/simple_wallet_authclaim",
    "integration_test_contracts/authclaim_test",
    "integration_test_contracts/hash_bug",
    "integration_test_contracts/htlc",
    "integration_test_contracts/payment_channel",
    "integration_test_contracts/return_fault_test",
    "integration_test_contracts/tuple_return",
    "integration_test_contracts/sha256_wrapper"
]
resolver = "2"

[workspace.dependencies]
# groundhog dependencies
sdk = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
xdrs = { registry = "groundhog", version = "0.4" }
groundhog-xdr = { registry = "groundhog", version = "0.1.3" }
groundhog-erc20-if = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
groundhog-erc1271-if = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
erc20-bottle-test = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
erc20-native-test = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
bottle-test-if = { git = "ssh://git@github.com/groundhogchain/sdk_rs.git" }
serde = { version = "1.0.217", default-features = false }
sha2 = { version = "0.10.6" }

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = false
strip = "none"
panic = "abort"

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all" # unstable
#rustflags = [ "-C", "link-args=-zstack-size=64000" ]
