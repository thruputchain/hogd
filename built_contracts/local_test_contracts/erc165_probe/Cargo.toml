[package]
name = "erc165_probe"
description = "Queries another contract's ERC165 interface through ERC165Client, as a real caller would"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[dependencies]
thruput-sdk = { workspace = true }
thruput-erc20-if = { workspace = true }
thruput-erc20-permit-if = { workspace = true }
thruput-erc165-if = { workspace = true }

[lib]
crate-type = ["rlib"]
doctest = false

[features]
entrypoints = []
dev = [
    "thruput-sdk/dev",
    "thruput-erc20-if/dev",
    "thruput-erc20-permit-if/dev",
    "thruput-erc165-if/dev",
]

[[bin]]
name = "erc165_probe"
path = "src/main.rs"
required-features = ["entrypoints"]
