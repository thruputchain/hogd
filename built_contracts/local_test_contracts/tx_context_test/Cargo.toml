[package]
name = "tx_context_test"
version = "0.2.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
entrypoints = []
dev = ["sdk/dev"]
logging = ["sdk/logging"]

[[bin]]
name = "tx_context_test"
path = "src/main.rs"
required-features = ["entrypoints"]
