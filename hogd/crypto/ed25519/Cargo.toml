[package]
name = "ed25519_lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[workspace]

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["batch"] }

[dev-dependencies]
rand = "0.8.5"

[lib]
crate-type = ["staticlib"]

# Optimize for release builds
[profile.release]
lto = "fat"
codegen-units = 1
