[workspace]
members = ["macros"]

[package]
name = "rs_contract_sdk"
version = "0.0.1"
authors = ["Grounghog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcs = { path = "external/bcs", default-features = false }
rs_xdr = { path = "../xdr/rs_xdr/" }
macros = { path = "macros" }
thiserror = { version = "2.0.11", default-features = false }
serde = { version = "1.0.217", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sha2 = { version = "0.10.8", default-features = false }

[features]
alloc = ["serde/alloc", "bcs/alloc"]
std = ["serde/std", "bcs/std"]
