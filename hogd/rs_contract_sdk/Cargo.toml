[workspace]
members = ["macros"]

[package]
name = "rs_contract_sdk"
version = "0.0.1"
authors = ["Grounghog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcs = { path = "external/bcs", default-features = false }
rs_xdr = { package = "groundhog_xdr", path = "../../rust_contracts/groundhog_xdr/" }
macros = { path = "macros" }
thiserror = { version = "2.0.11", default-features = false }
serde = { version = "1.0.217", default-features = false }
serde_arrays = { path = "external/serde_arrays", default-features = false }
test_ffi = { path = "../../rust_contracts/test_ffi", optional = true}

[features]
alloc = ["serde/alloc", "bcs/alloc", "serde_arrays/alloc", "rs_xdr/alloc"]
std = ["alloc", "serde/std", "bcs/std", "rs_xdr/std"]
mock = ["std", "dep:test_ffi", "test_ffi/activate"]
