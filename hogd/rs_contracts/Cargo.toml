[workspace]
resolver = "2"

members = [
    "basic",
    "basic_alloc",
    "test_calldata",
    "test_invoke_1",
    "test_invoke_2",
    "echo",
    "test_echo"
]

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = 0
strip = "debuginfo"
panic = "abort"


[profile.release]
opt-level = "z"
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
