cargo-features = ["trim-paths"]

[workspace]
resolver = "2"

members = [
    "basic",
    "basic_alloc",
    "test_bytestring",
    "genesis_deployer",
    "erc20",
    "caller",
    "simple_wallet",
    "rcq_test",
]

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = false
strip = "debuginfo"
panic = "abort"

[profile.test]
# settings inherited from profile.dev

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all"  # unstable
