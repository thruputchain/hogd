[workspace]
resolver = "2"

members = [
    "basic",
    "basic_alloc",
    "test_calldata",
    "test_invoke_1",
    "test_invoke_2",
    "echo",
    "test_echo",
    "test_bytestring",
    "test_nnint64",
    "genesis_deployer",
    "erc20",
    "simple_wallet",
    "test_deploy_revert_1",
    "test_deploy_revert_2",
    "test_reentrant_revert",
    "test_optional_argument",
]

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = 0
strip = "debuginfo"
panic = "abort"


[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

