# Strip private prefixes of filesystem paths from binaries
cargo-features = ["trim-paths"]

[workspace]
resolver = "2"

members = [
    "erc20",
    "erc20_geoff",
    "caller",
    "genesis_deployer",
    "rcq_test",
    "simple_wallet",
    "test_bytestring",
]

[workspace.dependencies]
serde = { version = "1.0.217", default-features = false }
sdk = { package = "rs_contract_sdk", path = "../rs_contract_sdk/" }

[profile.dev]
opt-level = "z"
overflow-checks = false
debug = false
strip = "debuginfo"
panic = "abort"

[profile.test]
# settings inherited from profile.dev

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
trim-paths = "all"  # unstable
