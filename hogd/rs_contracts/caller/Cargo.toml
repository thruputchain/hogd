[package]
name = "caller"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
erc20 = { path = "../erc20", default-features = false, features = ["client", "alloc"] }

[lib]
crate-type = ["cdylib"]

[features]
default = ["guest", "alloc"]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["sdk/std"]
mock = ["sdk/mock"]

[dev-dependencies]
caller = { path = ".", features = ["mock", "client", "std"] }
