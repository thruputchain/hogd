[package]
name = "erc20"
version = "0.1.1"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["guest", "alloc"]
client = []
guest = []
alloc = ["sdk/alloc", "serde/alloc"]
std = ["sdk/std", "serde/std"]
mock = ["sdk/mock"]

[dev-dependencies]
erc20 = { path = ".", features = ["mock", "client", "std"] }
