[package]
name = "genesis_deployer"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { package = "rs_contract_sdk", path = "../../rs_contract_sdk/" }

[lib]
crate-type = ["cdylib"]

[features]
default = ["guest", "alloc"]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["sdk/std"]
mock = ["sdk/mock"]

[dev-dependencies]
genesis_deployer = { path = ".", features = ["mock", "client", "std"] }
