[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { workspace = true }
serde = { workspace = true }
erc20_geoff = { path = "../erc20_geoff/", default-features = false, features = ["client", "alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["guest", "alloc"]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["sdk/std"]
mock = ["std", "alloc", "sdk/mock"]

[dev-dependencies]
simple_wallet = { path = ".", features = ["mock", "client", "std"] }
