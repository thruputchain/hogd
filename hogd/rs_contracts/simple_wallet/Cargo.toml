[package]
name = "simple_wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { package = "rs_contract_sdk", path = "../../rs_contract_sdk/" }
erc20_geoff = { path = "../erc20_geoff/", default-features = false, features = ["client", "alloc"] }
serde = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["guest", "alloc"]
client = []
guest = []
alloc = ["sdk/alloc"]
std = ["sdk/std"]
mock = ["std", "alloc", "sdk/mock"]
