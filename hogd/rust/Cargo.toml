[workspace]
members = [
    "crypto",
    "wasmi",
    "wasmtime",
    "unified",
    "contract_types",
    "common"
]
resolver = "2"

[workspace.dependencies]
# Common dependencies that crates can inherit
ed25519-zebra = { version = "4.1" }
lru = "0.14.0"
wasmi = "0.36.0"
bindgen = "0.71"
wasmtime = { version = "39.0.1", features = ["winch", "runtime"] }

# Shared optimization profiles
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true