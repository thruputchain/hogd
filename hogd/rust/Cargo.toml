[workspace]
members = [
    "crypto",
    "wasmi",
    "wasmtime",
    "unified",
    "common",
    "synchronized_map",
    "test_ffi_bindings",
    "wasm_meter"
]
resolver = "2"

[workspace.dependencies]
# Common dependencies that crates can inherit
ed25519-zebra = { version = "4.1" }
lru = "0.14.0"
wasmi = "0.36.5"
bindgen = "0.71"
wasmtime = { version = "=44.0.1", features = ["winch", "runtime", "cranelift", "pooling-allocator"], default-features = false }
siphasher = { version = "1.0.1", default-features = false }
hogexec-internal = { version = "0.10.0", registry = "groundhog" }
groundhog-xdr = { version = "0.10.0", registry = "groundhog", features = ["xdrs"] }
groundhog-wasm-meter = { version = "0.6.1", registry = "groundhog" }

# Shared optimization profiles
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"
strip = "symbols"
