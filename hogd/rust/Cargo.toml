[workspace]
members = [
    "crypto",
    "unified",
    "synchronized_map",
    "test_ffi_bindings",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies that crates can inherit
ed25519-zebra = { version = "4.1" }
lru = "0.14.0"
bindgen = "0.71"
siphasher = { version = "1.0.1", default-features = false }
hogexec-internal = { version = "0.15.0", registry = "groundhog" }
groundhog-xdr = { version = "0.15.0", registry = "groundhog", features = ["xdrs"] }

# Shared optimization profiles
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"
strip = "symbols"
