[package]
name = "unified_lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[dependencies]
crypto_lib = { path = "../crypto" }
wasmi_lib = { path = "../wasmi" }
wasmtime_lib = { path = "../wasmtime" }
wasm_meter = { path = "../wasm_meter" }

[dev-dependencies]
test_ffi_bindings = { path = "../test_ffi_bindings" }

[features]
debug_logging = ["wasmi_lib/debug_logging", "wasmtime_lib/debug_logging"]
wasm_debug = ["wasmtime_lib/wasm_debug"]

[lib]
crate-type = ["staticlib", "cdylib"]

