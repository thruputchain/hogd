[package]
name = "wasmtime_lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[dependencies]
wasmtime = { workspace = true }
common = {path = "../common"}
synchronized_map = { path = "../synchronized_map" }
groundhog-wasm-meter = { workspace = true }

[build-dependencies]
wat = "1.219.1"
groundhog-wasm-meter = { workspace = true }

[dev-dependencies]
wasmtime = { workspace = true }
wat = "1.219.1"

[features]
debug_logging = []
wasm_debug = ["wasmtime/debug-builtins", "wasmtime/debug"]

[lib]
crate-type = ["rlib"]

# Optimization profiles are inherited from workspace

