# File customized from the following template cbindgen.toml.
#
# See https://github.com/mozilla/cbindgen/blob/master/docs.md#cbindgentoml
# for detailed documentation of every option here.

language = "C++"

############## Options for Wrapping the Contents of the Header #################

pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Do not modify this manually. */"
include_version = false
namespace = "hogd"
using_namespaces = []
sys_includes = []
includes = []
no_includes = false
after_includes = ""

############################ Code Style Options ################################

braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"

############################# Codegen Options ##################################

style = "both"
sort_by = "Name"
usize_is_size_t = true

[export]
include = []
exclude = []

[fn]
rename_args = "None"
args = "auto"
sort_by = "Name"

[struct]
rename_fields = "None"
derive_constructor = false
derive_eq = false

[enum]
rename_variants = "None"
enum_class = true

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "Name"

[parse]
parse_deps = true
include = ["common"]
exclude = []
clean = false
extra_bindings = ["common"]

[parse.expand]
crates = []
all_features = false
default_features = true
features = []
