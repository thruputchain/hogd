syscalls:
  - name: "SHA256"
    needs_context: no
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
      - name: "hash"
        typename: "SHA256Hash"
    number: 0
  - name: "GetMsgSender"
    needs_context: yes
    inputs:
    outputs:
      - name: "sender"
        typename: "ContractAddress"
    number: 1
  - name: "GetCalldataLen"
    needs_context: Yes
    inputs:
    outputs:
      - name: "len"
        typename: "RuntimeMemoryLength"
    number: 2
  - name: "GetCalldata"
    needs_context: yes
    inputs:
    outputs:
      - name: "buffer"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 3
  - name: "Log"
    needs_context: yes
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
    number: 4
  - name: "Invoke"
    needs_context : yes
    needs_gas: yes
    inputs:
      - name: "address"
        typename: "ContractAddress"
      - name: "method"
        typename: "MethodID"
        primitive_type: yes
      - name: "gas_limit"
        typename: "GasAmount"
        primitive_type: yes
      - name: "calldata"
        span_argument: yes
    outputs:
      - name: return_buffer_len
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    syscall_return_type: "HostFnResult"
    number: 5
  - name: "Return"
    needs_context: yes
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
    returns: no
    number: 6
  - name: "GetReturnedBuffer"
    needs_context: yes
    inputs:
    outputs:
      - name: "buffer"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 7
  - name: "Exit"
    needs_context: no
    syscall_return_type: "HostFnResult"
    inputs:
      - name: "code"
        fixed_size: yes
        typename: "int32_t"
        rust_typename: "i32"
        primitive_type: yes
    outputs:
    returns: no
    number: 8
  - name: "GetDeployAddress"
    needs_context : yes
    inputs:
      - name: "caller_address"
        fixed_size: yes
        typename: "ContractAddress"
        optional: yes
      - name: "nonce"
        fixed_size: yes
        typename: "SHA256Hash"
      - name: "contract_hash"
        fixed_size: yes
        typename: "SHA256Hash"
    outputs:
      - name: "to_be_deployed"
        typename: "ContractAddress"
    number: 9
  - name: "DeployContract"
    needs_context : yes
    inputs:
      - name: "nonce"
        fixed_size: yes
        typename: "SHA256Hash"
      - name: "contract_hash"
        fixed_size: yes
        typename: "SHA256Hash"
    outputs:
      - name: "deployed_address"
        typename: "ContractAddress"
    number: 10
  - name: "GetSourceTransactionHash"
    needs_context : yes
    inputs:
    outputs:
      - name: "source_tx_hash"
        typename: "SHA256Hash"
    number: 11
  - name: "VerifySignature"
    needs_context: no
    inputs:
      - name: "signature"
        typename: "Signature"
        custom_parsing: yes
        custom_args_required: 2
      - name: "public_key"
        typename: "PublicKey"
        custom_parsing: yes
        custom_args_required: 2
      - name: "message"
        span_argument: yes
    outputs:
        # No outputs: check the error code returned
    number: 12
  - name: "BytestringGetLen"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "length"
        typename: "RuntimeMemoryLength"
    number: 13
  - name: "BytestringGet"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "bytestring"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
    number: 14
  - name: "BytestringSet"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "bytestring"
        span_argument: yes
    outputs:
    number: 15
  - name: "NonnegativeIntGet"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "current_set"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
      - name: "current_add"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
    number: 16
  - name: "NonnegativeIntSetAdd"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "set_value"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        syscall_pass_by_value: yes
      - name: "add_value"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        syscall_pass_by_value: yes
    outputs:
    number: 17
  - name: "DeleteObject"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
    number: 18

errors:
  - name: "None"
    number: 0
    doc: "No error"
  - name: "Fault"
    number: 1
    doc: "Out of bounds pointer to wasm memory passed to syscall"
  - name: "NoSyscall"
    number: 2
    doc: "System call for supplied number is not supported"
  - name: "IsRootTransaction"
    number: 3
    doc: "Cannot call get_msg_sender on root invocation"
  - name: "ContractLookupFailed"
    number: 4
    doc: "Failed to find contract"
  - name: "ContractAlreadyDeployed"
    number: 5
    doc: "Attempt made to deploy a contract twice (same nonce and contract hash, from same address)"
  - name: "NoReturnBufferAvailable"
    number: 6
    doc: "No return buffer is available.  Either the most recent subcall failed, or there have been no subcalls within this call frame."
  - name: "InsufficientGasForInvocation"
    number: 7
    doc: "Insufficient gas in call frame to supply requested gas limit for child invocation"
  - name: "InvalidSyscallInput"
    number: 8
    doc: "Invalid input to a syscall, such as subtracting below 0 on an nnint64"
  - name: "StorageKeyNotExist"
    number: 9
    doc: "Accessing a storage key that does not exist in the current view"

    # those that cause call frames to revert
  - name: "DeterministicWasm"
    number: -1
    doc: "Deterministic error within called wasm (i.e. trap)"
