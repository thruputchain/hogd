syscalls:
  - name: "SHA256"
    needs_context: no
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
      - name: "hash"
        typename: "SHA256Hash"
    number: 0
  - name: "GetMsgSender"
    needs_context: yes
    inputs:
    outputs:
      - name: "sender"
        typename: "ContractAddress"
    number: 1
  - name: "BytestringGetLen"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "length"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 2
  - name: "BytestringGet"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "bytestring"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 3
  - name: "BytestringSet"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "bytestring"
        span_argument: yes
    outputs:
    number: 4
  - name: "HasKey"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "status"
        typename: "StorageObjectType"
        rust_typename: "i32"
        primitive_type: yes
    number: 5
  - name: "DeleteLast"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
    number: 6
  - name: "GetCalldataLen"
    needs_context: Yes
    inputs:
    outputs:
      - name: "len"
        typename: "RuntimeMemoryLength"
    number: 7
  - name: "GetCalldata"
    needs_context: yes
    inputs:
    outputs:
      - name: "buffer"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 8
  - name: "Log"
    needs_context: yes
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
    number: 9
  - name: "Invoke"
    needs_context : yes
    inputs:
      - name: "address"
        typename: "ContractAddress"
      - name: "method"
        typename: "MethodID"
        primitive_type: yes
      - name: "gas_limit"
        typename: "GasAmount"
        primitive_type: yes
      - name: "calldata"
        span_argument: yes
    outputs:
      - name: "return_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    syscall_return_type: "HostFnResult"
    number: 10
  - name: "NonnegativeInt64Get"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "result"
        typename: "int64_t"
        rust_typename: "i64"
        primitive_type: yes
    number: 11
  - name: "NonnegativeInt64SetAdd"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "set_value"
        typename: "int64_t"
        rust_typename: "i64"
        primitive_type: yes
      - name: "add_value"
        typename: "int64_t"
        rust_typename: "i64"
        primitive_type: yes  
    outputs:
    number: 12
  - name: "NonnegativeInt64Add"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "add_value"
        typename: "int64_t"
        rust_typename: "i64"
        primitive_type: yes  
    outputs:
    number: 13
  - name: "Return"
    needs_context: yes
    inputs:
      - name: "buffer"
        span_argument: yes
    outputs:
    returns: no
    number: 14
  - name: "GetReturnedBuffer"
    needs_context: yes
    inputs:
    outputs:
      - name: "buffer"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 15
  - name: "GetDeployAddress"
    needs_context : yes
    inputs:
      - name: "caller_address"
        typename: "ContractAddress"
        optional: yes
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "to_be_deployed"
        typename: "ContractAddress"
    number: 16
  - name: "DeployContract"
    needs_context : yes
    inputs:
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "deployed_address"
        typename: "ContractAddress"
    number: 17
  - name: "GetSourceTransactionHash"
    needs_context : yes
    inputs:
    outputs:
      - name: "source_tx_hash"
        typename: "SHA256Hash"
    number: 18
  - name: "Exit"
    needs_context: no
    syscall_return_type: "HostFnResult"
    inputs:
      - name: "code"
        typename: "int32_t"
        rust_typename: "i32"
        primitive_type: yes
    outputs:
    returns: no
    number: 19
  - name: "VerifySignature"
    needs_context: no
    inputs:
      - name: "pk"
        typename: "PublicKey"
        custom_parsing: yes
        custom_args_required: 2
      - name: "sig"
        typename: "Signature"
        custom_parsing: yes
        custom_args_required: 2
      - name: "message"
        span_argument: yes
    outputs:
    number: 20 
  - name: "ReplayCacheInsert"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "nonce"
        typename: "uint64_t"
        rust_typename: "u64"
        primitive_type: yes
    outputs:
    number: 21 
  - name: "ReplayCacheClear"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "threshold"
        typename: "uint64_t"
        rust_typename: "u64"
        primitive_type: yes
    outputs:
    number: 22
  - name: "GetSelfAddress"
    needs_context: yes
    inputs:
    outputs:
      - name: "self_address"
        typename: "ContractAddress"
    number: 23
  - name: "GetBlockNumber"
    needs_context: yes
    inputs:
    outputs:
      - name: "block_number"
        typename: "uint64_t"
        rust_typename: "u64"
        primitive_type: yes
    number: 24
  - name: "MessageQueueAppend"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "message"
        span_argument: yes
    outputs:
    number: 25
  - name: "MessageQueueConsume"
    needs_context: yes
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "message"
        span_argument: yes
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: yes
    number: 26


errors:
  - name: "None"
    number: 0
    doc: "No error"
  - name: "Fault"
    number: 1
    doc: "Out of bounds pointer to wasm memory passed to syscall"
  - name: "StorageObjectTypeMismatch"
    number: 2
    doc: "Syscall's expected type does not match object type at provided key"
  - name: "StorageKeyNExist"
    number: 3
    doc: "Access to storage object that does not logically exist.
    An object exists if it exists at the start of a transaction (in the ledger snapshot),
    or if it is created by an operation in that transaction.  The DeleteLast syscall
    is not factored into this calculation, as those deletions are only applied at the end of a block." 
  - name: "NoSyscall"
    number: 4
    doc: "System call for supplied number is not supported"
  - name: "UnknownEnumVariant"
    number: 5
    doc: "Syscall returned an enum variant unrecognized by this contract"
  - name: "IsRootTransaction"
    number: 6
    doc: "Cannot call get_msg_sender on root invocation"
  - name: "ContractLookupFailed"
    number: 7
    doc: "Failed to find contract"
  - name: "StringTooLong"
    number: 8
    doc: "Input byte span is too long"
  - name: "NoReturnBufferAvailable"
    number: 10
    doc: "No return buffer is available.  Either the most recent subcall failed, or there have been no subcalls within this call frame."
  - name: "InsufficientGasForInvocation"
    number: 11
    doc: "Insufficient gas in call frame to supply requested gas limit for child invocation"
  - name: "InvalidSyscallInput"
    number: 12
    doc: "Invalid input to a syscall, such as subtracting below 0 on an nnint64 or setting to two distinct values in one transaction"
  - name: "ContractAlreadyDeployed"
    number: 13
    doc: "Attempt made to deploy a contract twice (same nonce and contract hash, from same address)"
  - name: "CalldataParseError"
    number: 14
    doc: "Failed to parse the input calldata into the contract's input signature"
  - name: "ReturnParseError"
    number: 15
    doc: "Failed to parse the return buffer into the contract's output signature"

    # those that cause call frames to revert
  - name: "DeterministicWasm"
    number: -1
    doc: "Deterministic error within called wasm (i.e. trap)"
