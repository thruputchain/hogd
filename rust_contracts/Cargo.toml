[workspace]
resolver = "2"

members = [
    "native_exec",
    "groundhog_xdr",
    "blank_contract"
]

[profile.dev]
opt-level = 0
panic = "abort"

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
