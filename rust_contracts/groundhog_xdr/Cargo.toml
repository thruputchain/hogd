[package]
name = "groundhog_xdr"
version = "0.0.1"
authors = ["Grounghog Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
alloc = []
std = ["alloc"]

[dev-dependencies]
groundhog_xdr = {path = ".", features=["std"]}

[dependencies]
serde = { version = "1.0.217", default-features = false, features = ["alloc"] }
serde_arrays = { path = "../../hogd/rs_contract_sdk/external/serde_arrays", default-features = false, features = ["alloc"] }
