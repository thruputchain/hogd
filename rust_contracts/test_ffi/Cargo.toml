[package]
name = "test_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
groundhog_xdr = {path = "../groundhog_xdr"}
sha2 = {version = "0.10", default-features=false}

[features]
activate = ["groundhog_xdr/std", "sha2/default"]

[build-dependencies]
cmake = "0.1"
bindgen = "0.71"

[dev-dependencies]
test_ffi = {path = ".", features=["activate"]}
