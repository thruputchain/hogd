name = "asyncio_stress_test_ci"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Google benchmark seems to add Werror in release builds, which for some reason interacts badly with asan 
# (some kind of uninitialized variable in stdlib), so we disable benchmark builds in release mode.
# We disable it overall just to save build time, but it's required for the gcc release build with asan.

echo 'build gcc debug'
./scripts/build.sh -d build/gcc_debug -c gcc -t Debug -x "-DBUILD_BENCHMARKS=OFF"

# SyscallRcqPeekTest.ConsumeCapErrorAgreesProposalAndValidationDbHash is a
# deterministic RCQ DbHash-agreement unit test that drives the per-transaction
# observation cap (protocol kMaxConcurrentRcqReadsPerTx = 16384) to its
# boundary, then finalizes two blocks and replays the whole sequence in
# validation mode. The test harness talks to its event server over x23 sockets,
# and this schedule pins those sockets to 1-byte buffers (X23_RCVBUF/SNDBUF=1),
# which throttles the test's ~16k per-op round-trips into a >600s crawl. It
# exercises no asyncio behavior this schedule is meant to stress and passes
# quickly under normal socket buffers, so exclude it here; it stays fully
# covered by the gcc-debug/llvm-debug/gcc-release CI (cpp-namespace-optimized).
RCQ_DBHASH_SLOW='ConsumeCapErrorAgreesProposalAndValidationDbHash'

# SizeCapIgnoresSignedTransactionWrapper moves the largest RPC payloads in the
# suite: it proposes a transaction body sitting exactly on the
# kMaxBytesTransaction cap (1.9 MB) twice -- once in a thin SignedTransaction,
# once in a wrapper padded past kMaxBytesSignedTransaction + 64 KiB -- and then
# validates the padded one, so roughly 6 MB of SignedTransaction crosses the
# executor's x23 socket in three calls. X23_RCVBUF=1 clamps the executor's
# accepted sockets to the kernel's minimum receive buffer, which is smaller than
# a single loopback segment, so the sender can fall into zero-window persist
# probing whose retransmit backoff runs to tens of seconds. The resulting stall
# is random rather than proportional to the payload -- run #300 (#4072) pushed
# the 1.9 MB thin wrapper through in under a second and then sat on the padded
# one for the whole 100s ctest timeout -- which is why the test cleared runs
# #295-#299 unchanged. X23_SNDBUF=1 throttles the reply direction rather than
# the bulk upload, so the test stays in that pass, and normal socket buffers
# cover it in the gcc-debug/llvm-debug/gcc-release CI (cpp-namespace-optimized).
SIZE_CAP_BULK_SLOW='SizeCapIgnoresSignedTransactionWrapper'

export X23_RCVBUF=1

echo 'run gcc tests RCVBUF=1'
ctest --test-dir build/gcc_debug --parallel --timeout 100 --output-on-failure -E "rpcstress_writebuf|${RCQ_DBHASH_SLOW}|${SIZE_CAP_BULK_SLOW}"

unset X23_RCVBUF

export X23_SNDBUF=1
echo 'run gcc tests SNDBUF=1'
ctest --test-dir build/gcc_debug --parallel --timeout 100 --output-on-failure -E "${RCQ_DBHASH_SLOW}"
unset X23_SNDBUF

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
bindings_1 = "?"
