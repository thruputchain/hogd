CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
ccache_clang_debug_x23_coro_trace_off = "?"


[[jobs]]
name = "{{ .hog_schedule }}_clang_debug_test_ffi_no_bench_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote remove origin 2>/dev/null || true
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git reset --hard 2>/dev/null || true
git clean -ffd -e .ssh/ -e .gitconfig
git checkout -f -q {{ .git_commit }}

git submodule update --init --recursive --depth 1 --jobs 8 --quiet

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

HOGD_CCACHE_WARMUP_COMPILER=clang \
HOGD_CCACHE_WARMUP_BUILD_TYPE=Debug \
HOGD_CCACHE_WARMUP_VARIANT=test-ffi-no-bench \
  ./scripts/ci/warm_ccache.sh {{ .git_commit }}

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
HOGD_CCACHE_WARMUP_JOBS = "{{ .hogd_ccache_warmup_jobs }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
ccache_clang_debug_test_ffi_no_bench = "?"
