name = "ccache_warmup"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """
set -euo pipefail
set -x

git archive --remote=git@github.com:{{ .github_repo }}.git {{ .git_commit }} scripts/ci/warm_ccache_hog_sched_job.sh | tar -x
set +x
CARGO_REGISTRIES_GROUNDHOG_TOKEN="{{ .cargo_registry_token }}" \
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS="{{ .cargo_registry_global_credential_providers }}" \
HOGD_CCACHE_WARMUP_JOBS="{{ .hogd_ccache_warmup_jobs }}" \
  ./scripts/ci/warm_ccache_hog_sched_job.sh "{{ .github_repo }}" "{{ .git_commit }}" "{{ .hog_host }}"
"""

[jobs.host]
ccache_gcc_release_default = "?"
ccache_gcc_release_x23_coro_trace_on = "?"
ccache_gcc_release_x23_coro_trace_off = "?"
ccache_gcc_release_test_ffi_no_bench = "?"
ccache_gcc_debug_default = "?"
ccache_gcc_debug_x23_coro_trace_on = "?"
ccache_gcc_debug_x23_coro_trace_off = "?"
ccache_gcc_debug_test_ffi_no_bench = "?"
ccache_clang_release_default = "?"
ccache_clang_release_x23_coro_trace_on = "?"
ccache_clang_release_x23_coro_trace_off = "?"
ccache_clang_release_test_ffi_no_bench = "?"
ccache_clang_debug_default = "?"
ccache_clang_debug_x23_coro_trace_on = "?"
ccache_clang_debug_x23_coro_trace_off = "?"
ccache_clang_debug_test_ffi_no_bench = "?"
