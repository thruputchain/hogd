name = "combined_metrics_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

# Fetch Go dependencies before any lengthy Rust/C++ preparation or build.
bash ./scripts/ci/fetch_go_modules.sh || exit 1

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x "-DBUILD_BENCHMARKS=ON" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel 16 > build2.log 2>&1 || (cat build2.log && exit 1)
# EXCLUDE_FROM_ALL, so the full build above skips it; the metrics job runs it
# on a bench host through [schedgateway_bench_remote.sh].
cmake --build release --parallel "$(nproc)" --target schedgateway_client_bench > build2b.log 2>&1 || (cat build2b.log && exit 1)
# These build scripts place the binaries in the current working directory, so we
# [pushd release] so that the binaries are placed in the [release] directory.
pushd release >/dev/null
../groundhog-go/chuckd/scripts/build_chuckd.sh > build3.log 2>&1 || (cat build3.log && exit 1)
../groundhog-go/chuckd/scripts/build_scpd.sh > build4.log 2>&1 || (cat build4.log && exit 1)
popd >/dev/null

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'reap whatever is holding the control port'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap the port's holder before we start, and fail loudly naming it
# if the port cannot be freed, so a stale server can't silently slip through
# and recreate the bind failure as a core dump.
./scripts/ci/reap_control_server.sh $CI_CONTROL_PORT

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel 16 > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=ci_work_dir/
source ./scripts/ci/bench_harness.sh

# Drop any digest left by an earlier run on this host, so the report at the end
# of the job describes this run only.
ci_reset_bench_failures

ALL_BENCH_HOSTS=(hog4 hog5 hog6 hog7 hog8 hog9 hog10 hog11)
BENCH_PROCESSES="loadgen_server hog-exec hog-event hog-indexer hog-db hog-auth hog-mempool hog-devnode chuckd chuckd.dev scpd scpd.dev"
CONTROL_CLI=./release/hogd/hog_exec/bench/control_cli

kill_stale_benchmark_processes() {
  ci_remote_killall_hosts "$BENCH_PROCESSES" "${ALL_BENCH_HOSTS[@]}"
}

shutdown_bench_servers() {
  ci_enter_cleanup
  ci_control_shutdown_hosts "$CONTROL_CLI" "$CI_CONTROL_PORT" "${ALL_BENCH_HOSTS[@]}"
}
trap 'shutdown_bench_servers; rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT

echo 'reap whatever is holding the control port'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap the port's holder before we start, and fail loudly naming it
# if the port cannot be freed, so a stale server can't silently slip through
# and recreate the bind failure as a core dump.
./scripts/ci/reap_control_server.sh $CI_CONTROL_PORT

echo 'run local bench server for hog10-hosted services'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/ &

# Each step's output is streamed as usual and also captured under
# [bench_logs/]. This job runs six suites back to back, so its log is long
# enough that GitHub only serves a bounded tail of it: a suite that dies early
# has its crash output evicted by the thousands of lines [metrics.sh] emits
# afterwards. [ci_report_failed_bench_steps] replays the tail of whatever
# failed at the very end of the job, where it is still reachable.
echo 'run multiexec interface benchmarks'
kill_stale_benchmark_processes
ci_run_bench_step exec_scaling ./scripts/ci/exec_scaling.sh

echo 'run makespan benchmark'
# Same hosts as exec_scaling.
kill_stale_benchmark_processes
ci_run_bench_step makespan_bench ./scripts/ci/makespan_bench.sh

echo 'run e2e payment benchmark'
kill_stale_benchmark_processes
ci_run_bench_step mempool_bench ./scripts/ci/mempool_bench.sh

echo 'run e2e payment multi-node benchmark'
# Skip the per-benchmark metrics-history commit; the combined run makes a
# single commit at the end via commit_metrics.sh.
kill_stale_benchmark_processes
ci_run_bench_step mempool_multi_node_bench \
  env MEMPOOL_MULTI_NODE_BENCH_SKIP_COMMIT_METRICS=1 \
  ./scripts/ci/mempool_multi_node_bench.sh

echo 'release hog4, hog5, and hog6'
# hog7 and hog9 stay up to run the schedgateway and auth server benchmarks
# alongside [metrics.sh].
ci_control_shutdown_hosts "$CONTROL_CLI" "$CI_CONTROL_PORT" hog4 hog5 hog6

echo 'run event server benchmarks'
kill_stale_benchmark_processes
ci_run_bench_step event_bench ./scripts/ci/event_bench.sh

echo 'run metrics, with the schedgateway and auth server benchmarks on otherwise idle hog7 and hog9'
# [metrics.sh] runs on hog10, hog11, and hog8 only, so hog7 and hog9 are free.
# Each benchmark stays on its host's loopback and touches none of those hosts.
kill_stale_benchmark_processes
ci_run_bench_step schedgateway_bench_start \
  ./scripts/ci/schedgateway_bench_remote.sh start hog7
ci_run_bench_step auth_bench_start \
  ./scripts/ci/auth_bench_remote.sh start hog9
ci_run_bench_step metrics ./scripts/ci/metrics.sh
ci_run_bench_step schedgateway_bench \
  ./scripts/ci/schedgateway_bench_remote.sh collect hog7
ci_run_bench_step auth_bench \
  ./scripts/ci/auth_bench_remote.sh collect hog9

echo 'release hog7 and hog9'
ci_control_shutdown_hosts "$CONTROL_CLI" "$CI_CONTROL_PORT" hog7 hog9

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

echo 'bench servers will be shut down by EXIT trap'

echo 'check for failures'
# [ci_report_failed_bench_steps] names each failed suite with its exit status
# and replays the tail of its captured output; [ci_report_bench_failures]
# replays the command that killed each suite. This job runs six suites into
# one log and GitHub serves only its tail, so an early failure is past the end
# of the retrievable window by the time the job finishes; these two reports are
# the surviving evidence.
bench_failed=0
ci_report_failed_bench_steps || bench_failed=1

ci_report_bench_failures

if [ "$bench_failed" -ne 0 ]; then
    echo "one or more benchmark steps failed"
    exit 1
fi


"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"


[jobs.host]
metrics_1 = "hog10"
