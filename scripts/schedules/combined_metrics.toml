name = "combined_metrics_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x "-DBUILD_BENCHMARKS=OFF" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
make -C release -j$(nproc) > build2.log 2>&1 || (cat build2.log && exit 1)
# These build scripts place the binaries in the current working directory, so we
# [pushd release] so that the binaries are placed in the [release] directory.
pushd release >/dev/null
../groundhog-go/chuckd/scripts/build_chuckd.sh > build3.log 2>&1 || (cat build3.log && exit 1)
../groundhog-go/chuckd/scripts/build_scpd.sh > build4.log 2>&1 || (cat build4.log && exit 1)
popd >/dev/null

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'reap any control_server left over from a previous run'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap it by name before we start, matching the killall cleanup idiom
# the benchmark scripts already use. Fail loudly if killall is missing, so a
# stale server can't silently slip through and recreate the bind failure.
command -v killall >/dev/null || { echo 'killall not found (install psmisc)'; exit 1; }
killall -TERM control_server 2>/dev/null && sleep 3 || true
killall -KILL control_server 2>/dev/null || true

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hogexec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
make -C release -j$(nproc) > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=ci_work_dir/

shutdown_bench_servers() {
  set +e
  ./release/hogd/hogexec/bench/control_cli hog4 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog5 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog6 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog7 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog8 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog9 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog10 $CI_CONTROL_PORT shutdown
  ./release/hogd/hogexec/bench/control_cli hog11 $CI_CONTROL_PORT shutdown
}
trap shutdown_bench_servers EXIT

echo 'reap any control_server left over from a previous run'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap it by name before we start, matching the killall cleanup idiom
# the benchmark scripts already use. Fail loudly if killall is missing, so a
# stale server can't silently slip through and recreate the bind failure.
command -v killall >/dev/null || { echo 'killall not found (install psmisc)'; exit 1; }
killall -TERM control_server 2>/dev/null && sleep 3 || true
killall -KILL control_server 2>/dev/null || true

echo 'run local bench server for hog10-hosted services'
mkdir -p ci_work_dir/
./release/hogd/hogexec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/ &

echo 'run multiexec interface benchmarks'
(./scripts/ci/exec_scaling.sh) || true
exec_scaling_exit=$?

echo 'run e2e payment benchmark'
(./scripts/ci/mempool_bench.sh) || true
mempool_bench_exit=$?

echo 'run e2e payment multi-node benchmark'
# Skip the per-benchmark metrics-history commit; the combined run makes a
# single commit at the end via commit_metrics.sh.
(MEMPOOL_MULTI_NODE_BENCH_SKIP_COMMIT_METRICS=1 ./scripts/ci/mempool_multi_node_bench.sh) || true
mempool_multi_node_bench_exit=$?

echo 'release hog4, hog5, hog6, hog7, and hog9'
./release/hogd/hogexec/bench/control_cli hog4 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog5 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog6 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog7 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog9 $CI_CONTROL_PORT shutdown

echo 'run event server benchmarks'
(./scripts/ci/event_bench.sh) || true
event_bench_exit=$?

echo 'run metrics'
(./scripts/ci/metrics.sh) || true
metrics_exit=$?

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

echo 'bench servers will be shut down by EXIT trap'

echo 'check for failures'
if [ "$exec_scaling_exit" -ne 0 ] || \
    [ "$mempool_bench_exit" -ne 0 ] || \
    [ "$mempool_multi_node_bench_exit" -ne 0 ] || \
    [ "$event_bench_exit" -ne 0 ] || \
    [ "$metrics_exit" -ne 0 ]; then
    echo "one or more benchmark steps failed"
    exit 1
fi


"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"


[jobs.host]
metrics_1 = "hog10"
