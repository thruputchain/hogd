name = "combined_metrics_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x "-DBUILD_BENCHMARKS=ON" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel "$(nproc)" > build2.log 2>&1 || (cat build2.log && exit 1)
# These build scripts place the binaries in the current working directory, so we
# [pushd release] so that the binaries are placed in the [release] directory.
pushd release >/dev/null
../groundhog-go/chuckd/scripts/build_chuckd.sh > build3.log 2>&1 || (cat build3.log && exit 1)
../groundhog-go/chuckd/scripts/build_scpd.sh > build4.log 2>&1 || (cat build4.log && exit 1)
popd >/dev/null

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'reap any control_server left over from a previous run'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap it by name before we start, matching the killall cleanup idiom
# the benchmark scripts already use. Fail loudly if killall is missing, so a
# stale server can't silently slip through and recreate the bind failure.
command -v killall >/dev/null || { echo 'killall not found (install psmisc)'; exit 1; }
# A server that is going down stops the benchmark processes it launched on the
# way out, and that takes as long as the slowest of them. Escalating on a fixed
# timer kills it part way through and orphans exactly the processes it was
# clearing -- which is how a hog-exec ends up holding 8040 for the next run.
# Wait for it to actually go, then escalate whatever would not.
if killall -TERM control_server 2>/dev/null; then
    for _ in $(seq 1 30); do
        killall -q -s 0 control_server 2>/dev/null || break
        sleep 1
    done
fi
killall -KILL control_server 2>/dev/null || true

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel "$(nproc)" > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=ci_work_dir/
source ./scripts/ci/bench_harness.sh

# Drop any digest left by an earlier run on this host, so the report at the end
# of the job describes this run only.
ci_reset_bench_failures

ALL_BENCH_HOSTS=(hog4 hog5 hog6 hog7 hog8 hog9 hog10 hog11)
BENCH_PROCESSES="loadgen_server hog-exec hog-event hog-indexer hog-db hog-auth hog-mempool chuckd chuckd.dev scpd scpd.dev"
CONTROL_CLI=./release/hogd/hog_exec/bench/control_cli

kill_stale_benchmark_processes() {
  ci_remote_killall_hosts "$BENCH_PROCESSES" "${ALL_BENCH_HOSTS[@]}"
}

shutdown_bench_servers() {
  local exit_code=$1

  ci_enter_cleanup
  # This is the last thing that runs, so a host left dirty here is not this
  # run's problem -- it is the next one's, which inherits the ports and has no
  # record of what is holding them. Fail the job while there is still a run to
  # attach the failure to. A job that was already failing keeps its own status.
  if ! ci_control_shutdown_hosts "$CONTROL_CLI" "$CI_CONTROL_PORT" \
    "${ALL_BENCH_HOSTS[@]}"; then
    [ "$exit_code" -ne 0 ] || exit_code=1
  fi

  exit "$exit_code"
}
trap 'shutdown_bench_servers "$?"' EXIT

echo 'reap any control_server left over from a previous run'
# A control_server from a previous run can still be alive and holding the
# deterministic control port, failing this run's bind with "address already in
# use". The end-of-run shutdown RPC is sent, but the server can fail to actually
# come down. Reap it by name before we start, matching the killall cleanup idiom
# the benchmark scripts already use. Fail loudly if killall is missing, so a
# stale server can't silently slip through and recreate the bind failure.
command -v killall >/dev/null || { echo 'killall not found (install psmisc)'; exit 1; }
# A server that is going down stops the benchmark processes it launched on the
# way out, and that takes as long as the slowest of them. Escalating on a fixed
# timer kills it part way through and orphans exactly the processes it was
# clearing -- which is how a hog-exec ends up holding 8040 for the next run.
# Wait for it to actually go, then escalate whatever would not.
if killall -TERM control_server 2>/dev/null; then
    for _ in $(seq 1 30); do
        killall -q -s 0 control_server 2>/dev/null || break
        sleep 1
    done
fi
killall -KILL control_server 2>/dev/null || true

echo 'run local bench server for hog10-hosted services'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/ &

# Each step's output is streamed as usual and also captured under
# [bench_logs/]. This job runs five suites back to back, so its log is long
# enough that GitHub only serves a bounded tail of it: a suite that dies early
# has its crash output evicted by the thousands of lines [metrics.sh] emits
# afterwards. [ci_report_failed_bench_steps] replays the tail of whatever
# failed at the very end of the job, where it is still reachable.
echo 'run multiexec interface benchmarks'
kill_stale_benchmark_processes
ci_run_bench_step exec_scaling ./scripts/ci/exec_scaling.sh

echo 'run e2e payment benchmark'
kill_stale_benchmark_processes
ci_run_bench_step mempool_bench ./scripts/ci/mempool_bench.sh

echo 'run e2e payment multi-node benchmark'
# Skip the per-benchmark metrics-history commit; the combined run makes a
# single commit at the end via commit_metrics.sh.
kill_stale_benchmark_processes
ci_run_bench_step mempool_multi_node_bench \
  env MEMPOOL_MULTI_NODE_BENCH_SKIP_COMMIT_METRICS=1 \
  ./scripts/ci/mempool_multi_node_bench.sh

echo 'release hog4, hog5, hog6, hog7, and hog9'
# The suites below run on these hosts. One that reports it could not stop what
# it launched is about to be launched onto anyway, so this is a failure of the
# run rather than a line in the log: a benchmark process that keeps its ports
# past this point is what the next suite trips over, on a host nothing in its
# own output points at.
release_failed=0
ci_control_shutdown_hosts "$CONTROL_CLI" "$CI_CONTROL_PORT" hog4 hog5 hog6 hog7 hog9 ||
    release_failed=1

echo 'run event server benchmarks'
kill_stale_benchmark_processes
ci_run_bench_step event_bench ./scripts/ci/event_bench.sh

echo 'run metrics'
kill_stale_benchmark_processes
ci_run_bench_step metrics ./scripts/ci/metrics.sh

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

echo 'bench servers will be shut down by EXIT trap'

echo 'check for failures'
# [ci_report_failed_bench_steps] names each failed suite with its exit status
# and replays the tail of its captured output; [ci_report_bench_failures]
# replays the command that killed each suite. This job runs five suites into
# one log and GitHub serves only its tail, so an early failure is past the end
# of the retrievable window by the time the job finishes; these two reports are
# the surviving evidence.
bench_failed=0
ci_report_failed_bench_steps || bench_failed=1

ci_report_bench_failures

if [ "$release_failed" -ne 0 ]; then
    echo "FAILED: a host could not be cleared when released after mempool_multi_node_bench"
    bench_failed=1
fi

if [ "$bench_failed" -ne 0 ]; then
    echo "one or more benchmark steps failed"
    exit 1
fi


"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"


[jobs.host]
metrics_1 = "hog10"
