name = "e2e_payment_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'clear hogdb file directory'
rm -r ./work_dir/ || true
mkdir -p work_dir/

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'run bench server'
./release/hogd/hogexec/bench/control_server -p $CI_CONTROL_PORT -w work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog1"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=work_dir/

echo 'run mempool benchmarks'
(./scripts/ci/mempool_bench.sh) || true
mempool_bench_exit=$?

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

"""
after = """

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'cleanup control servers'
./release/hogd/hogexec/bench/control_cli hog1 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog6 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog7 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog8 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog9 $CI_CONTROL_PORT shutdown
./release/hogd/hogexec/bench/control_cli hog11 $CI_CONTROL_PORT shutdown

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"

[jobs.host]
metrics_1 = "hog10"
