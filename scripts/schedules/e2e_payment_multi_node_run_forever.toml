name = "e2e_payment_multi_node_run_forever_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

# Fetch Go dependencies before any lengthy Rust/C++ preparation or build.
bash ./scripts/ci/fetch_go_modules.sh || exit 1

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c clang -f "-fsanitize=address" -x -DX23_CORO_TRACE=1 -x "-DBUILD_BENCHMARKS=OFF" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel "$(nproc)" > build2.log 2>&1 || (cat build2.log && exit 1)
# These build scripts place the binaries in the current working directory, so we
# [pushd release] so that the binaries are placed in the [release] directory.
pushd release >/dev/null
../thruput-go/chuckd/scripts/build_chuckd.sh > build3.log 2>&1 || (cat build3.log && exit 1)
../thruput-go/chuckd/scripts/build_scpd.sh > build4.log 2>&1 || (cat build4.log && exit 1)
popd >/dev/null

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)
export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_THRUPUT_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_THRUPUT_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git config --global advice.detachedHead false
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'configure'
./scripts/build.sh -d release -t Release -c clang -f "-fsanitize=address" -x -DX23_CORO_TRACE=1 -x "-DBUILD_BENCHMARKS=OFF" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel "$(nproc)" > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=ci_work_dir/
export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1

shutdown_bench_servers() {
  set +e
  ./release/hogd/hog_exec/bench/control_cli hog4 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog5 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog6 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog7 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog8 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog9 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog10 $CI_CONTROL_PORT shutdown
  ./release/hogd/hog_exec/bench/control_cli hog11 $CI_CONTROL_PORT shutdown
}
trap 'shutdown_bench_servers; rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT

echo 'run local bench server for hog10-hosted services'
mkdir -p ci_work_dir/
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w ci_work_dir/ &

echo 'run mempool benchmarks'
set +e
./scripts/ci/mempool_multi_node_bench_run_forever.sh
mempool_bench_exit=$?
set -e

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

echo 'bench servers will be shut down by EXIT trap'

echo 'check for failures'
if [ "$mempool_bench_exit" -ne 0 ]; then
    echo "mempool bench failed"
    exit 1
fi

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_THRUPUT_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_THRUPUT_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
metrics_1 = "hog10"
