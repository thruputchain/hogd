./scripts/ci/mempool_bench_rs.sh

echo 'commit metrics'
(./scripts/commit_metrics.sh) || true

"""
after = """

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'cleanup control servers'
./release/hogd/hog_exec/bench/control_cli hog4 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog5 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog6 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog7 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog8 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog9 $CI_CONTROL_PORT shutdown
./release/hogd/hog_exec/bench/control_cli hog11 $CI_CONTROL_PORT shutdown

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
