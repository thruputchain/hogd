name = "e2e_payment_rs_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
# The clone runs on every host of the job at once, and several hog_sched runs
# can be released together the moment the fleet frees up, so a burst of SSH
# connections reaches GitHub in the same second. GitHub answers such a burst by
# closing connections mid-handshake ("Connection closed by 140.82.116.3 port
# 22"), which fails the clone at second one and discards a run that has already
# spent its wait in the queue. Retry the two steps of the clone that talk to
# GitHub; both are idempotent, so a retry resumes rather than restarts. See
# issue #3649.
git_retry() {
  git_retry_attempt=1
  until "$@"; do
    if [ "$git_retry_attempt" -ge 5 ]; then
      echo "clone step failed after $git_retry_attempt attempts: $*" >&2
      return 1
    fi
    # $$ differs per host and per run, so the jitter spreads hosts that
    # collided on one attempt instead of lining them up again on the next.
    sleep $((git_retry_attempt * 15 + $$ % 15))
    git_retry_attempt=$((git_retry_attempt + 1))
  done
}

git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git_retry git fetch --quiet --depth 1 origin {{ .git_commit }}
git checkout --quiet {{ .git_commit }}
git_retry git submodule update --init --recursive --quiet

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'install chuckd-rs from registry (fail-fast before long hogd build)'
cargo install chuckd@0.1.9 --registry groundhog > cargo_install.log 2>&1 || (cat cargo_install.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1 -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build hogd'
cmake --build release --parallel "$(nproc)" > build2.log 2>&1 || (cat build2.log && exit 1)

cp "$HOME/.cargo/bin/chuckd" release/chuckd.dev

echo 'clear hog-db file directory'
rm -r ./work_dir/ || true
mkdir -p work_dir/

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'run bench server'
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
# The clone runs on every host of the job at once, and several hog_sched runs
# can be released together the moment the fleet frees up, so a burst of SSH
# connections reaches GitHub in the same second. GitHub answers such a burst by
# closing connections mid-handshake ("Connection closed by 140.82.116.3 port
# 22"), which fails the clone at second one and discards a run that has already
# spent its wait in the queue. Retry the two steps of the clone that talk to
# GitHub; both are idempotent, so a retry resumes rather than restarts. See
# issue #3649.
git_retry() {
  git_retry_attempt=1
