name = "event_bench_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_server"
script = """

set -x

# github.com can drop an SSH connection when the fleet dials it all at once:
# the hosts share an egress IP and hog_sched releases their jobs within
# milliseconds of each other, so a clone dies with "Connection closed by
# ... port 22" before the job has done any work. Retry the network steps with
# backoff and jitter rather than losing a whole run to one dropped connection.
git_retry() {
    for try in 1 2 3 4 5; do
        "$@" && return 0
        echo "attempt $try of '$*' failed; retrying" >&2
        sleep $(( try * 5 + RANDOM % 10 ))
    done
    echo "giving up on '$*' after 5 attempts" >&2
    return 1
}

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git_retry git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git_retry git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'clear hog-db file directory'
rm -r ./ci_work_dir/ || true
mkdir -p ci_work_dir/

echo 'run bench server'
./release/hogd/hog_exec/bench/control_server -p 11111 -w ci_work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
bench_1 = "hog11"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

# github.com can drop an SSH connection when the fleet dials it all at once:
# the hosts share an egress IP and hog_sched releases their jobs within
# milliseconds of each other, so a clone dies with "Connection closed by
# ... port 22" before the job has done any work. Retry the network steps with
# backoff and jitter rather than losing a whole run to one dropped connection.
git_retry() {
    for try in 1 2 3 4 5; do
        "$@" && return 0
        echo "attempt $try of '$*' failed; retrying" >&2
        sleep $(( try * 5 + RANDOM % 10 ))
    done
    echo "giving up on '$*' after 5 attempts" >&2
    return 1
}

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git_retry git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git_retry git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
    ./scripts/build.sh -d release -t Release -c gcc

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

export BUILD_DIR=release
export WORK_DIR=ci_work_dir/

echo 'run event server benchmarks'
./scripts/ci/event_bench.sh

echo 'commit metrics'
./scripts/commit_metrics.sh

"""
after = """

echo 'shut down bench server'
./release/hogd/hog_exec/bench/control_cli hog11 11111 shutdown

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
metrics_1 = "hog10"
