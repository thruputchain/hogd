name = "fuzz_rv32_engine_diff_ci"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build clang fuzzers'
./scripts/build.sh -d build/ -c clang -f "-fsanitize=address" -t Release -x "-DBUILD_FUZZERS=ON" -x "-DBUILD_BENCHMARKS=OFF" -n

echo 'build rv32 fuzz targets'
cmake --build build --parallel "$(nproc)" --target rv32_fuzz_engine_diff rv32_fuzz_artifact

mkdir -p ${HOG_DUMP_DIR}/core_dumps

# -jobs, not -fork: clang 23's prebuilt libFuzzer crashes the -fork
# coordinator. Its RunOneMergeJob (compiler-rt FuzzerFork.cpp) zero-fills
# SIZE_MAX elements whenever a job leaves an input without a feature file,
# which jobs routinely do. -jobs runs independent fuzzers sharing the corpus
# directory and never enters that code. Each job logs to fuzz-<n>.log in the
# working directory and libFuzzer copies every finished log to its own output,
# far too much for CI at one job per core, so that output goes to a file and
# only failing jobs' logs are printed. (No backslashes here: this is a TOML
# basic string.)
run_fuzzer() {
  local name="$1" binary="$PWD/$2" corpus="$PWD/$3" seconds="$4"
  local log_dir="$PWD/build/fuzz_logs/$name"
  local status=0 failed shown=0
  mkdir -p "$log_dir"
  (
    cd "$log_dir"
    "$binary" -jobs="$(nproc)" -workers="$(nproc)" -max_total_time="$seconds" -artifact_prefix="${HOG_DUMP_DIR}/core_dumps/${name}_crash_" "$corpus"
  ) >"$log_dir/main.log" 2>&1 || status=$?
  echo "$name: exit $status, $(awk '/^Done [0-9]+ runs/ {n += $2} END {print n + 0}' "$log_dir"/fuzz-*.log) runs, $(find "$corpus" -type f | wc -l) corpus inputs"
  if [ "$status" -ne 0 ]; then
    failed=$(awk '$2 == "Job" && $4 == "exited" && $7 != "0" {print $3}' "$log_dir/main.log")
    echo "$name: failing jobs:" $failed
    for job in $failed; do
      [ "$shown" -lt 3 ] || break
      echo "=== $name job $job: last 200 lines of fuzz-$job.log ==="
      tail -n 200 "$log_dir/fuzz-$job.log"
      shown=$((shown + 1))
    done
    if [ -z "$failed" ]; then
      tail -n 200 "$log_dir/main.log"
    fi
  fi
  return "$status"
}

echo 'run rv32_fuzz_engine_diff for 15 minutes'
run_fuzzer engine_diff build/hogd/hog_exec/runtime/rv32/rv32_fuzz_engine_diff hogd/hog_exec/runtime/rv32/fuzz/corpus/engine_diff 900

echo 'run rv32_fuzz_artifact for 5 minutes'
run_fuzzer artifact build/hogd/hog_exec/runtime/rv32/rv32_fuzz_artifact hogd/hog_exec/runtime/rv32/fuzz/corpus/artifact 300

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
fuzz_1 = "?"
