name = "fuzz_rv32_engine_diff_ci"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

# github.com can drop an SSH connection when the fleet dials it all at once:
# the hosts share an egress IP and hog_sched releases their jobs within
# milliseconds of each other, so a clone dies with "Connection closed by
# ... port 22" before the job has done any work. Retry the network steps with
# backoff and jitter rather than losing a whole run to one dropped connection.
git_retry() {
    for try in 1 2 3 4 5; do
        "$@" && return 0
        echo "attempt $try of '$*' failed; retrying" >&2
        sleep $(( try * 5 + RANDOM % 10 ))
    done
    echo "giving up on '$*' after 5 attempts" >&2
    return 1
}

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git_retry git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git_retry git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build clang fuzzers'
./scripts/build.sh -d build/ -c clang -f "-fsanitize=address" -t Release -x "-DBUILD_FUZZERS=ON" -x "-DBUILD_BENCHMARKS=OFF" -n

echo 'build rv32 fuzz targets'
cmake --build build --parallel "$(nproc)" --target rv32_fuzz_engine_diff rv32_fuzz_artifact

mkdir -p ${HOG_DUMP_DIR}/core_dumps

echo 'run rv32_fuzz_engine_diff for 15 minutes'
./build/hogd/hog_exec/runtime/rv32/rv32_fuzz_engine_diff \
    -fork=$(nproc) \
    -max_total_time=900 \
    -artifact_prefix=${HOG_DUMP_DIR}/core_dumps/engine_diff_crash_ \
    hogd/hog_exec/runtime/rv32/fuzz/corpus/engine_diff

echo 'run rv32_fuzz_artifact for 5 minutes'
./build/hogd/hog_exec/runtime/rv32/rv32_fuzz_artifact \
    -fork=$(nproc) \
    -max_total_time=300 \
    -artifact_prefix=${HOG_DUMP_DIR}/core_dumps/artifact_crash_ \
    hogd/hog_exec/runtime/rv32/fuzz/corpus/artifact

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
fuzz_1 = "?"
