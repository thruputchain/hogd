name = "hackathon_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -ex

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --quiet --depth 1 origin {{ .git_commit }}
git checkout --quiet {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive --quiet

# Fetch Go dependencies before any lengthy Rust/C++ preparation or build.
bash ./scripts/ci/fetch_go_modules.sh || exit 1
GOWORK=off go -C hogd/loadgen/hackathon/replay mod download

source ./scripts/ci/prepare_env.sh

# Build only on the host that serves public RPC, before the long C++ build.
if [[ "{{ .hog_host }}" == "hog4" ]]; then
  echo 'fetch and build the pinned RPC gateway'
  gateway_revision=408592926fee05bdf58f22230d67ce0a5225159b
  # thruput-xdr 0.55.0 has the same wire definitions as this protocol revision.
  gateway_protocol_revision=af043b5c1983c0c8b44683975a3c389369844e09
  if [[ "$(git -C protocol rev-parse HEAD)" != "$gateway_protocol_revision" ]]; then
    echo 'Update the gateway pin after qualifying the new hogd protocol' >&2
    exit 1
  fi
  mkdir -p release/gateway-source
  git -C release/gateway-source init --quiet
  git -C release/gateway-source remote add origin https://github.com/thruputchain/thruput-tools.git
  git -C release/gateway-source fetch --quiet --depth 1 origin "$gateway_revision"
  git -C release/gateway-source checkout --quiet --detach FETCH_HEAD
  gateway_target="$PWD/release/gateway-target"
  (
    cd release/gateway-source
    export GROUNDHOG_SOURCE_COMMIT="$gateway_revision"
    cargo build --locked --release --target-dir "$gateway_target" \
      -p thruput-json-rpc-gateway --bin hog-gateway --features heap-profiling
  ) > gateway-build.log 2>&1 || (cat gateway-build.log && exit 1)
  cp "$gateway_target/release/hog-gateway" release/hog-gateway
  python3 - "$gateway_revision" "$gateway_protocol_revision" <<'PYGATEWAY'
import hashlib, json, pathlib, subprocess, sys
binary = pathlib.Path('release/hog-gateway')
source = pathlib.Path('release/gateway-source')
identity = {
    'repository': 'https://github.com/thruputchain/thruput-tools.git',
    'revision': sys.argv[1],
    'protocolRevision': sys.argv[2],
    'protocol': 'hogp/' + sys.argv[2][:15],
    'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
    'cargoLockSha256': hashlib.sha256((source / 'Cargo.lock').read_bytes()).hexdigest(),
    'rustc': subprocess.check_output(['rustc', '--version'], cwd=source, text=True).strip(),
    'profile': 'release',
    'features': ['heap-profiling'],
}
pathlib.Path('release/hackathon-gateway.json').write_text(json.dumps(identity, indent=2))
print(json.dumps(identity, indent=2))
PYGATEWAY
fi

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1
# These build scripts place the binaries in the current working directory, so we
# [pushd release] so that the binaries are placed in the [release] directory.
pushd release >/dev/null
../groundhog-go/chuckd/scripts/build_chuckd.sh > build3.log 2>&1 || (cat build3.log && exit 1)
../groundhog-go/chuckd/scripts/build_scpd.sh > build4.log 2>&1 || (cat build4.log && exit 1)
popd >/dev/null

echo 'build standalone gateway replay client'
GOWORK=off go -C hogd/loadgen/hackathon/replay build -o "$PWD/release/hackathon-replay" .

echo 'clear hog-db file directory'
rm -r ./work_dir/ || true
mkdir -p work_dir/

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'run bench server'
./release/hogd/hog_exec/bench/control_server -p $CI_CONTROL_PORT -w work_dir/

"""

[jobs.env]
HACKATHON_USERS = "{{ .hackathon_users }}"
HACKATHON_RATE_MULTIPLIER = "{{ .hackathon_rate_multiplier }}"
HACKATHON_OUTSTANDING = "{{ .hackathon_outstanding }}"
HACKATHON_RECEIPT_WORKERS = "{{ .hackathon_receipt_workers }}"
HACKATHON_GATEWAY_BATCH_SHARDS = "{{ .hackathon_gateway_batch_shards }}"
HACKATHON_GATEWAY_INFLIGHT_BATCHES = "{{ .hackathon_gateway_inflight_batches }}"
HACKATHON_GATEWAY_WORKERS = "{{ .hackathon_gateway_workers }}"
HACKATHON_REUSE_CORPUS = "{{ .hackathon_reuse_corpus }}"
HACKATHON_REPEATS = "{{ .hackathon_repeats }}"
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog9"
bench_5 = "hog11"
bench_6 = "hog5"
bench_7 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_benchmark"
file_out = ["work_dir/hackathon-results.tar.gz"]
script = """

set -ex

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --quiet --depth 1 origin {{ .git_commit }}
git checkout --quiet {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive --quiet

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

export BUILD_DIR=release
export WORK_DIR=work_dir/

echo 'start local benchmark control server'
mkdir -p work_dir/
./release/hogd/hog_exec/bench/control_server -p "$CI_CONTROL_PORT" -w work_dir/ < /dev/null > work_dir/control.log 2>&1 &
control_pid=$!
cleanup_benchmark_job() {
  local status=$?
  trap - EXIT
  timeout 30s ./release/hogd/hog_exec/bench/control_cli hog10 "$CI_CONTROL_PORT" shutdown || true
  kill "$control_pid" 2>/dev/null || true
  wait "$control_pid" 2>/dev/null || true
  rm -f -- "$GIT_CONFIG_GLOBAL"
  exit "$status"
}
trap cleanup_benchmark_job EXIT

echo 'run single-validator hackathon benchmark'
# hog_sched feeds this shell through a PTY. Keep child SSH/SCP commands from
# consuming its remaining commands, including the final exit and cleanup.
./scripts/ci/hackathon_bench.sh < /dev/null

"""
after = """

echo 'set port env vars'
export CI_CONTROL_PORT=$(./release/hogd/utils/get_port kCIControlServerPort)

echo 'cleanup control servers'
source ./scripts/ci/bench_harness.sh
ci_control_shutdown_hosts ./release/hogd/hog_exec/bench/control_cli "$CI_CONTROL_PORT" hog4 hog5 hog6 hog7 hog8 hog9 hog11

"""

[jobs.env]
HACKATHON_USERS = "{{ .hackathon_users }}"
HACKATHON_RATE_MULTIPLIER = "{{ .hackathon_rate_multiplier }}"
HACKATHON_OUTSTANDING = "{{ .hackathon_outstanding }}"
HACKATHON_RECEIPT_WORKERS = "{{ .hackathon_receipt_workers }}"
HACKATHON_GATEWAY_BATCH_SHARDS = "{{ .hackathon_gateway_batch_shards }}"
HACKATHON_GATEWAY_INFLIGHT_BATCHES = "{{ .hackathon_gateway_inflight_batches }}"
HACKATHON_GATEWAY_WORKERS = "{{ .hackathon_gateway_workers }}"
HACKATHON_REUSE_CORPUS = "{{ .hackathon_reuse_corpus }}"
HACKATHON_REPEATS = "{{ .hackathon_repeats }}"
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
benchmark_1 = "hog10"
