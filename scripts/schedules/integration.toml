name = "integration_ci"

# loadgen

[[jobs]]
name = "{{ .hog_schedule }}_loadgen"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1
make -C release -j$(nproc)

export BUILD_DIR="$(pwd)/release"

echo 'start loadgen'

cleanup() {
    status=$?
    trap - EXIT INT TERM # Prevent re-entry into the trap handler
    (kill -9 ${server_pid} 2>/dev/null) || true
    exit $status
}
trap cleanup EXIT INT TERM

./release/hogd/loadgen/loadgen_server --port 44400
server_pid=$!

./scripts/wait-port localhost 44400

hog_signal loadgen_is_up

hog_wait done

"""

[jobs.host]
1 = "hog7"

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"

# coordinator_loadgen

[[jobs]]
name = "{{ .hog_schedule }}_coordinator_loadgen"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}
git submodule update --init --recursive

echo 'build chuckd'
source ./groundhog-go/chuckd/scripts/setup_go.sh
./groundhog-go/chuckd/scripts/build_chuckd.sh

echo 'build scpd'
source ./groundhog-go/chuckd/scripts/setup_cargo.sh
./groundhog-go/chuckd/scripts/build_scpd.sh

hog_wait loadgen_is_up mempool_is_up

echo 'start coordinator_loadgen'

METRIC="integration" \
LABEL="1v" \
HOST="${HOG_HOST}" \
NODE="{{ .hog_host_key }}-of-{{ .hog_host_count }}" \
HOST_JOBS_DIR="./scripts/schedules/host_jobs" \
./groundhog-go/chuckd/scripts/schedules/blue/launch_with_metrics.sh ./chuckd.dev ./scpd.dev

hog_signal done

"""
after = """
killall scpd.dev chuckd.dev || true
"""

