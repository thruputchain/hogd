# scheduler

[[jobs]]
name = "{{ .hog_schedule }}_scheduler"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --quiet --no-progress
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1
make -C release -j$(nproc)

export BUILD_DIR="$(pwd)/release"

echo 'start scheduler'

cleanup() {
    status=$?
    trap - EXIT INT TERM # Prevent re-entry into the trap handler
    (kill -9 ${server_pid} 2>/dev/null) || true
    exit $status
}
trap cleanup EXIT INT TERM

./release/hogd/mempool/mempool_exec --num-db-shards 1 --num-exec-shards 3 --db-port 8072 --event-port 8073 --executor-port 8071 --auth-port 8074 --coordinator-port 8070 # number of db servers, number of exec servers
server_pid=$!

# Wait for mempool (ports 8070-8073).
./scripts/wait-port localhost 8070
./scripts/wait-port localhost 8071
./scripts/wait-port localhost 8072
./scripts/wait-port localhost 8073

hog_signal mempool_is_up

hog_wait done

"""

