name = "makespan_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'build (1 of 2)'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=0 -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build (2 of 2)'
cmake --build release --parallel "$(nproc)" --target control_server hog-db hog-exec hog-event hog-indexer > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clear hog-db file directory'
mkdir -p ci_work_dir/

echo 'run bench server'
./release/hogd/hog_exec/bench/control_server -p 11111 -w ci_work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_THRUPUT_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_THRUPUT_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog11"
bench_5 = "hog5"
# Hosts the indexer each topology now runs, so exec counts stay what they
# were before the indexer was added to this benchmark.
bench_6 = "hog4"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=0 -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
# makespan_runner deploys the fibonacci and storage_reads contracts at genesis,
# so this also builds the RV32 guest contracts.
cmake --build release --parallel "$(nproc)" --target makespan_runner control_cli > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'wait for bench servers'
./scripts/wait-port.sh hog7 11111
./scripts/wait-port.sh hog8 11111
./scripts/wait-port.sh hog11 11111
./scripts/wait-port.sh hog6 11111
./scripts/wait-port.sh hog5 11111
./scripts/wait-port.sh hog4 11111

# hog7 event, hog8 db, hog4 indexer, then up to three executors.
EXEC_HOSTS=(hog5 hog11 hog6)
NEXEC="{{ .executors }}"
case "$NEXEC" in
  1|2|3) ;;
  *) echo "executors must be 1, 2 or 3, got '$NEXEC'" >&2; exit 1 ;;
esac
SERVERS=(-s hog7 -s hog8 -s hog4)
for host in "${EXEC_HOSTS[@]:0:$NEXEC}"; do
  SERVERS+=(-s "$host")
done

echo "launch makespan runner with $NEXEC executor(s)"
set -o pipefail
./release/hogd/hog_exec/bench/makespan_runner "${SERVERS[@]}" \
  -f "{{ .fib_n }}" \
  -r "{{ .heavy_reads }}" \
  -l "{{ .n_light }}" \
  -H "{{ .n_heavy }}" \
  -b "{{ .light_batch }}" \
  -t "{{ .trials }}" \
  | tee makespan_runner_log || exit 1

echo 'summary'
grep -E '^(makespan_(config|summary)|probe):' makespan_runner_log

"""
after = """

echo 'cleanup control servers'
./release/hogd/hog_exec/bench/control_cli hog7 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog8 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog11 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog6 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog5 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog4 11111 shutdown

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_THRUPUT_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_THRUPUT_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_THRUPUT_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_THRUPUT_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_THRUPUT_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
metrics_1 = "hog10"
