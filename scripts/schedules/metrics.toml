name = "metrics_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_server"
host = ["hog11"]
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hogexec/bench/control_server -p 11111 -w ci_work_dir/

"""
[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"

[[jobs]]
name = "{{ .hog_schedule }}_metrics"
host = ["hog10"]
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

echo 'build'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

echo 'run metrics'
export BUILD_DIR=release
source ./scripts/ci/metrics.sh

echo 'commit metrics'
./scripts/commit_metrics.sh

"""
after = """

echo 'shut down bench server'
./release/hogd/hogexec/bench/control_cli hog11 11111 shutdown

"""
[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
