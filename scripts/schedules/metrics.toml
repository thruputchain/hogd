name = "metrics_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_server"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}

source ./scripts/ci/configure_git_cache.sh

git submodule update --init --recursive --quiet

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1 -x "-DBUILD_BENCHMARKS=OFF" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
make -C release -j$(nproc) > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'run bench server'
mkdir -p ci_work_dir/
./release/hogd/hogexec/bench/control_server -p 11111 -w ci_work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"

[jobs.host]
bench_1 = "hog11"
bench_2 = "hog8"

[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

source ./scripts/ci/configure_git_cache.sh

git submodule update --init --recursive --quiet

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1 -x "-DBUILD_BENCHMARKS=OFF" -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
make -C release -j$(nproc) > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clone metrics history'
./scripts/clone_metrics_history.sh

export BUILD_DIR=release

echo 'run metrics'
./scripts/ci/metrics.sh

echo 'commit metrics'
./scripts/commit_metrics.sh

"""
after = """

echo 'shut down bench server'
./release/hogd/hogexec/bench/control_cli hog11 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog8 11111 shutdown

"""
[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
metrics_1 = "hog10"
