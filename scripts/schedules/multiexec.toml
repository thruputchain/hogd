name = "multiexec_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)
source ./scripts/ci/prepare_glibc_2_43.sh "$(pwd -P)/release/glibc-2.43" > glibc.log 2>&1 || (cat glibc.log && exit 1)

echo 'build (1 of 2)'
./scripts/build.sh -d release -t Release -c gcc \
  -x -DX23_CORO_TRACE=0 \
  -x "$HOG_GLIBC_2_43_CMAKE_LOADER_FLAG" \
  -x "$HOG_GLIBC_2_43_CMAKE_RPATH_FLAG" \
  -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build (2 of 2)'
cmake --build release --parallel "$(nproc)" --target control_server hog-db hog-exec hog-event > build2.log 2>&1 || (cat build2.log && exit 1)
./scripts/ci/verify_glibc_2_43_binary.sh ./release/hogd/hog_exec/bench/control_server

echo 'clear hog-db file directory'
mkdir -p ci_work_dir/

echo 'run bench server'
./release/hogd/hog_exec/bench/control_server -p 11111 -w ci_work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog11"
bench_5 = "hog5"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)
source ./scripts/ci/prepare_glibc_2_43.sh "$(pwd -P)/release/glibc-2.43" > glibc.log 2>&1 || (cat glibc.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc \
  -x -DX23_CORO_TRACE=0 \
  -x "$HOG_GLIBC_2_43_CMAKE_LOADER_FLAG" \
  -x "$HOG_GLIBC_2_43_CMAKE_RPATH_FLAG" \
  -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
cmake --build release --parallel "$(nproc)" --target multiexec_runner control_cli > build2.log 2>&1 || (cat build2.log && exit 1)
./scripts/ci/verify_glibc_2_43_binary.sh ./release/hogd/hog_exec/bench/multiexec_runner

echo 'wait for bench servers'
./scripts/wait-port.sh hog7 11111
./scripts/wait-port.sh hog8 11111
./scripts/wait-port.sh hog11 11111
./scripts/wait-port.sh hog6 11111
./scripts/wait-port.sh hog5 11111

echo 'launch multiexec runner one exec'
./release/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -s hog5 -a 100

echo 'launch multiexec runner two exec'
./release/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog5 -a 100

echo 'launch multiexec runner three exec'
./release/hogd/hog_exec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog6 -s hog5 -a 100

"""
after = """

echo 'cleanup control servers'
./release/hogd/hog_exec/bench/control_cli hog7 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog8 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog11 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog6 11111 shutdown
./release/hogd/hog_exec/bench/control_cli hog5 11111 shutdown

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
metrics_1 = "hog10"
