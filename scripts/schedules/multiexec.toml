name = "multiexec_ci"

[[jobs]]
name = "{{ .hog_schedule }}_bench_servers"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'build (1 of 2)'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1 -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build (2 of 2)'
make -C release -j$(nproc) control_server hogdb_exec hogexec event_exec > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'clear hogdb file directory'
mkdir -p ci_work_dir/

echo 'run bench server'
./release/hogd/hogexec/bench/control_server -p 11111 -w ci_work_dir/

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"

[jobs.host]
bench_1 = "hog6"
bench_2 = "hog7"
bench_3 = "hog8"
bench_4 = "hog11"
bench_5 = "hog5"
bench_6 = "hog4"
bench_7 = "hog9"


[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d release -t Release -c gcc -x -DX23_CORO_TRACE=1 -n > build1.log 2>&1 || (cat build1.log && exit 1)

echo 'build'
make -C release -j$(nproc) multiexec_runner control_cli > build2.log 2>&1 || (cat build2.log && exit 1)

echo 'wait for bench servers'
./scripts/wait-port.sh hog7 11111
./scripts/wait-port.sh hog8 11111
./scripts/wait-port.sh hog11 11111
./scripts/wait-port.sh hog6 11111
./scripts/wait-port.sh hog5 11111
./scripts/wait-port.sh hog4 11111
./scripts/wait-port.sh hog9 11111

echo 'launch multiexec runner one exec'
./release/hogd/hogexec/bench/multiexec_runner -s hog7 -s hog8 -s hog5 -a 100

echo 'launch multiexec runner two exec'
./release/hogd/hogexec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog5 -a 100

echo 'launch multiexec runner three exec'
./release/hogd/hogexec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog6 -s hog5 -a 100

echo 'launch multiexec runner four exec'
./release/hogd/hogexec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog6 -s hog5 -s hog4 -a 100

echo 'launch multiexec runner five exec'
./release/hogd/hogexec/bench/multiexec_runner -s hog7 -s hog8 -s hog11 -s hog6 -s hog5 -s hog4 -s hog9 -a 100

"""
after = """

echo 'cleanup control servers'
./release/hogd/hogexec/bench/control_cli hog7 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog8 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog11 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog6 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog5 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog4 11111 shutdown
./release/hogd/hogexec/bench/control_cli hog9 11111 shutdown
"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"

[jobs.host]
metrics_1 = "hog10"
