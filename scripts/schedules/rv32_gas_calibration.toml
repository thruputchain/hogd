name = "rv32_gas_calibration"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

source ./scripts/ci/configure_git_cache.sh

# Only what a configure needs. The rv32_gas_calibrate target itself links just
# the RV32 ISA core, but CMake configures the whole project before it can build
# anything.
git submodule update --init --recursive \
   protocol \
   external/rocksdb \
   external/model-checker \
   external/googletest \
   external/benchmark \
   external/crc32c \
   external/blake3 \
   external/corrosion \
   built_contracts/integration_test_contracts

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

# Configure Release with an explicitly pinned compiler. Both halves matter.
#
# Release because the measured engine is the *compiled* interpreter: -O3,
# -march, and LTO across the interpreter's translation units all reach the hot
# path, and rv32_gas_calibrate refuses to measure anything else.
#
# Pinned compiler because the costs are a property of the generated code. The
# engine fingerprint is deliberately compiler-independent, so it will not catch
# a compiler change -- only the numbers move, silently. Every run recording the
# same compiler is what makes them comparable over time.
echo 'configure release'
#
# Benchmarks on, because the syscall half of the measurement is a Google
# Benchmark binary. Only the two targets below are built, so this costs the
# configure and nothing else.
./scripts/build.sh -d build/release -t Release -c gcc -x "-DBUILD_BENCHMARKS=ON" -n \
  > configure.log 2>&1 || (cat configure.log && exit 1)

echo 'build rv32_gas_calibrate'
cmake --build build/release --parallel "$(nproc)" --target rv32_gas_calibrate \
  > build.log 2>&1 || (cat build.log && exit 1)

# The syscall path is measured by a second binary, because it needs the
# protocol XDR, the DB proxy and the snapshot cache and the calibration
# harness deliberately links none of them.
echo 'build rv32_syscall_entry_bench'
cmake --build build/release --parallel "$(nproc)" \
  --target rv32_syscall_entry_bench \
  > build_syscall.log 2>&1 || (cat build_syscall.log && exit 1)

mkdir -p ${HOG_DUMP_DIR}

CHECK_RESULT=0
SYSCALL_CHECK_RESULT=0

# `reference` produces the numbers and prints a reference file without gating;
# that is how a new host is bootstrapped, since the committed reference holds
# costs as ratios measured somewhere else. `check` (the default) gates.
if [ "{{ .mode }}" = "reference" ]; then

  echo 'running calibration (reference mode, not gating)'
  ./scripts/rv32_gas_calibrate.sh build/release \
    --out ${HOG_DUMP_DIR}/rv32-gas-calibration.json

  echo '===== per-opcode costs ====='
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json

  echo '===== syscall dispatch (the ecall seam) ====='
  # The crossing every syscall pays, measured on bench hardware rather than a
  # container. Not a syscall: the production syscall path is not linked into
  # this harness, so this is the floor under a syscall's fixed cost and not the
  # cost itself.
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json --syscalls

  echo '===== validation workloads ====='
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json --workloads

  echo '===== additivity: do the per-opcode costs predict real programs? ====='
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json --predict

  # The point of the whole harness. Gas costs have to come from the machine
  # class that runs the chain, not from whatever laptop or container generated
  # them, so print the proposal here where it is measured on bench hardware.
  #
  # One run: the report says so itself, and says which distinctions not to
  # trust because of it. Dispatch this workflow a few times and pass the
  # collected JSON to --schedule together before adopting anything -- it merges
  # runs, takes the highest cost each context reached, and marks the cells that
  # did not reproduce.
  echo '===== proposed gas schedule from this host ====='
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json \
    --schedule

  # Take the file, not the text below. This log is JSON-encoded on its way
  # out, so a copy-paste of the printed block arrives with \u003e for > and
  # \" for " -- which parses (comments are stripped) but leaves the
  # regeneration command the file documents literally wrong.
  # Syscalls. Run after the opcode calibration so the two JSONs describe the
  # same host and the same engine, which is what lets the report join them:
  # nanoseconds come from the benchmark and the gas unit from the calibration's
  # baseline instruction, and a join across hosts would produce a complete,
  # plausible, wrong schedule.
  # Never fails the job, in either mode. Syscall costs are not gated -- there
  # is no committed reference for them -- so a syscall row that cannot run is
  # news to read in the log, not a reason to lose the opcode calibration that
  # ran beside it. Learned the hard way: one bad VerifySignature row aborted
  # the benchmark mid-write, and the truncated JSON then crashed the report and
  # took the whole run down with it.
  echo '===== syscall costs on the production entry path ====='
  # The benchmark's own console output is always shown, not only on failure.
  # A row the benchmark skips prints its reason there and nowhere else, and the
  # binary still exits 0 -- so hiding this log on success is how a run reports
  # a syscall it could not measure without ever saying why.
  ./scripts/rv32_syscall_bench.sh build/release \
    --out ${HOG_DUMP_DIR}/rv32-syscall-bench.json > syscall_bench.log 2>&1 \
    || true
  grep -vE 'Connecting to event server|Opening block' syscall_bench.log || true

  # An independent measurement of the same two primitives, on the same host and
  # with the same pinning. The benchmark times hogd's own code, so a harness
  # mistake shows up as a plausible number rather than as a failure -- one
  # VerifySignature row shipped timing ed25519's rejection path. openssl is the
  # second opinion. SHA256 is the sharp half of it: crypto.h calls
  # SHA256_Init/Update/Final, so both sides run one libcrypto and the per-byte
  # terms should agree closely.
  ./scripts/rv32_openssl_speed.sh --out ${HOG_DUMP_DIR}/rv32-openssl-speed.json \
    || true

  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --crosscheck ${HOG_DUMP_DIR}/rv32-openssl-speed.json || true

  # The point of running this here rather than on a laptop: syscall gas is a
  # protocol constant and has to come from the machine class that runs the
  # chain.
  #
  # Printed twice, at no margin and at 5%. The zero-margin numbers are what the
  # measurement says; their only headroom is the rounding up to the next whole
  # gas, which at resolution 1 is a couple of percent -- narrower than this
  # benchmark's own run-to-run spread. How much margin a protocol constant
  # deserves is a policy call rather than a measurement, so the run shows both
  # and leaves the choice to whoever adopts them.
  echo '===== proposed syscall gas costs from this host (no margin) ====='
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --gas ${HOG_DUMP_DIR}/rv32-gas-calibration.json --schedule || true

  echo '===== the same, with a 5% margin ====='
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --gas ${HOG_DUMP_DIR}/rv32-gas-calibration.json --schedule --margin 5 \
    || true

  echo '===== proposed reference.txt for this host ====='
  echo 'To adopt: copy ${HOG_DUMP_DIR}/rv32-gas-reference.txt from this host'
  echo 'over hogd/hog_exec/runtime/rv32/gas_calibration/reference.txt'
  ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json \
    --emit-reference | tee ${HOG_DUMP_DIR}/rv32-gas-reference.txt

  # The syscall half of the same bootstrap. Emitted here rather than gated,
  # because the ratios in the committed file were measured on some other host
  # and this mode exists to replace them with this one's.
  echo '===== proposed syscall_reference.txt for this host ====='
  echo 'To adopt: copy ${HOG_DUMP_DIR}/rv32-syscall-reference.txt from this'
  echo 'host over'
  echo 'hogd/hog_exec/runtime/rv32/gas_calibration/syscall_reference.txt'
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --emit-reference | tee ${HOG_DUMP_DIR}/rv32-syscall-reference.txt || true

else

  echo 'running calibration and checking it against the committed reference'
  ./scripts/rv32_gas_check.sh build/release \
    --out ${HOG_DUMP_DIR}/rv32-gas-calibration.json > check.log 2>&1 \
    || CHECK_RESULT=$?
  cat check.log

  if [ $CHECK_RESULT -ne 0 ]; then
    # A failure here is one of two things, and the check output says which: the
    # engine fingerprint moved (a fusion rule, gas cost, or run limit changed,
    # so the calibration behind the current gas costs describes a different
    # interpreter), or a guarded worst-case cost doubled relative to the
    # baseline. Neither is fixed by regenerating the reference.
    echo '===== per-opcode costs from the failing run ====='
    ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json || true
    echo '===== syscall dispatch (the ecall seam) ====='
    ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json \
      --syscalls || true
    echo '===== validation workloads ====='
    ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json \
      --workloads || true
    echo '===== additivity ====='
    ./scripts/rv32_gas_report.py ${HOG_DUMP_DIR}/rv32-gas-calibration.json \
      --predict || true
  fi

  # Syscall costs are measured on every run and, since there is now a committed
  # reference, gated too -- see the syscall check below. The benchmark itself
  # still never fails the job: a row that cannot run is news to read in the log
  # rather than a reason to lose the opcode calibration beside it, and the gate
  # reports that row as unchecked, which fails for the right reason and says so.
  echo '===== syscall costs on the production entry path ====='
  ./scripts/rv32_syscall_bench.sh build/release \
    --out ${HOG_DUMP_DIR}/rv32-syscall-bench.json > syscall_bench.log 2>&1 \
    || true
  grep -vE 'Connecting to event server|Opening block' syscall_bench.log || true

  # The same independent check as reference mode; see the note there.
  ./scripts/rv32_openssl_speed.sh --out ${HOG_DUMP_DIR}/rv32-openssl-speed.json \
    || true
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --crosscheck ${HOG_DUMP_DIR}/rv32-openssl-speed.json || true
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --gas ${HOG_DUMP_DIR}/rv32-gas-calibration.json --schedule || true

  # The syscall gate. Unlike everything else in this block it can fail the job.
  #
  # What it adds over the opcode check above: that one guards the interpreter,
  # and the gas schedule's digest guards the syscall CONSTANTS against being
  # edited silently. Neither notices the engine drifting away from those
  # constants -- a syscall that doubles in cost while every constant sits still
  # is what leaves contracts underpaying, and before this nothing looked at it.
  #
  # Absent output is not a pass: the check fails when a guarded row was not
  # measured, so a benchmark that died halfway cannot report green.
  echo '===== syscall costs against the committed reference ====='
  ./scripts/rv32_syscall_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
    --check hogd/hog_exec/runtime/rv32/gas_calibration/syscall_reference.txt \
    || SYSCALL_CHECK_RESULT=$?

fi

# Lifecycle rows share the syscall binary and JSON, so metrics_history already
# preserves them. Report in the opcode unit, but do not introduce a timing gate
# until repeated bench-host measurements establish a reference.
echo '===== RV32 runtime lifecycle costs ====='
python3 ./scripts/rv32_lifecycle_report.py ${HOG_DUMP_DIR}/rv32-syscall-bench.json \
  --gas ${HOG_DUMP_DIR}/rv32-gas-calibration.json || true

# File the measurement before acting on the check. A run that failed the gate is
# the one whose numbers history most wants, so the exit is held until after.
#
# The JSON rather than the rendered tables: every table above is a view of it
# (./scripts/rv32_gas_report.py <file>), and --schedule merges several of these
# files into one gas proposal. Filing the JSON is what lets that merge happen
# from history rather than from shell access to the bench host.
#
# One file per commit, like every other metric here: a nightly re-run on a
# commit main has not moved off replaces the previous sample rather than adding
# to it. That is enough to merge several runs into a gas proposal -- runs are
# comparable when the engine fingerprint matches, not when the commit does, so
# the samples to merge are successive nights, not repeats of one night.
file_measurement() {
  # Absent when the calibration itself failed rather than the comparison -- a
  # build that will not run, a machine that will not hold still. Nothing to
  # file, and nothing wrong with the filing.
  if [ ! -s ${HOG_DUMP_DIR}/rv32-gas-calibration.json ]; then
    echo 'no calibration output to file'
    return 0
  fi

  echo 'clone metrics history'
  ./scripts/clone_metrics_history.sh || return $?

  echo 'log the calibration'
  ./scripts/log_metric.sh rv32-gas-calibration \
    ${HOG_DUMP_DIR}/rv32-gas-calibration.json || return $?

  # The syscall run alongside it. Filed separately because it is a separate
  # binary measuring a separate thing, and joined at read time by engine
  # fingerprint rather than by being stapled into one file -- which is what
  # lets a syscall run be compared against an opcode calibration from a
  # different night on the same silicon.
  #
  # Absent when the benchmark failed rather than the calibration; that is not a
  # filing failure, so it does not return non-zero.
  if [ -s ${HOG_DUMP_DIR}/rv32-syscall-bench.json ]; then
    echo 'log the syscall benchmark'
    ./scripts/log_metric.sh rv32-syscall-bench \
      ${HOG_DUMP_DIR}/rv32-syscall-bench.json || return $?
  else
    echo 'no syscall benchmark output to file'
  fi

  # The openssl cross-check, filed for the same reason as the other two: it is
  # a measurement of this host on this night, and the value of a sanity check
  # is mostly in its history. A ratio that has been 1.01x for months and is
  # suddenly 1.4x says something changed on the bench host, which a single run
  # in isolation cannot.
  if [ -s ${HOG_DUMP_DIR}/rv32-openssl-speed.json ]; then
    echo 'log the openssl cross-check'
    ./scripts/log_metric.sh rv32-openssl-speed \
      ${HOG_DUMP_DIR}/rv32-openssl-speed.json || return $?
  else
    echo 'no openssl cross-check output to file'
  fi

  echo 'commit metrics'
  ./scripts/commit_metrics.sh
}

METRICS_RESULT=0
file_measurement || METRICS_RESULT=$?

# The gate's verdict outranks a filing failure: a drifted calibration is the
# more urgent news, and its output is in the log above either way. But a filing
# failure still has to fail the job -- this script runs under `set -x` alone, so
# an unconditional `exit $CHECK_RESULT` would leave a green nightly that pushed
# nothing, which is the one failure nobody would notice.
if [ $CHECK_RESULT -ne 0 ]; then
  exit $CHECK_RESULT
fi

# After the opcode gate and the filing, for the same reason those are ordered
# that way: a drifted syscall cost is news worth failing on, and the run that
# found it is the one whose numbers history most wants.
if [ $SYSCALL_CHECK_RESULT -ne 0 ]; then
  exit $SYSCALL_CHECK_RESULT
fi

exit $METRICS_RESULT

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

# hog10, like every other job that commits to metrics_history: the push
# credentials live there, and a nightly time series wants the same silicon every
# night. The gate itself does not need the pin -- the reference holds costs as
# ratios to the baseline instruction measured in the same run, not nanoseconds.
[jobs.host]
metrics_1 = "hog10"

