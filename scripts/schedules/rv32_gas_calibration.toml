name = "rv32_gas_calibration"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

# This script is delivered by typing it into a remote pty, whose input buffer
# drops whatever arrives past ~4 KiB before the shell drains it -- silently,
# leaving a half-executed script and a confusing failure far from the cause.
# Keep it small. The reasoning behind each step is in
# docs/rv32/rv32-gas-calibration.md, not here.

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

source ./scripts/ci/configure_git_cache.sh

# Only what a configure needs; CMake configures the whole project regardless.
git submodule update --init --recursive \
   protocol \
   external/rocksdb \
   external/model-checker \
   external/googletest \
   external/benchmark \
   external/crc32c \
   external/blake3 \
   external/corrosion \
   built_contracts/integration_test_contracts

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

# Release, and a pinned compiler: the costs are a property of the generated
# code, and the engine fingerprint does not catch a compiler change.
echo 'configure release'
./scripts/build.sh -d build/release -t Release -c gcc -x "-DBUILD_BENCHMARKS=OFF" -n \
  > configure.log 2>&1 || (cat configure.log && exit 1)

echo 'build rv32_gas_calibrate'
cmake --build build/release --parallel "$(nproc)" --target rv32_gas_calibrate \
  > build.log 2>&1 || (cat build.log && exit 1)

mkdir -p ${HOG_DUMP_DIR}
J=${HOG_DUMP_DIR}/rv32-gas-calibration.json

# `reference` bootstraps a host without gating; `check` (the default) gates.
if [ "{{ .mode }}" = "reference" ]; then

  echo 'running calibration (reference mode, not gating)'
  ./scripts/rv32_gas_calibrate.sh build/release --out $J

  echo '===== per-opcode costs ====='
  ./scripts/rv32_gas_report.py $J

  echo '===== validation workloads ====='
  ./scripts/rv32_gas_report.py $J --workloads

  echo '===== additivity: do the costs predict real programs? ====='
  ./scripts/rv32_gas_report.py $J --predict

  # Gas costs have to come from the machine class that runs the chain, so the
  # proposal is printed here. This is one run; collect several and pass them
  # to --schedule together before adopting anything.
  echo '===== proposed gas schedule from this host ====='
  ./scripts/rv32_gas_report.py $J --schedule

  echo '===== proposed reference.txt for this host ====='
  echo 'To adopt: copy the block below over'
  echo 'hogd/hog_exec/runtime/rv32/gas_calibration/reference.txt'
  ./scripts/rv32_gas_report.py $J --emit-reference \
    | tee ${HOG_DUMP_DIR}/rv32-gas-reference.txt

else

  echo 'running calibration and checking it against the committed reference'
  CHECK_RESULT=0
  ./scripts/rv32_gas_check.sh build/release --out $J > check.log 2>&1 \
    || CHECK_RESULT=$?
  cat check.log

  if [ $CHECK_RESULT -ne 0 ]; then
    # Either the engine fingerprint moved or a guarded worst-case cost doubled;
    # the check output says which. Neither is fixed by regenerating.
    echo '===== per-opcode costs from the failing run ====='
    ./scripts/rv32_gas_report.py $J || true
    echo '===== validation workloads ====='
    ./scripts/rv32_gas_report.py $J --workloads || true
    echo '===== additivity ====='
    ./scripts/rv32_gas_report.py $J --predict || true
    exit $CHECK_RESULT
  fi

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

# Any bench host: they are the same hardware, so pinning one would only
# constrain scheduling without making the numbers more comparable. What keeps
# runs comparable across machines is that the reference holds costs as ratios to
# the baseline instruction measured in the same run, not as nanoseconds.
[jobs.host]
bench_1 = "?"
