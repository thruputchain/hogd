name = "sanitizer_ci"

# The ASAN/UBSAN matrix is split across two hosts that run in parallel: one
# clang job (asan Debug + asan Release + ubsan) and one gcc job (asan Debug +
# asan Release). ubsan is clang-only (gcc doesn't support -fsanitize-ignorelist)
# so it lives in the clang job. Each [[jobs]] block is dispatched to its own
# host ("?" = any available runner).

[[jobs]]
name = "{{ .hog_schedule }}_clang_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Google benchmark seems to add Werror in release builds, which for some reason
# interacts badly with asan (some kind of uninitialized variable in stdlib), so
# we disable benchmark builds. We disable it overall to save build time.

export ASAN_OPTIONS=abort_on_error=1
export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1

# Cap build parallelism at 64, same as the gcc job below: fanning out to all
# 128 hyperthreads OOMs the host (the OOM killer took out the login session's
# sd-pam, dropping the SSH job mid-build). Applies to all three builds below.
echo 'build clang asan'
./scripts/build.sh -d build/llvm_asan -c clang -f "-fsanitize=address" -t Debug -j 64 -x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF"

echo 'run llvm tests'
./scripts/ci/ctest_report.sh --test-dir build/llvm_asan --parallel --timeout 100 --output-on-failure

echo 'build clang asan release'
./scripts/build.sh -d build/llvm_asan_release -c clang -f "-fsanitize=address" -t Release -j 64 -x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF"

echo 'run llvm asan tests release'
./scripts/ci/ctest_report.sh --test-dir build/llvm_asan_release --parallel --timeout 100 --output-on-failure

# Gcc doesn't support ignorelist with ubsan, so the ubsan build is clang-only.
echo 'build clang ubsan'
./scripts/build.sh -d build/llvm_ubsan -c clang -f "-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-ignorelist=$(pwd)/.ubsan_ignorelist" -t Debug -j 64 -x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF"

echo 'run llvm ubsan tests'
export UBSAN_OPTIONS=print_stacktrace=1
export HOG_DEVNODE_EXIT_TIMEOUT_SECS=30
./scripts/ci/ctest_report.sh --test-dir build/llvm_ubsan --parallel --timeout 100 --output-on-failure

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
sanitizer_clang = "?"


[[jobs]]
name = "{{ .hog_schedule }}_gcc_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Google benchmark seems to add Werror in release builds, which for some reason
# interacts badly with asan (some kind of uninitialized variable in stdlib), so
# we disable benchmark builds. It's required for the gcc release build with asan.

export ASAN_OPTIONS=abort_on_error=1
export LSAN_OPTIONS=suppressions=$(pwd)/.lsan_suppress:print_suppressions=1

# Work around GCC PR 120201 in GCC 16.1 by avoiding the affected AVX-512
# codegen. Remove this once the CI compiler includes
# db1b9f9d978a0708e684cd33b5ba8da3accf541d (expected in GCC 16.2).
GCC_ASAN_ARCH="-DBUILD_ARCHITECTURE=x86-64-v3"

# Cap build parallelism at 64: the gcc asan TUs can each peak around 5GB in
# cc1plus, so fanning out to all 128 hyperthreads OOMs the host (the OOM killer
# took out the login session's sd-pam, dropping the SSH job). Applies to both
# the Debug and Release builds below.
echo 'build gcc asan'
./scripts/build.sh -d build/gcc_asan -c gcc -f "-fsanitize=address" -t Debug -j 64 -x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF" -x "$GCC_ASAN_ARCH"

echo 'run gcc tests'
./scripts/ci/ctest_report.sh --test-dir build/gcc_asan --parallel --timeout 100 --output-on-failure

# gcc release seems to be more likely broken than clang release?
echo 'build gcc asan release'
./scripts/build.sh -d build/gcc_asan_release -c gcc -f "-fsanitize=address" -t Release -j 64 -x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF" -x "$GCC_ASAN_ARCH"

echo 'run gcc tests release'
./scripts/ci/ctest_report.sh --test-dir build/gcc_asan_release --parallel --timeout 100 --output-on-failure

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
sanitizer_gcc = "?"
