name = "tidy"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
# Keep credentials out of tracing and the repository's stored remote URL.
set +x
umask 077
config_path="$(mktemp)"
for original_config in "${XDG_CONFIG_HOME:-$HOME/.config}/git/config" "$HOME/.gitconfig"; do
  if [ -f "$original_config" ]; then
    git config --file "$config_path" --add include.path "$original_config"
  fi
done
export GIT_CONFIG_GLOBAL="$config_path"
trap 'rm -f -- "$GIT_CONFIG_GLOBAL"' EXIT
export CARGO_NET_GIT_FETCH_WITH_CLI=true
git_token="{{ .git_token }}"
if [ -n "$git_token" ] && [ "$git_token" != '<no value>' ]; then
  git config --global --add "url.https://x-access-token:${git_token}@github.com/{{ .github_repo }}.git.insteadOf" "git@github.com:{{ .github_repo }}.git"
fi
set -x
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}
set +x
bash .github/actions/private-sources/git-config.sh "$git_token" "$GIT_CONFIG_GLOBAL"
set -x

source ./scripts/ci/configure_git_cache.sh

# Only bring in required submodules
git submodule update --init --recursive \
   protocol \
   external/rocksdb \
   external/model-checker \
   external/googletest \
   external/benchmark \
   external/crc32c \
   external/blake3 \
   external/corrosion \
   external/mldsa-native \
   built_contracts/integration_test_contracts

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror" -x "-DBUILD_BENCHMARKS=OFF" -n > configure.log 2>&1 || (cat configure.log && exit 1)

cmake --build build/llvm --parallel "$(nproc)" --target tidy_targets > build.log 2>&1 || (cat build.log && exit 1)

echo 'running clang-tidy'
TIDY_RESULT=0
./scripts/tidy.sh -d build/llvm > tidy.log 2>&1 || TIDY_RESULT=$?

if [ $TIDY_RESULT -ne 0 ]; then
    printf 'clang-tidy failed!\n'
    printf '\n===== tidy log =====\n'
    cat tidy.log
    printf '===== end tidy log =====\n\n'
    printf '\n===== filtered tidy log =====\n'
    ./scripts/filter_tidy_log.sh tidy.log
    printf '\n===== end filtered tidy log =====\n\n'
    exit 1
fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://crates.thruput.network/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://crates.thruput.network/api/v1/crates/"
# Published crates and pinned submodules retain the legacy registry identity.
CARGO_REGISTRIES_GROUNDHOG_LEGACY_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRIES_GROUNDHOG_LEGACY_CREDENTIAL_PROVIDER = "cargo:token"

[jobs.host]
cpp_1 = "?"
