name = "tidy"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

# github.com can drop an SSH connection when the fleet dials it all at once:
# the hosts share an egress IP and hog_sched releases their jobs within
# milliseconds of each other, so a clone dies with "Connection closed by
# ... port 22" before the job has done any work. Retry the network steps with
# backoff and jitter rather than losing a whole run to one dropped connection.
git_retry() {
    for try in 1 2 3 4 5; do
        "$@" && return 0
        echo "attempt $try of '$*' failed; retrying" >&2
        sleep $(( try * 5 + RANDOM % 10 ))
    done
    echo "giving up on '$*' after 5 attempts" >&2
    return 1
}

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git_retry git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

source ./scripts/ci/configure_git_cache.sh

# Only bring in required submodules
git_retry git submodule update --init --recursive \
   protocol \
   external/rocksdb \
   external/model-checker \
   external/googletest \
   external/benchmark \
   external/crc32c \
   external/blake3 \
   external/corrosion \
   built_contracts/integration_test_contracts

source ./scripts/ci/prepare_env.sh > prepare_env.log 2>&1 || (cat prepare_env.log && exit 1)

echo 'configure'
./scripts/build.sh -d build/llvm -t Debug -c clang -f "-Werror" -x "-DBUILD_BENCHMARKS=OFF" -n > configure.log 2>&1 || (cat configure.log && exit 1)

cmake --build build/llvm --parallel "$(nproc)" --target tidy_targets > build.log 2>&1 || (cat build.log && exit 1)

echo 'running clang-tidy'
TIDY_RESULT=0
./scripts/tidy.sh -d build/llvm > tidy.log 2>&1 || TIDY_RESULT=$?

if [ $TIDY_RESULT -ne 0 ]; then
    printf 'clang-tidy failed!\n'
    printf '\n===== tidy log =====\n'
    cat tidy.log
    printf '===== end tidy log =====\n\n'
    printf '\n===== filtered tidy log =====\n'
    ./scripts/filter_tidy_log.sh tidy.log
    printf '\n===== end filtered tidy log =====\n\n'
    exit 1
fi

"""

[jobs.env]
GIT_REPO = "{{ .github_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
cpp_1 = "?"
