name = "tsan_ci"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Google benchmark builds can interact badly with sanitizers, so we disable
# benchmark builds to save time and avoid spurious failures.
#
# Disable the C++23 <stacktrace> library: libbacktrace is not thread-safe
# and isn't built with TSAN annotations, so stacktrace-on-failure produces
# hundreds of bogus race reports inside libdwarf/libstdc++ symbolization.

# detect_deadlocks=0: TSAN's deadlock detector tracks held locks in a
# fixed-size per-thread array of 64 slots (compiler-rt
# sanitizer_deadlock_detector.h) and CHECK-aborts if you exceed it, even
# absent any real deadlock. ScalableMap::register_mutation_cb at
# hogd/ramdb/scalable_map.cc:417 intentionally locks all bucket mutexes
# at once (65k by default) to atomically install/uninstall the mutation
# callback, so we trip the limit. Disabling the detector does not affect
# data-race detection.
export TSAN_OPTIONS=halt_on_error=1:detect_deadlocks=0

TSAN_CMAKE_FLAGS=(-x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF" -x "-DHAVE_CXX_STACKTRACE=OFF" -x "-DHAVE_STD_STACKTRACE=OFF")

echo 'build gcc tsan'
./scripts/build.sh -d build/gcc_tsan -c gcc -f "-fsanitize=thread" -t Debug "${TSAN_CMAKE_FLAGS[@]}"

echo 'run gcc tests'
ctest --test-dir build/gcc_tsan --parallel --timeout 100 --output-on-failure

echo 'build clang tsan'
./scripts/build.sh -d build/llvm_tsan -c clang -f "-fsanitize=thread" -t Debug "${TSAN_CMAKE_FLAGS[@]}"

echo 'run llvm tests'
ctest --test-dir build/llvm_tsan --parallel --timeout 100 --output-on-failure

echo 'build clang tsan release'
./scripts/build.sh -d build/llvm_tsan_release -c clang -f "-fsanitize=thread" -t Release "${TSAN_CMAKE_FLAGS[@]}"

echo 'run llvm tsan tests release'
ctest --test-dir build/llvm_tsan_release --parallel --timeout 100 --output-on-failure

echo 'build gcc tsan release'
./scripts/build.sh -d build/gcc_tsan_release -c gcc -f "-fsanitize=thread" -t Release "${TSAN_CMAKE_FLAGS[@]}"

echo 'run gcc tests release'
ctest --test-dir build/gcc_tsan_release --parallel --timeout 100 --output-on-failure

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
tsan_1 = "?"
