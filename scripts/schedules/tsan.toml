name = "tsan_ci"

[[jobs]]
name = "{{ .hog_schedule }}_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Rust-side TSAN requires nightly + the rust-src component (so libstd
# can be rebuilt with -Zbuild-std). See hogd/rust/CMakeLists.txt for
# the toolchain/build-flag wiring that consumes these. Idempotent, so
# re-running the schedule on a host that already has them is cheap.
rustup toolchain install nightly --profile minimal
rustup component add rust-src --toolchain nightly

# prepare_env.sh fetches the normal locked workspace dependencies. The TSAN
# build also rebuilds std with nightly, which can introduce rust-src
# dependencies such as wasip1 that are not in the workspace lockfile.
CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly fetch \
    --manifest-path hogd/rust/Cargo.toml \
    -Zbuild-std=std,panic_abort

# Google benchmark builds can interact badly with sanitizers, so we disable
# benchmark builds to save time and avoid spurious failures.
#
# Disable the C++23 <stacktrace> library: libbacktrace is not thread-safe
# and isn't built with TSAN annotations, so stacktrace-on-failure produces
# hundreds of bogus race reports inside libdwarf/libstdc++ symbolization.

# detect_deadlocks=0: TSAN's deadlock detector tracks held locks in a
# fixed-size per-thread array of 64 slots (compiler-rt
# sanitizer_deadlock_detector.h) and CHECK-aborts if you exceed it, even
# absent any real deadlock. ScalableMap::register_mutation_cb at
# hogd/ramdb/scalable_map.cc:417 intentionally locks all bucket mutexes
# at once (65k by default) to atomically install/uninstall the mutation
# callback, so we trip the limit. Disabling the detector does not affect
# data-race detection.
#
# suppressions: suppress the libc++ std::promise/future shared-state lifetime
# reports produced by WorkerPool::submit. These reports dominate the suite
# after Rust TSAN instrumentation is correctly wired and obscure actionable
# races in application code.
#
# print_suppressions=0: the "ThreadSanitizer: Matched N suppressions" summary
# is written to stderr by every process that matches a suppression, including
# child processes whose stderr a test parses. hog_devnode_test's
# JsonLogFormatKeepsReadinessOnStdoutAndLogsJsonToStderr requires each stderr
# line from the devnode to be a JSON log record, so the summary failed the run
# whenever the child happened to trip the promise suppression. What is
# suppressed is documented in .tsan_suppress; we do not need it echoed per
# process.
export TSAN_OPTIONS="halt_on_error=1:detect_deadlocks=0:suppressions=$(pwd)/.tsan_suppress:print_suppressions=0"
export HOG_DEVNODE_STARTUP_TIMEOUT_SECS=180
export HOG_DEVNODE_EXIT_TIMEOUT_SECS=120

TSAN_CMAKE_FLAGS=(-x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF" -x "-DHAVE_CXX_STACKTRACE=OFF" -x "-DHAVE_STD_STACKTRACE=OFF" -x "-DRUST_TSAN=ON")

# build-std artifacts compiled before Rust TSAN flags are fixed can be reused
# incorrectly and trip rustc's sanitizer ABI-mismatch check.
rm -rf build/llvm_tsan build/llvm_tsan_release

# Cap build parallelism at 64, same as the asan/ubsan schedule: fanning out to
# all 128 hyperthreads OOMs the host (the OOM killer took out the login
# session's sd-pam, dropping the SSH job mid-build). Applies to both builds
# below.
echo 'build clang tsan'
./scripts/build.sh -d build/llvm_tsan -c clang -f "-fsanitize=thread" -t Debug -j 64 "${TSAN_CMAKE_FLAGS[@]}"

echo 'run llvm tests'
ctest --test-dir build/llvm_tsan --parallel --timeout 300 --output-on-failure

echo 'build clang tsan release'
./scripts/build.sh -d build/llvm_tsan_release -c clang -f "-fsanitize=thread" -t Release -j 64 "${TSAN_CMAKE_FLAGS[@]}"

echo 'run llvm tsan tests release'
ctest --test-dir build/llvm_tsan_release --parallel --timeout 300 --output-on-failure

# Rust mixed-language sanitizer builds use -Zexternal-clangrt, so keep this
# schedule on Clang's sanitizer runtime rather than mixing Rust LLVM
# instrumentation with GCC's libtsan.

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
tsan_1 = "?"


# A second TSAN job, on GCC, over the whole tree.
#
# Why a second job at all: GCC and Clang lower coroutines differently, and
# the difference is race-relevant. When a coroutine's initial_suspend() does
# not suspend, its body starts inside the ramp function, and GCC's ramp goes
# on touching the frame after the body returns -- it decrements a non-atomic
# use count stored in the frame and frees the frame when that reaches zero,
# and the body's own completion path decrements the same counter. If the body
# suspends and is resumed on another thread, those two decrements race and
# the frame is freed twice or leaked (#3615, found by the ASAN schedule's gcc
# tree as a heap-use-after-free, days after it could have been found here).
# Clang's ramp returns on suspend without touching the frame, so the job
# above cannot see this class of bug however long it runs.
#
# Why RUST_TSAN stays off here: the job above turns it on, which needs
# -Zsanitizer=thread plus -Zbuild-std on nightly, and -Zexternal-clangrt
# deliberately leaves the runtime to the C++ link -- mixing rustc's LLVM
# instrumentation with GCC's libtsan is what that job's closing comment says
# to avoid. Leaving the Rust crates uninstrumented sidesteps that entirely.
#
# Uninstrumented Rust is a blind spot rather than a source of noise, and
# since wasm was dropped it is a small one. TSAN records no loads or stores
# from Rust code, but its pthread and memcpy interceptors still fire, because
# those are link-time interposition rather than instrumentation. So races
# *inside* Rust go unreported (the clang job covers those), and false
# positives are confined to instrumented C++ touching memory whose ordering
# is established by Rust-side synchronization -- Rust's std::sync is
# futex-based on Linux, which TSAN cannot see through.
#
# There is very little of that left to worry about. The workspace is crypto,
# unified and test_ffi_bindings, none of which spawn a thread or use a lock,
# and the dependency graph has no rayon, tokio, crossbeam, parking_lot or
# futures in it. Dropping wasmtime took the one genuinely concurrent
# dependency out of the tree, along with the rustix mmap/munmap shadow
# problem that --cfg=rustix_use_libc in hogd/rust/CMakeLists.txt exists to
# work around (rustix is no longer in the lockfile at all; that rustflag is
# now dead and can be removed separately).

[[jobs]]
name = "{{ .hog_schedule }}_gcc_{{ .hog_host }}"
script = """

set -x

echo 'cloning hogd'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }}
git checkout {{ .git_commit }}
git submodule update --init --recursive

source ./scripts/ci/prepare_env.sh

# Same TSAN_OPTIONS as the clang job; see the comments there for why each is
# set. The suppression file is shared: its one entry is a libc++ std::promise
# pattern that libstdc++ does not produce, so it is inert here, but pointing
# at the same file keeps the two jobs from drifting.
export TSAN_OPTIONS="halt_on_error=1:detect_deadlocks=0:suppressions=$(pwd)/.tsan_suppress:print_suppressions=0"
export HOG_DEVNODE_STARTUP_TIMEOUT_SECS=180
export HOG_DEVNODE_EXIT_TIMEOUT_SECS=120

# Note the absence of -DRUST_TSAN=ON, which is the whole point of this job;
# no nightly toolchain or -Zbuild-std fetch is needed as a result. The
# architecture pin matches the sanitizer schedule's gcc job, which works
# around GCC PR 120201 by avoiding the affected AVX-512 codegen.
GCC_TSAN_CMAKE_FLAGS=(-x "-DENABLE_TEST_FFI=ON" -x "-DBUILD_BENCHMARKS=OFF" -x "-DHAVE_CXX_STACKTRACE=OFF" -x "-DHAVE_STD_STACKTRACE=OFF" -x "-DBUILD_ARCHITECTURE=x86-64-v3")

rm -rf build/gcc_tsan

# Debug only for now. The clang job above spends most of the schedule's
# 3600s budget on its two trees, and both jobs share that budget; add a
# Release tree here once a few runs have shown what this one costs.
echo 'build gcc tsan'
./scripts/build.sh -d build/gcc_tsan -c gcc -f "-fsanitize=thread" -t Debug -j 64 "${GCC_TSAN_CMAKE_FLAGS[@]}"

echo 'run gcc tsan tests'
ctest --test-dir build/gcc_tsan --parallel --timeout 300 --output-on-failure

# `set -e` aborts the script on a failing ctest, so this rm is reached only
# once the tests have passed; a tree whose tests failed survives for the
# core-dump collection in `after`. Keeping at most one tree resident is the
# same disk-quota concern as the sanitizer schedule (#3559).
rm -rf build/gcc_tsan

"""
after = """

if [ "${HOG_SCRIPT_EXIT:-}" != "0" ]; then

    echo 'saving core dumps and associated binaries'
    ./scripts/save_core_dumps.sh ${HOG_DUMP_DIR}/core_dumps

fi

"""

[jobs.env]
GIT_REPO = "{{ .git_repo }}"
GIT_COMMIT = "{{ .git_commit }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_REGISTRIES_GROUNDHOG_INDEX = "sparse+https://groundhog.dev/crates/api/v1/crates/"
CARGO_REGISTRIES_GROUNDHOG_SOURCE = "sparse+https://groundhog.dev/crates/api/v1/crates/"

[jobs.host]
tsan_gcc = "?"
