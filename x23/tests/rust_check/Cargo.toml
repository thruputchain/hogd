[package]
name = "x23c-rust-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["std"]
std = []
serde = ["dep:serde", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"
rpc_api = { version = "0.2.0", registry = "groundhog" }
schemars = "1"
serde = { version = "1", features = ["derive"], optional = true }
xdr-common = { version = "0.10.3", registry = "groundhog" }
xdrs = { version = "0.10.3", registry = "groundhog", features = ["alloc", "derive", "schemars"] }
