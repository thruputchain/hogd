[package]
name = "x23c-rust-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["std"]
std = []
serde = ["dep:serde", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"
thruput-rpc-api = "0.4.0"
schemars = "1"
serde = { version = "1", features = ["derive"], optional = true }
xdr-common = { package = "thruput-xdr-common", version = "0.18.0" }
xdrs = { package = "thruput-xdrs", version = "0.18.0", features = ["alloc", "derive", "repr", "schemars"] }
